<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>TKG Moments — The Khichiya Gravy</title>
<meta name="theme-color" content="#0B0B0C">
<meta name="description" content="TKG Moments — customer photos and Instagram moments from The Khichiya Gravy">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<!-- Instagram's own embed script, loads a single public post as a real
     embedded card from just its link. No API key/app needed. Loaded here
     directly since this is a fresh page load (unlike index.html, where
     Moments was reached via in-page navigation). -->
<script async src="https://www.instagram.com/embed.js"></script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<script>
// Same tiny anti-FOUC font-scale script as index.html, so a returning
// visitor's chosen text size carries over onto this standalone page too.
(function(){
  try{
    var scale = localStorage.getItem('tkg_font_scale');
    var sizes = { small: '92%', medium: '100%', large: '115%' };
    document.documentElement.style.fontSize = sizes[scale] || sizes.medium;
  }catch(e){}
})();
</script>

<script>
// Same anti-FOUC Theme Engine as index.html — reads the same shared
// tkg_theme key, so the ecosystem-wide theme choice carries over here too.
(function(){
  try{
    var theme = localStorage.getItem('tkg_theme');
    document.documentElement.setAttribute('data-tkg-theme', theme === 'dark' ? 'dark' : 'light');
  }catch(e){
    document.documentElement.setAttribute('data-tkg-theme', 'light');
  }
})();
</script>

<style>
<style>
/* ==========================================================================
   TOKENS
   White marble / Coal ember orange / Black charcoal / Warm gold
   ========================================================================== */
:root{
  /* ---- DARK PALETTE \u2014 used by the Owner Dashboard (#screen-dash).
     Re-calibrated to the TKG logo's own charcoal (sampled directly from
     the logo file: a warm red-brown black, not a neutral grey-black). ---- */
  --charcoal:       #160F0C;
  --charcoal-soft:  #221813;
  --ember-card:     #2A1E17;
  --ember-card-top: #32241B;
  --marble:         #FAF7F2;
  --marble-dim:     #EEEEEC;
  --marble-warm:    #F7F6F3;

  --grey-line:      #3D2E24;

  /* ---- LIGHT PALETTE — the customer-facing shell, cards, sheets.
     White/warm-ivory marble base, charcoal text, ember reserved for
     small accents per direction: "subtle, charcoal does the heavy lifting." ---- */
  --stone-base:      #F6F6F5;   /* shell background base — neutral, barely-there cool grey */
  --tkg-page-bg:     #FFFFFF;   /* Page Background material — Theme B (light), approved mockup value */
  --tkg-plain-border: #E6E3DD;  /* Plain Surface material — Theme B (light), approved mockup .card-line value */
  --tkg-plain-opaque-bg: #1A1815;  /* Plain Surface, opaque variant (floating system feedback like toast) — Theme B: inverse-of-page so it reads on top of any content */
  --tkg-plain-opaque-fg: #FFFFFF;
  /* Premium Marble material — Theme B (light page → black marble cards, opposite of page per approved mockup) */
  --tkg-marble-bg-color: #0F0E0C;
  --tkg-marble-image: url('tkg-marble-black.jpg');
  --tkg-marble-overlay: rgba(0,0,0,0.42);
  --tkg-marble-border: rgba(0,0,0,0.06);
  --tkg-marble-ink: #F2EFEA;
  --tkg-marble-ink-soft: rgba(242,239,234,0.72);
  --tkg-marble-ink-faint: rgba(242,239,234,0.55);
  /* Controls material — Theme B: dark fill, light text (inverse of page) */
  --tkg-ctrl-bg: #1A1815;
  --tkg-ctrl-fg: #FFFFFF;
  --stone-card:      rgba(255,255,255,0.62);   /* glass card — translucent, paired with backdrop-filter blur */
  --stone-card-alt:  rgba(255,255,255,0.5);   /* glass card, secondary layer — slightly more see-through */
  --stone-vein:      #C9C9C7;   /* marble crack-vein color — neutral grey, no warm bias */
  --stone-vein-soft: #DCDCDA;
  --stone-line:      rgba(255,255,255,0.65);   /* glass edge highlight instead of a flat hairline */
  --stone-divider:   rgba(28,24,21,0.14);   /* dashed dividers on translucent glass \u2014 needs to read as a line against the ticket strip's own see-through background, so kept independent of --stone-line (glass-card border) */
  --glass-blur:      18px;
  --ink:             #1C1815;   /* primary text \u2014 near-black, warm */
  --ink-soft:        #6B6256;   /* secondary text, warm grey-brown */
  --ink-faint:       #9C9286;   /* tertiary text, placeholders */

  /* ---- ACCENTS \u2014 shared by both palettes, used sparingly on light ---- */
  --ember:          #E85D2C;
  --ember-bright:   #FF7A45;
  --ember-deep:     #B8431D;
  --ember-glow:     #FAC646;   /* sampled from the TKG logo halo \u2014 warm gold-amber */
  --gold:           #C9A24B;
  --gold-bright:    #E0C170;
  --gold-deep:      #8F7430;   /* new \u2014 readable gold-on-white for text */
  --moments-ambient-bg:
    radial-gradient(ellipse 90% 55% at 50% 8%, rgba(232,93,44,0.30), transparent 60%),
    radial-gradient(ellipse 70% 45% at 50% 100%, rgba(184,67,29,0.22), transparent 65%),
    var(--charcoal);   /* branded glow instead of flat black \u2014 used behind Moments slides & IG embed */
  --grey-warm:      #8A8278;
  --success:        #4C7A4C;   /* slightly deepened for readability on white */
  --danger:         #B5392F;   /* slightly deepened for readability on white */

  --radius-lg: 18px;
  --radius-md: 12px;
  --radius-sm: 8px;
  --max-w: 430px;

  --font-display: 'Charcoal-Display', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --font-mono: 'SF Mono', 'Cascadia Mono', 'Consolas', monospace;

  --icon-inline:     18px;  /* icons sitting beside/above short label text — pills, ticket strip, directions, phone */
  --icon-standalone: 28px;  /* icons that ARE the tap target — bottom nav */

  /* ---- Bottom-nav icon colors. Star uses a gradient (see navStarGrad def
     at the icon itself) instead of a flat token. Message/About go
     monochrome ink per Deepak's direction; Journey reuses the app's
     existing semantic danger-red (already means "alert/closed" elsewhere)
     rather than a new one-off hex, matching the common Google-Maps-pin
     red he asked for. ---- */
  --nav-journey: var(--danger);

  /* ---- Glass lamination depth \u2014 makes a card read as a floating pane of
     glass rather than a flat panel with a thin outline. Three layers in one
     box-shadow: (1) inset top highlight, the light catching the top inner
     edge of the glass; (2) inset bottom shade, giving the glass a felt
     thickness; (3) a warm ember-tinted ambient glow further out for real
     depth, instead of a generic neutral-grey shadow; (4) a tight, close
     contact shadow that grounds the card so it doesn't look like it's
     hovering with no relation to the surface under it. ---- */
  --glass-depth:
    inset 0 1px 0 rgba(255,255,255,0.65),
    inset 0 -1px 0 rgba(28,24,21,0.05),
    0 16px 32px -16px rgba(184,67,29,0.30),
    0 3px 10px -4px rgba(28,24,21,0.16);
}

/* ==========================================================================
   OUTLINES material — the amber ember-frame system. Universal infrastructure
   (tokens, angle property, keyframes) lives here once; applied directly to
   each real Premium/Plain selector further down rather than via a shared
   class, since markup/classes stay untouched. Amber is fixed at 60%
   opacity in both themes — not a per-theme value, per the locked
   "amber never changes with theme" rule.

   Animation behaviour is the approved EXPERIENCE, not the mockup prototype's
   literal code: plays on load, one coordinated pulse every 10s across every
   framed surface at once (not staggered per-card), continues for ~60s total,
   then stops — leaving only the static border. Restarts the full sequence on
   every theme switch.
   ========================================================================== */
:root{ --tkg-amber-op: 0.6; }
@property --tkg-ember-angle{ syntax:'<angle>'; inherits:false; initial-value:0deg; }
@keyframes tkg-ember-pulse{
  0%{ --tkg-ember-angle:0deg; opacity:0; }
  2%{ opacity:1; }
  22%{ --tkg-ember-angle:360deg; opacity:0.85; }
  24%{ opacity:0; }
  100%{ --tkg-ember-angle:360deg; opacity:0; }
}

.menu-item, .fun-activity-card, .journey-option, .cs-review-card,
.review-teaser-card, .reg-card, .ticket-strip, .extra-chip, .hero-story-strip{
  position:relative;
}
.menu-item, .fun-activity-card, .journey-option, .cs-review-card,
.review-teaser-card, .reg-card, .bottom-nav, .ticket-strip, .extra-chip, .hero-story-strip,
#thanksOverlay, #khichiyaRunnerOverlay, #productPreviewSheet, #infoSheet{
  border-color:rgba(217,164,65, var(--tkg-amber-op)) !important;
}
.menu-item::before, .fun-activity-card::before, .journey-option::before,
.cs-review-card::before, .review-teaser-card::before, .reg-card::before,
.bottom-nav::before, .ticket-strip::before, .extra-chip::before, .hero-story-strip::before,
#thanksOverlay::before, #khichiyaRunnerOverlay::before,
#productPreviewSheet::before, #infoSheet::before{
  content:"";
  position:absolute;
  inset:0;
  border-radius:inherit;
  padding:1px;
  background:conic-gradient(from var(--tkg-ember-angle,0deg),
    transparent 0deg, transparent 330deg,
    rgba(250,198,110,0.95) 350deg, rgba(217,164,65,0.6) 358deg, transparent 360deg);
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask-composite:exclude;
  opacity:0;
  pointer-events:none;
}
body.tkg-ember-run .menu-item::before, body.tkg-ember-run .fun-activity-card::before,
body.tkg-ember-run .journey-option::before, body.tkg-ember-run .cs-review-card::before,
body.tkg-ember-run .review-teaser-card::before, body.tkg-ember-run .reg-card::before,
body.tkg-ember-run .bottom-nav::before, body.tkg-ember-run .ticket-strip::before, body.tkg-ember-run .hero-story-strip::before,
body.tkg-ember-run .extra-chip::before, body.tkg-ember-run #thanksOverlay::before,
body.tkg-ember-run #khichiyaRunnerOverlay::before, body.tkg-ember-run #productPreviewSheet::before,
body.tkg-ember-run #infoSheet::before{
  animation:tkg-ember-pulse 10s cubic-bezier(.22,.61,.36,1) 6;
}
/* Fainter divider variant — the dashed/solid rules inside a framed
   container read as hierarchy support, always half the frame's opacity. */
.ticket-divider{ border-left-color:rgba(217,164,65, calc(var(--tkg-amber-op) * 0.5)) !important; }
.fun-activity-row{ border-top-color:rgba(217,164,65, calc(var(--tkg-amber-op) * 0.5)) !important; }

/* ==========================================================================
   THEME ENGINE — Theme A overrides. One customer-chosen theme applies
   across the whole app (single localStorage key, read on every page); each
   material pass adds its Theme A values here as that material is
   completed, so this block grows in the same order as the material passes
   themselves. Page Background is the only material done so far.
   ========================================================================== */
html[data-tkg-theme="dark"]{
  --tkg-page-bg:     #0B0A09;   /* Page Background material — Theme A (dark), approved mockup value */
  --tkg-plain-border: rgba(255,255,255,0.1);   /* Plain Surface material — Theme A (dark), approved mockup .card-line value */
  --tkg-plain-opaque-bg: #FFFFFF;
  --tkg-plain-opaque-fg: #111111;
  /* Premium Marble material — Theme A (dark page → white marble cards, opposite of page) */
  --tkg-marble-bg-color: #F5F3EE;
  --tkg-marble-image: url('tkg-marble-white.jpg');
  --tkg-marble-overlay: rgba(255,255,255,0.5);
  --tkg-marble-border: rgba(255,255,255,0.08);
  --tkg-marble-ink: #1A1815;
  --tkg-marble-ink-soft: rgba(26,24,21,0.72);
  --tkg-marble-ink-faint: rgba(26,24,21,0.55);
  /* Controls material — Theme A: light fill, dark text (inverse of page) */
  --tkg-ctrl-bg: #FFFFFF;
  --tkg-ctrl-fg: #111111;

  /* Root ink tokens — Theme A (dark). Base :root only ever defined these
     once, for the light-theme page. Premium Marble cards never depended
     on that root value (each re-points --ink/--ink-soft/--ink-faint
     locally to --tkg-marble-ink*), so they were already correct in both
     themes. Plain Surface elements (ticket-strip/status card,
     hero-story-strip chip row, extra-chip dietary tags, and any other
     unscoped text) had no such override and stayed pinned to the
     light-theme near-black ink even after their own background flipped
     dark — producing dark-on-dark text. Fixed here at the root, once,
     rather than patching each component individually. Values reuse the
     already-approved --tkg-marble-ink (Theme B) light-on-dark palette,
     since that's the same "light text over dark surface" case already
     vetted against the mockup.
   */
  --ink:       #F2EFEA;
  --ink-soft:  rgba(242,239,234,0.72);
  --ink-faint: rgba(242,239,234,0.55);
}

*{box-sizing:border-box; margin:0; padding:0;}
html,body{
  background:var(--tkg-page-bg);
  color:var(--ink);
  font-family:var(--font-body);
  -webkit-tap-highlight-color:transparent;
  height:100%;
}
body{
  display:flex;
  justify-content:center;
  min-height:100vh;
  min-height:100dvh;
}
button{font-family:inherit; cursor:pointer;}
input{font-family:inherit;}
::selection{background:var(--ember); color:var(--marble);}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;}
}

/* ==========================================================================
   SHELL — Page Background material (approved mockup): flat, untextured.
   The old marble-vein/grain gradient stack here has been removed — that
   look now belongs only to Premium Marble surfaces (cards), not the page
   itself. This is also the app's true root container (not just <body>),
   so it's the element that must carry the Page Background, or the shell
   silently reverts to whatever hardcoded value it has and ignores this
   material everywhere below it.
   ========================================================================== */
.shell{
  width:100%;
  max-width:var(--max-w);
  min-height:100vh;
  min-height:100dvh;
  background:var(--tkg-page-bg);
  position:relative;
  display:flex;
  flex-direction:column;
}

/* Ambient warm glow removed (was .shell::before, an animated gold radial
   spanning 140% width x 38% height at the bottom of every screen, plus a
   110%x40% gold pooling layer at the top of the shell above) \u2014 neither was
   actually scoped to the logo/coal-ring area, so they washed warmth across
   the entire page instead. TKG's warmth now lives only in the logo itself
   and brand accents (buttons, active states) against a neutral marble
   shell. */

/* ==========================================================================
   TOP BAR — wordmark + ember status dot (signature element)
   ========================================================================== */
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:18px 20px 14px;
}
.wordmark{
  font-family:var(--font-display);
  color:var(--ink);
  display:flex;
  align-items:center;
  gap:8px;
}
.topbar-tagline{
  font-family:var(--font-body);
  font-weight:700;
  font-size:0.75rem;
  line-height:1.25;
  color:var(--ink-soft);
  max-width:60vw;
}
.topbar-tagline.tt-glow{
  animation:tt-glow-pulse 2.2s ease-out 1;
}
@keyframes tt-glow-pulse{
  0%{ color:var(--ember-deep); text-shadow:0 0 10px rgba(232,93,44,0.55); }
  100%{ color:var(--ink-soft); text-shadow:none; }
}


.status-pill{
  display:flex;
  align-items:center;
  gap:7px;
  font-size:0.6875rem;
  letter-spacing:0.04em;
  color:var(--ink-soft);
  padding:6px 10px;
  border-radius:20px;
  background:transparent;
  border:1px solid var(--tkg-plain-border);
}
.topbar-right{
  display:flex;
  align-items:center;
  gap:8px;
}
.lang-btn{
  display:flex;
  align-items:center;
  gap:4px;
  font-size:0.7188rem;
  font-weight:700;
  letter-spacing:0.02em;
  color:var(--ink);
  padding:6px 11px;
  border-radius:20px;
  background:transparent;
  border:1px solid var(--tkg-plain-border);
  transition:opacity 0.15s ease;
}
.text-size-btn{
  font-size:0.7188rem;
  font-weight:700;
  letter-spacing:0.01em;
  color:var(--ink);
  padding:6px 11px;
  border-radius:20px;
  background:transparent;
  border:1px solid var(--tkg-plain-border);
  transition:opacity 0.15s ease;
}
.text-size-btn:active, .lang-btn:active{opacity:0.6;}
.lang-btn.attention{animation:lang-btn-attention 2.2s ease-in-out 1;}
@keyframes lang-btn-attention{
  0%, 100%{box-shadow:0 0 0 0 rgba(232,93,44,0);}
  25%{box-shadow:0 0 0 5px rgba(232,93,44,0.16);}
  50%{box-shadow:0 0 0 0 rgba(232,93,44,0);}
  75%{box-shadow:0 0 0 5px rgba(232,93,44,0.1);}
}

.lang-sheet{
  position:fixed;
  left:50%;
  bottom:0;
  transform:translate(-50%, calc(100% + 60px));
  width:100%;
  max-width:var(--max-w);
  background:var(--tkg-page-bg);
  border-radius:22px 22px 0 0;
  padding:10px 20px calc(24px + env(safe-area-inset-bottom, 0px));
  box-shadow:0 -10px 40px rgba(28,24,21,0.18);
  transition:transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
  z-index:160;
}
.lang-sheet.show{transform:translate(-50%, 0);}
.lang-sheet-title{
  font-family:var(--font-display);
  font-weight:800;
  font-size:1.125rem;
  color:var(--ink);
  text-align:center;
  margin:6px 0 16px;
}
.lang-option{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:transparent;
  border:1.5px solid var(--tkg-plain-border);
  border-radius:var(--radius-md);
  padding:15px 16px;
  margin-bottom:10px;
  color:var(--ink);
}
.lang-option-native{font-size:0.9375rem; font-weight:700;}
.lang-option-check{opacity:0; color:var(--ember); font-weight:800; font-size:1rem;}
.lang-option.selected{border-color:var(--ember);}
.lang-option.selected .lang-option-check{opacity:1;}
.ember-dot{
  width:8px; height:8px;
  border-radius:50%;
  background:var(--success);
  box-shadow:0 0 0 0 rgba(92,138,92,0.6);
  flex-shrink:0;
}
.status-pill[data-state="offline"] .ember-dot{
  background:var(--ember);
  animation:ember-pulse 1.6s ease-in-out infinite;
}
.status-pill[data-state="syncing"] .ember-dot{
  background:var(--gold);
  animation:ember-pulse 0.9s ease-in-out infinite;
}
@keyframes ember-pulse{
  0%{box-shadow:0 0 0 0 rgba(232,93,44,0.55);}
  70%{box-shadow:0 0 0 6px rgba(232,93,44,0);}
  100%{box-shadow:0 0 0 0 rgba(232,93,44,0);}
}

/* ==========================================================================
   SCREENS
   ========================================================================== */
.screen{
  flex:1;
  display:none;
  flex-direction:column;
  padding:0 20px 28px;
  animation:fade-in 0.35s ease;
}
.screen.active{display:flex;}
#screen-dash{background:var(--charcoal);}
@keyframes fade-in{
  from{opacity:0; transform:translateY(6px);}
  to{opacity:1; transform:translateY(0);}
}

/* ---- Customer Journey (Screen 1) — first interaction, offline-only.
   Reuses .screen / showScreen() as-is. No new UI-switching mechanism. ---- */
.journey-back-link{
  display:inline-flex;
  align-items:center;
  gap:6px;
  background:none;
  border:none;
  color:var(--ink-soft);
  font-size:0.8125rem;
  font-weight:700;
  padding:8px 0 0;
  margin-top:8px;
}
.journey-back-link:active{ opacity:0.6; }

/* ---- TKG Moments (fullscreen vertical-swipe photo/Instagram viewer) ---- */
#screen-moments{ padding:0 !important; }
.moments-topbar{
  position:fixed;
  top:0; left:0; right:0;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:calc(env(safe-area-inset-top, 0px) + 12px) 16px 12px;
  background:linear-gradient(180deg, rgba(0,0,0,0.55), rgba(0,0,0,0));
  pointer-events:none;
}
.moments-back-btn{
  pointer-events:auto;
  background:rgba(28,24,21,0.45);
  border:none;
  color:#fff;
  font-size:0.8125rem;
  font-weight:700;
  padding:8px 14px;
  border-radius:20px;
}
.moments-back-btn:active{ opacity:0.7; }
.moments-stat{
  pointer-events:auto;
  color:#fff;
  font-size:0.75rem;
  font-weight:700;
  background:rgba(28,24,21,0.45);
  padding:8px 14px;
  border-radius:20px;
}
.moments-viewer{
  position:fixed;
  inset:0;
  overflow-y:auto;
  scroll-snap-type:y mandatory;
  background:var(--moments-ambient-bg);
  -webkit-overflow-scrolling:touch;
}
.moments-slide{
  position:relative;
  width:100%;
  height:100vh;
  height:100dvh;
  scroll-snap-align:start;
  scroll-snap-stop:always;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:var(--moments-ambient-bg);
}
.moments-slide-media{
  width:100%;
  height:100%;
  object-fit:cover;
}
.moments-slide-media-scroller{
  display:flex;
  width:100%;
  height:100%;
  overflow-x:auto;
  scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;
}
.moments-slide-media-scroller > .moments-slide-media{
  flex:0 0 100%;
  scroll-snap-align:start;
}
.moments-slide-media-dots{
  position:absolute;
  top:calc(env(safe-area-inset-top, 0px) + 16px);
  left:0; right:0;
  display:flex;
  justify-content:center;
  gap:5px;
  z-index:5;
  pointer-events:none;
}
.moments-slide-media-dots span{
  width:5px; height:5px;
  border-radius:50%;
  background:rgba(255,255,255,0.45);
}
.moments-slide-gradient{
  position:absolute;
  left:0; right:0; bottom:0;
  height:40%;
  background:linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.8) 100%);
  pointer-events:none;
}
.moments-slide-caption{
  position:absolute;
  left:16px; right:76px; bottom:calc(env(safe-area-inset-bottom, 0px) + 78px);
  color:#fff;
  font-size:0.9375rem;
  line-height:1.4;
  text-shadow:0 1px 4px rgba(0,0,0,0.4);
}
.moments-slide-actions{
  position:absolute;
  right:14px; bottom:calc(env(safe-area-inset-bottom, 0px) + 78px);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:16px;
  z-index:5;
}
.moments-heart-btn, .moments-share-btn, .moments-comment-btn{
  width:42px;
  height:42px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,0.15);
  background:rgba(0,0,0,0.38);
  backdrop-filter:blur(4px);
  display:flex;
  align-items:center;
  justify-content:center;
  transition:transform 0.18s ease, background 0.18s ease;
}
.moments-heart-btn svg, .moments-share-btn svg, .moments-comment-btn svg{
  width:21px; height:21px;
  filter:drop-shadow(0 1px 3px rgba(0,0,0,0.4));
}
.moments-heart-btn.liked{
  background:var(--ember);
  border-color:transparent;
  transform:scale(1.08);
}
.moments-heart-btn:active, .moments-share-btn:active, .moments-comment-btn:active{ transform:scale(0.9); }
.moments-slide-embed{
  background:var(--moments-ambient-bg);
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:16px;
  overflow-y:auto;
}
.moments-slide-embed .instagram-media{
  box-shadow:0 12px 40px rgba(0,0,0,0.5), 0 2px 10px rgba(0,0,0,0.35) !important;
  border-radius:14px !important;
}
.moments-empty, .moments-loading{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:#fff;
  background:#000;
  font-size:0.875rem;
  padding:32px 16px;
  z-index:10;
}
.moments-fab-row{
  position:fixed;
  left:16px; right:16px;
  bottom:calc(env(safe-area-inset-bottom, 0px) + 16px);
  z-index:20;
  display:flex;
  gap:10px;
}
.moments-fab{
  flex:1;
  background:var(--ember);
  color:#fff;
  border:none;
  border-radius:24px;
  padding:13px;
  font-size:0.8125rem;
  font-weight:700;
  box-shadow:0 6px 16px -6px rgba(0,0,0,0.5);
}
.moments-fab:active{ opacity:0.85; }
.moments-fab-secondary{
  background:rgba(255,255,255,0.15);
  backdrop-filter:blur(4px);
}
.moments-compose-overlay{
  position:fixed;
  inset:0;
  z-index:30;
  background:rgba(0,0,0,0.75);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.moments-compose-overlay.hidden{ display:none; }
.moments-compose-card{
  width:100%;
  max-width:360px;
  background:var(--stone-card);
  backdrop-filter:blur(var(--glass-blur));
  -webkit-backdrop-filter:blur(var(--glass-blur));
  border-radius:var(--radius-lg);
  padding:18px;
  max-height:90vh;
  max-height:90dvh;
  overflow-y:auto;
}
.moments-compose-grid{
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:8px;
  margin-bottom:14px;
}
.moments-compose-thumb-wrap{
  position:relative;
  width:100%;
  aspect-ratio:1;
  border-radius:var(--radius-md);
  overflow:hidden;
  background:#000;
}
.moments-compose-thumb-wrap img, .moments-compose-thumb-wrap video{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
.moments-compose-remove-badge{
  position:absolute;
  top:4px; right:4px;
  width:22px; height:22px;
  border-radius:50%;
  border:none;
  background:rgba(232,93,44,0.95);
  color:#fff;
  font-size:0.8rem;
  font-weight:700;
  line-height:1;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 2px 8px rgba(0,0,0,0.3);
}
.moments-compose-add-tile{
  width:100%;
  aspect-ratio:1;
  border-radius:var(--radius-md);
  border:2px dashed var(--hairline, rgba(0,0,0,0.15));
  background:none;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:1.5rem;
  color:var(--ink-soft);
}
.moments-status{
  font-size:0.75rem;
  color:var(--ink-soft);
  margin-top:8px;
  min-height:1em;
}
.moments-status.error{ color:var(--ember-deep, #B8431D); }
.moments-status.success{ color:var(--success, #4C7A4C); }

.journey-intro{
  margin-top:32px;
  margin-bottom:28px;
  text-align:center;
}
.journey-title{
  font-family:var(--font-display);
  font-weight:800;
  font-size:1.375rem;
  color:var(--ink);
  margin-bottom:8px;
}
.journey-subtitle{
  font-size:0.875rem;
  color:var(--ink-soft);
}
.journey-options{
  display:flex;
  flex-direction:column;
  gap:12px;
}
.journey-option{
  width:100%;
  text-align:left;
  padding:18px 20px;
  border-radius:16px;
  border:1px solid var(--tkg-marble-border);
  background-color:var(--tkg-marble-bg-color);
  background-image:linear-gradient(var(--tkg-marble-overlay), var(--tkg-marble-overlay)), var(--tkg-marble-image);
  background-size:auto, cover;
  background-position:center, center;
  font-size:1rem;
  font-weight:600;
  color:var(--tkg-marble-ink);
  --ink:var(--tkg-marble-ink);
  --ink-soft:var(--tkg-marble-ink-soft);
  transition:transform 0.12s ease, border-color 0.12s ease;
}
.journey-option:active{
  transform:translateY(1px) scale(0.99);
}

/* Subtle, non-intrusive affordance to revisit the Customer Journey choice —
   styled to match .owner-link exactly (same weight, same "quiet utility
   link" treatment) so it never competes visually with primary content. */
.change-journey-link{
  text-align:center;
  padding-top:8px;
}
.change-journey-link button{
  background:none;
  border:none;
  color:var(--grey-warm);
  font-size:0.75rem;
  letter-spacing:0.05em;
  text-decoration:underline;
  text-decoration-color:var(--grey-line);
  padding:8px;
}

/* ---- Business Status Card — live OPEN/CLOSED status. Sprint: Customer OS
   UI Polish (item 2). Same surface tokens as every other .stone-card card
   on this screen — no new palette. Icon/label/detail text are set by
   refreshBusinessStatusCard() in the script; this only styles the shell. ---- */
.business-status-card{
  display:flex;
  align-items:center;
  gap:10px;
  background:transparent;
  border:1px solid var(--tkg-plain-border);
  border-radius:var(--radius-md);
  padding:12px 16px;
  margin-bottom:16px;
}
.bsc-icon{ font-size:1.0625rem; flex-shrink:0; }
.bsc-label{
  font-size:0.8438rem;
  font-weight:700;
  letter-spacing:0.02em;
  color:var(--ink);
}
.business-status-card[data-open="true"] .bsc-label{ color:var(--ember-deep); }
.bsc-detail{
  font-size:0.7812rem;
  color:var(--ink-soft);
  margin-top:1px;
}

/* ==========================================================================
   TICKET HEADER REDESIGN — Sprint: Menu Header & Item Cards Redesign.
   Replaces the earlier collapsing-header approach entirely: rather than
   hiding content on scroll (animation-dependent, risked glitches across 3
   languages/2 text sizes), the header is now naturally short enough that
   nothing needs to hide. Same underlying elements/IDs as before
   (businessStatusCard/Icon/Label/Detail, journeyStatusCurrent,
   changeJourneyBtn, dgGreetingText/dgSubText, directionsLink,
   textSizeBtn/langBtn) — only the layout around them changed.
   ========================================================================== */

/* -- Settings pill (Aa + Language grouped, so they read as two distinct
      settings instead of two identical-looking circular icon buttons) -- */
.settings-pill{
  display:flex;
  align-items:center;
  gap:8px;
}
.settings-pill-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:1px;
}
.settings-pill-item .spi-value{
  font-size:0.75rem;
  font-weight:700;
  display:flex;
  align-items:center;
  gap:2px;
}
.settings-pill-item .spi-caption{
  font-size:0.5rem;
  letter-spacing:0.04em;
  color:var(--ink-soft);
  font-weight:600;
}
.settings-pill-divider{
  display:none;
}

/* -- Compact hero: one centered block instead of the old 3-line headline
      + separate tagline + separate icon-trail row -- */
.app-hero-compact{
  text-align:center;
  padding:6px 4px 14px;
  position:relative;
  overflow:hidden;
  border-radius:16px;
}
.hero-greeting-row{
  display:flex;
  align-items:center;
  gap:12px;
  margin-top:5px;
  position:relative;
  z-index:1;
}
.hero-logo-large{
  width:64px;
  height:64px;
  flex-shrink:0;
  border-radius:50%;
  object-fit:cover;
}
.hero-weather-backdrop{
  position:absolute;
  inset:0;
  z-index:0;
  opacity:0;
  pointer-events:none;
  transition:opacity 1.4s ease;
  overflow:hidden;
}
.hero-weather-backdrop.show{opacity:1;}

.hero-weather-backdrop.wx-morning{
  background:linear-gradient(180deg, #FDEBC9 0%, #FBD1A2 55%, rgba(251,209,162,0) 100%);
}
.hero-weather-backdrop.wx-morning::before,
.hero-weather-backdrop.wx-morning::after{
  content:'';
  position:absolute;
  top:18%;
  width:120px;
  height:34px;
  background:radial-gradient(ellipse at center, rgba(255,255,255,0.85), rgba(255,255,255,0) 70%);
  border-radius:50%;
  animation:wxCloudDrift 26s linear infinite;
}
.hero-weather-backdrop.wx-morning::before{left:-140px; animation-delay:0s;}
.hero-weather-backdrop.wx-morning::after{left:-140px; top:38%; animation-delay:-13s; opacity:0.7;}
@keyframes wxCloudDrift{
  0%{transform:translateX(0);}
  100%{transform:translateX(420px);}
}

.hero-weather-backdrop.wx-afternoon{
  background:linear-gradient(180deg, #EAF6FF 0%, #FBFEFF 60%, rgba(251,254,255,0) 100%);
}
.hero-weather-backdrop.wx-afternoon::before{
  content:'';
  position:absolute;
  top:-30px;
  left:-30px;
  width:130px;
  height:130px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(255,223,150,0.9), rgba(255,223,150,0) 70%);
  animation:wxSunPulse 4s ease-in-out infinite;
}
.hero-weather-backdrop.wx-afternoon::after{
  content:'';
  position:absolute;
  inset:0;
  background:radial-gradient(ellipse 90% 60% at 50% 40%, rgba(255,255,255,0.55), rgba(255,255,255,0) 70%);
  animation:wxHaze 3.5s ease-in-out infinite;
}
@keyframes wxSunPulse{
  0%,100%{opacity:0.75; transform:scale(1);}
  50%{opacity:1; transform:scale(1.08);}
}
@keyframes wxHaze{
  0%,100%{opacity:0.3;}
  50%{opacity:0.6;}
}

.hero-weather-backdrop.wx-evening{
  background:linear-gradient(180deg, #6E86B8 0%, #3C4C7A 55%, rgba(60,76,122,0) 100%);
  animation:wxEveningFall 70s ease-in forwards;
}
@keyframes wxEveningFall{
  0%{background:linear-gradient(180deg, #E89A6B 0%, #6E86B8 55%, rgba(110,134,184,0) 100%);}
  50%{background:linear-gradient(180deg, #6E86B8 0%, #3C4C7A 55%, rgba(60,76,122,0) 100%);}
  100%{background:linear-gradient(180deg, #2A2F4A 0%, #14131E 55%, rgba(20,19,30,0) 100%);}
}

.hero-weather-backdrop.wx-night{
  background:linear-gradient(180deg, #171A2E 0%, #0D0E18 55%, rgba(13,14,24,0) 100%);
}
.hero-weather-backdrop.wx-night::before{
  content:'';
  position:absolute;
  top:14%;
  left:22%;
  width:200px;
  height:200px;
  background:
    radial-gradient(1.5px 1.5px at 20px 30px, #fff, transparent),
    radial-gradient(1.5px 1.5px at 70px 10px, #fff, transparent),
    radial-gradient(1px 1px at 120px 50px, #fff, transparent),
    radial-gradient(1.5px 1.5px at 160px 20px, #fff, transparent),
    radial-gradient(1px 1px at 40px 70px, #fff, transparent),
    radial-gradient(1.5px 1.5px at 100px 90px, #fff, transparent);
  animation:wxTwinkle 3.2s ease-in-out infinite;
}
.hero-weather-backdrop.wx-night::after{
  content:'';
  position:absolute;
  top:16px;
  right:26px;
  width:22px;
  height:22px;
  border-radius:50%;
  background:#EDEFF7;
  box-shadow:-7px -2px 0 2px rgba(13,14,24,1);
}
@keyframes wxTwinkle{
  0%,100%{opacity:0.6;}
  50%{opacity:1;}
}

.hero-weather-backdrop.wx-monsoon{
  background:linear-gradient(180deg, #5A6572 0%, #3A424C 60%, rgba(58,66,76,0) 100%);
}
.hero-weather-backdrop .rain-drop{
  position:absolute;
  top:-60px;
  width:2px;
  height:46px;
  background:linear-gradient(180deg, rgba(220,230,240,0) 0%, rgba(220,230,240,0.75) 40%, rgba(220,230,240,0.9) 85%, rgba(220,230,240,0) 100%);
  border-radius:2px;
  animation:wxDrop linear infinite;
}
@keyframes wxDrop{
  0%{transform:translate(0, -60px);}
  100%{transform:translate(var(--drift, 6px), 190px);}
}
.hero-greeting-line{
  font-size:0.75rem;
  color:var(--ink-soft);
  text-align:left;
}
.greeting-headline-row{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:2px;
  cursor:pointer;
}
.greeting-icon{
  width:26px;
  height:26px;
  flex-shrink:0;
  transform-origin:50% 85%;
}
.greeting-icon.gi-tap{ animation:gi-pop 0.45s ease-out 1; }
@keyframes gi-pop{
  0%{ transform:scale(1) rotate(0deg); }
  35%{ transform:scale(1.18) rotate(-10deg); }
  65%{ transform:scale(1.05) rotate(7deg); }
  100%{ transform:scale(1) rotate(0deg); }
}
#dgGreetingText{
  font-family:var(--font-display);
  font-size:1.75rem;
  font-weight:800;
  line-height:1.1;
  color:var(--wx-text-color, var(--ember));
  text-shadow:0 0 14px var(--wx-text-glow, rgba(232,93,44,0.35));
}
.hero-sub-below{
  display:block;
  font-size:0.8125rem;
  color:var(--ink-soft);
  text-align:center;
  margin:8px 0 4px;
}

/* -- Ticket strip: Open/Closed + Hours + Journey as one boarding-pass-style
      row with dashed dividers, instead of two separate stacked cards -- */
.ticket-strip{
  display:flex;
  background:transparent;
  border:1px solid var(--tkg-plain-border);
  border-radius:14px;
  overflow:hidden;
}
.ticket-seg{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:2px;
  padding:12px 8px;
  background:none;
  border:none;
  color:var(--ink);
  text-align:center;
  min-width:0;
}
.ticket-divider{
  width:0;
  border-left:1px dashed var(--tkg-plain-border);
  margin:8px 0;
}
.ticket-seg-icon{width:var(--icon-inline); height:var(--icon-inline); flex-shrink:0;}
.ticket-seg-icon.status-dot{
  width:9px; height:9px;
  border-radius:50%;
  background:var(--success);
}
#businessStatusCard[data-open="false"] .status-dot{background:var(--danger);}
.ticket-seg-label{
  font-size:0.7188rem;
  font-weight:700;
  max-width:100%;
}
#changeJourneyBtn .ticket-seg-label{color:var(--ember);}
#changeJourneyBtn .ticket-seg-label::after{content:' \203A'; font-weight:700;}
.ticket-strip-footer{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  margin-top:6px;
  font-size:0.7188rem;
  color:var(--ink-soft);
}
.ticket-strip-footer .tsf-directions{
  display:flex;
  align-items:center;
  gap:3px;
  color:var(--ember);
  font-weight:600;
  text-decoration:none;
}
.ticket-strip-footer .tsf-directions .dl-icon{width:var(--icon-inline); height:var(--icon-inline);}

/* -- Menu item cards: warm tinted overlay unifies photo quality across
      items instead of showing raw photos large/prominent; bestseller
      becomes a small corner ribbon on the image, not inline text next to
      the name; Jain becomes an icon+short line instead of a text pill. -- */
.menu-item-thumb{position:relative; overflow:hidden;}
.menu-item-thumb::after{
  content:'';
  position:absolute;
  inset:0;
  background:linear-gradient(160deg, rgba(232,93,44,0.28), rgba(22,15,12,0.32));
  mix-blend-mode:multiply;
  pointer-events:none;
}
.thumb-ribbon{
  position:absolute;
  top:4px;
  left:4px;
  z-index:1;
  background:transparent;
  color:rgba(217,164,65, var(--tkg-amber-op));
  border:1px solid rgba(217,164,65, var(--tkg-amber-op));
  font-size:0.5rem;
  font-weight:700;
  letter-spacing:0.02em;
  padding:1px 7px;
  border-radius:100px;
  text-transform:uppercase;
}
.jain-line{
  display:flex;
  align-items:center;
  gap:5px;
  margin-top:5px;
  font-size:0.6875rem;
  color:var(--ink-soft);
}
.jain-line .jl-icon{font-size:0.75rem;}
.menu-item-side{
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  align-self:stretch;
  gap:8px;
  flex-shrink:0;
}
.menu-item-heart{
  font-size:1rem;
  color:var(--ink-soft);
  background:transparent;
  border:none;
  display:flex;
  align-items:center;
  justify-content:center;
  line-height:1;
  padding:0;
  margin-top:auto;
}
.menu-item-heart.liked{color:var(--ember);}


/* ==========================================================================
   FIXED QUICK ACTIONS BAR — Visual hierarchy redesign. Not page navigation:
   4 existing actions surfaced at thumb height so Reviews/FAQ/Register no
   longer need to occupy above-the-fold space. Visible only on the primary
   Menu screen (screen-menu); toggled in showScreen(). Every button calls a
   function that already existed — see navRateUsBtn/navMessageBtn/
   navAboutBtn/navJourneyBtn handlers near the bottom of the script
   (openCustomerStoriesSheet/openRegisterOverlay/openInfoSheet/showScreen).
   ========================================================================== */
.bottom-nav{
  position:fixed;
  left:50%;
  bottom:0;
  transform:translateX(-50%);
  width:100%;
  max-width:var(--max-w);
  display:flex;
  background-color:var(--tkg-marble-bg-color);
  background-image:linear-gradient(var(--tkg-marble-overlay), var(--tkg-marble-overlay)), var(--tkg-marble-image);
  background-size:auto, cover;
  background-position:center, center;
  border-top:1px solid var(--tkg-marble-border);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom, 0px));
  z-index:130;
  --ink:var(--tkg-marble-ink);
  --ink-soft:var(--tkg-marble-ink-soft);
}
.bottom-nav.hidden{ display:none; }
.bottom-nav-item{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:2px;
  background:none;
  border:none;
  padding:6px 2px;
  transition:opacity 0.12s ease;
}
.bottom-nav-item:active{ opacity:0.6; }
.bottom-nav-item .bn-icon{ width:var(--icon-standalone); height:var(--icon-standalone); display:block; margin:0 auto; }
.bottom-nav-item .bn-label{
  font-size:0.625rem;
  font-weight:600;
  color:var(--ink);
  white-space:nowrap;
}

/* Room for the fixed Quick Actions Bar so it never covers the last card on
   the Menu screen — every other screen keeps the original .screen padding. */
#screen-menu{
  padding-bottom:78px;
}

/* ---- Registration screen ---- */
.hero-block{
  margin-top:6px;
  margin-bottom:28px;
}
.hero-eyebrow{
  font-size:0.6875rem;
  letter-spacing:0.2em;
  text-transform:uppercase;
  color:var(--gold);
  font-weight:600;
  margin-bottom:10px;
}
.hero-title{
  font-family:var(--font-display);
  font-weight:800;
  font-size:1.875rem;
  line-height:1.15;
  letter-spacing:-0.01em;
  color:var(--ink);
}
.hero-title em{
  color:var(--ember);
  font-style:normal;
}
.hero-sub{
  margin-top:10px;
  font-size:0.875rem;
  color:var(--ink-soft);
  line-height:1.5;
}

.reg-card{
  background-color:var(--tkg-marble-bg-color);
  background-image:linear-gradient(var(--tkg-marble-overlay), var(--tkg-marble-overlay)), var(--tkg-marble-image);
  background-size:auto, cover;
  background-position:center, center;
  border:1px solid var(--tkg-marble-border);
  border-radius:16px;
  padding:24px 20px 22px;
  --ink:var(--tkg-marble-ink);
  --ink-soft:var(--tkg-marble-ink-soft);
  --ink-faint:var(--tkg-marble-ink-faint);
  color:var(--tkg-marble-ink);
}
/* Plain Surface material — these two sheets are utility data-entry, not
   primary content, so their .reg-card gets the flat bordered treatment
   instead of the shared component's default (Premium Marble, done in that
   material's pass for Registration/Taste Discovery/etc). The shared class
   itself stays untouched here — only these two IDs are scoped. */
#rateUsCaptureForm{
  background:transparent;
  backdrop-filter:none;
  -webkit-backdrop-filter:none;
  border:1px solid var(--tkg-plain-border);
  box-shadow:none;
  border-top:1px solid var(--tkg-plain-border);
}
.field-group{margin-bottom:16px;}
.field-label{
  display:block;
  font-size:0.75rem;
  font-weight:700;
  letter-spacing:0.04em;
  color:var(--ink);
  margin-bottom:7px;
  text-transform:uppercase;
}
.field-input{
  width:100%;
  padding:14px 14px;
  border-radius:var(--radius-md);
  border:1.5px solid #E2DDD3;
  background:#FFFFFF;
  color:#1C1815;
  font-size:1rem;
  outline:none;
  transition:border-color 0.15s ease, box-shadow 0.15s ease;
}
.field-input::placeholder{color:#B7AFA3;}
.field-input:focus{
  border-color:var(--ember);
  box-shadow:0 0 0 3px rgba(232,93,44,0.16);
}
.field-input.invalid{
  border-color:var(--danger);
}
.field-error{
  font-size:0.75rem;
  color:var(--danger);
  margin-top:6px;
  display:none;
  font-weight:500;
}
.field-error.show{display:block;}

textarea.field-input{
  min-height:96px;
  resize:vertical;
  font-family:inherit;
  line-height:1.5;
}

/* ==========================================================================
   FEEDBACK OVERLAY — post check-in, optional, never blocks the menu
   ========================================================================== */
.thanks-block{
  text-align:center;
  padding:6px 0 18px;
}
.thanks-icon{font-size:2.125rem; margin-bottom:8px;}
.thanks-title{
  font-family:var(--font-display);
  font-weight:800;
  font-size:1.25rem;
  color:var(--ink);
}
.thanks-sub{
  font-size:0.8125rem;
  color:var(--ink-soft);
  margin-top:6px;
  line-height:1.5;
}

.action-card{
  display:flex;
  align-items:center;
  gap:12px;
  width:100%;
  background:#FFFFFF;
  border:1.5px solid #E2DDD3;
  border-radius:var(--radius-md);
  padding:14px;
  margin-bottom:10px;
  text-decoration:none;
  text-align:left;
  font-family:inherit;
  cursor:pointer;
}
.action-card .ac-icon{font-size:1.375rem; flex-shrink:0;}
.action-card .ac-text{flex:1; min-width:0;}
.action-card .ac-title{
  font-size:0.8438rem;
  font-weight:700;
  color:var(--ink);
}
.action-card .ac-sub{
  font-size:0.6875rem;
  color:var(--grey-warm);
  margin-top:2px;
  line-height:1.4;
}
.action-card .ac-go{
  font-size:0.6875rem;
  font-weight:700;
  color:var(--ember);
  white-space:nowrap;
  flex-shrink:0;
}

.btn-primary{
  width:100%;
  padding:16px;
  border-radius:var(--radius-md);
  border:none;
  background:var(--tkg-ctrl-bg);
  color:var(--tkg-ctrl-fg);
  font-size:1rem;
  font-weight:700;
  letter-spacing:0.02em;
  transition:transform 0.12s ease, opacity 0.12s ease;
}
.btn-primary:active{transform:translateY(1px) scale(0.99); opacity:0.88;}
.btn-primary:disabled{opacity:0.4;}

.consent-line{
  margin-top:14px;
  font-size:0.7188rem;
  color:var(--grey-warm);
  text-align:center;
  line-height:1.5;
}

.trust-row{
  display:flex;
  gap:10px;
  margin-top:22px;
}
.trust-item{
  flex:1;
  text-align:center;
  font-size:0.6562rem;
  color:var(--grey-warm);
  letter-spacing:0.03em;
}
.trust-item .ti-mark{
  font-family:var(--font-display);
  font-weight:800;
  font-size:0.8125rem;
  color:var(--gold);
  display:block;
  margin-bottom:3px;
}

.owner-link{
  margin-top:auto;
  padding-top:24px;
  text-align:center;
}
.owner-link button{
  background:none;
  border:none;
  color:var(--grey-warm);
  font-size:0.75rem;
  letter-spacing:0.05em;
  text-decoration:underline;
  text-decoration-color:var(--grey-line);
  padding:8px;
}

/* ---- Welcome-back chip (returning customer) ---- */
.welcome-chip{
  display:none;
  align-items:center;
  gap:10px;
  background:rgba(201,162,75,0.1);
  border:1px solid rgba(201,162,75,0.35);
  border-radius:var(--radius-md);
  padding:11px 14px;
  margin-bottom:16px;
  font-size:0.8125rem;
  color:var(--gold-deep);
}
.welcome-chip.show{display:flex;}
.welcome-chip .wc-icon{font-size:1rem;}

/* ==========================================================================
   REGISTRATION OVERLAY (bottom sheet, optional, never blocks the menu)
   ========================================================================== */
.overlay-backdrop{
  position:fixed;
  inset:0;
  background:rgba(28,24,21,0.45);
  opacity:0;
  pointer-events:none;
  transition:opacity 0.25s ease;
  z-index:150;
}
.overlay-backdrop.show{
  opacity:1;
  pointer-events:auto;
}

.reg-overlay{
  position:fixed;
  left:50%;
  bottom:0;
  transform:translate(-50%, calc(100% + 60px));
  width:100%;
  max-width:var(--max-w);
  max-height:88vh;
  overflow-y:auto;
  background:var(--tkg-page-bg);
  border-radius:22px 22px 0 0;
  padding:10px 20px 28px;
  box-shadow:0 -10px 40px rgba(28,24,21,0.22);
  transition:transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
  z-index:160;
  -webkit-overflow-scrolling:touch;
}
.reg-overlay.show{
  transform:translate(-50%, 0);
}
/* Premium Marble material — these 4 sheets have no inner .reg-card, so the
   .reg-overlay panel itself IS the content (unlike Rate-Us/Geo/Reviews-list
   where .reg-overlay is just the plain mechanism around separate content). */
#thanksOverlay, #khichiyaRunnerOverlay, #productPreviewSheet, #infoSheet{
  background-color:var(--tkg-marble-bg-color);
  background-image:linear-gradient(var(--tkg-marble-overlay), var(--tkg-marble-overlay)), var(--tkg-marble-image);
  background-size:auto, cover;
  background-position:center, center;
  --ink:var(--tkg-marble-ink);
  --ink-soft:var(--tkg-marble-ink-soft);
  --ink-faint:var(--tkg-marble-ink-faint);
  color:var(--tkg-marble-ink);
}
.reg-overlay-handle{
  width:40px;
  height:4px;
  border-radius:3px;
  background:var(--grey-line);
  margin:8px auto 16px;
}

.optional-tag{
  font-weight:500;
  text-transform:none;
  letter-spacing:0;
  color:var(--grey-warm);
  font-size:0.6875rem;
}

/* ==========================================================================
   PRODUCT PREVIEW — bottom sheet, opened by tapping a Menu item card.
   Reuses .overlay-backdrop / .reg-overlay / .reg-overlay-handle as-is (same
   component already used by Registration/Language/Content sheets) — no new
   sheet mechanics, just this preview's own content inside it.
   ========================================================================== */
.product-preview-media{
  width:100%;
  aspect-ratio:4/3;
  border-radius:var(--radius-md);
  overflow:hidden;
  background:var(--tkg-marble-border);
  backdrop-filter:blur(var(--glass-blur));
  -webkit-backdrop-filter:blur(var(--glass-blur));
}
.product-preview-media img{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
}
.product-preview-body{
  padding-top:16px;
}
.product-preview-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}
.product-preview-name{
  font-family:var(--font-display);
  font-weight:700;
  font-size:1.1875rem;
  color:var(--ink);
}
.product-preview-desc{
  font-size:0.8438rem;
  color:var(--ink-soft);
  line-height:1.5;
  margin-top:6px;
}
.product-preview-price{
  margin-top:14px;
  text-align:left;
  font-size:1rem;
}
.product-preview-price .price-large{
  margin-top:3px;
}

/* Sprint: Menu Header & Item Cards Redesign — "How it's made" + "What's
   inside", shown only for items with recipe data (productPreviewRecipe
   stays .hidden otherwise, same pattern as productPreviewBadge). */
.product-preview-recipe{
  margin-top:16px;
  padding-top:14px;
  border-top:1px solid var(--stone-line);
}
.ppr-label{
  font-size:0.625rem;
  font-weight:700;
  letter-spacing:0.05em;
  text-transform:uppercase;
  color:var(--ink-soft);
  margin-bottom:4px;
}
.ppr-label:not(:first-child){margin-top:12px;}
.ppr-how{
  font-size:0.8125rem;
  color:var(--ink);
  line-height:1.5;
}
.ppr-chips{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}
.ppr-chip{
  font-size:0.6875rem;
  background:transparent;
  border:1px solid var(--tkg-marble-border);
  border-radius:20px;
  padding:4px 10px;
  color:var(--ink);
}

.source-chips{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}
.source-chip{
  padding:9px 14px;
  border-radius:20px;
  border:1.5px solid var(--tkg-marble-border);
  background:transparent;
  color:var(--ink);
  font-size:0.7812rem;
  font-weight:600;
}
.source-chip.selected{
  background:var(--ember);
  border-color:var(--ember);
  color:var(--marble);
}

/* ==========================================================================
   GENERIC CONTENT SHEET — reusable bottom sheet for any content-registry-
   driven block (Reviews now; FAQ / Weekend Special / Featured Products /
   Announcements later). Built on the existing .reg-overlay bottom-sheet
   pattern — only the inner layout classes below are new.
   ========================================================================== */
.content-sheet{
  max-height:82vh;
  display:flex;
  flex-direction:column;
}
.content-sheet-title{
  font-family:var(--font-display);
  font-weight:800;
  font-size:1.1875rem;
  color:var(--ink);
  margin-bottom:14px;
}
.content-sheet-body{
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}
.cs-empty-state{
  padding:30px 10px;
  text-align:center;
  font-size:0.8438rem;
  color:var(--ink-soft);
}
.cs-review-card{
  background-color:var(--tkg-marble-bg-color);
  background-image:linear-gradient(var(--tkg-marble-overlay), var(--tkg-marble-overlay)), var(--tkg-marble-image);
  background-size:auto, cover;
  background-position:center, center;
  border:1px solid var(--tkg-marble-border);
  border-radius:16px;
  padding:13px 14px;
  margin-bottom:10px;
  --ink:var(--tkg-marble-ink);
  --ink-soft:var(--tkg-marble-ink-soft);
  color:var(--tkg-marble-ink);
}
.cs-review-top{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:7px;
}
.cs-review-avatar{
  width:26px;
  height:26px;
  border-radius:50%;
  background:linear-gradient(180deg, var(--ember-bright), var(--ember-deep));
  color:var(--marble);
  font-size:0.6875rem;
  font-weight:800;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
}
.cs-review-author{
  flex:1;
  min-width:0;
  font-size:0.7812rem;
  font-weight:700;
  color:var(--ink);
}
.cs-review-stars{
  font-size:0.6562rem;
  background:linear-gradient(180deg, #FFD873 0%, #F5A623 55%, #C97B0E 100%);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  -webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 1.5px rgba(245,166,35,0.35));
  letter-spacing:1px;
  flex-shrink:0;
}
.cs-review-quote{
  font-size:0.8438rem;
  line-height:1.5;
  color:var(--ink);
}

.content-sheet-footer{
  margin-top:6px;
  padding-top:14px;
  border-top:1px solid var(--stone-line);
  text-align:center;
}
.content-sheet-footer.hidden{display:none;}
.cs-footer-stars{
  font-size:1rem;
  background:linear-gradient(180deg, #FFD873 0%, #F5A623 55%, #C97B0E 100%);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  -webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 2px rgba(245,166,35,0.35));
  letter-spacing:2px;
  margin-bottom:6px;
}
.cs-footer-heading{
  font-size:0.875rem;
  font-weight:700;
  color:var(--ink);
  margin-bottom:12px;
}
.cs-footer-btn{
  display:inline-block;
  width:100%;
  text-align:center;
  text-decoration:none;
  padding:14px;
  border-radius:var(--radius-md);
  background:linear-gradient(180deg, var(--ember-bright), var(--ember));
  color:var(--marble);
  font-size:0.9062rem;
  font-weight:700;
  box-shadow:0 8px 18px -6px rgba(232,93,44,0.55);
}

/* ==========================================================================
   APP HERO — short, scan-in-seconds, replaces the old stacked-cards hero
   ========================================================================== */
.app-hero{
  padding-top:2px;
  margin-bottom:14px;
}
.app-hero-meta{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:8px;
}
.app-hero-hours{
  font-size:0.7188rem;
  letter-spacing:0.08em;
  text-transform:uppercase;
  color:var(--grey-warm);
  font-weight:600;
}
.directions-link{
  display:flex;
  align-items:center;
  gap:4px;
  font-size:0.7188rem;
  font-weight:700;
  color:var(--ink);
  text-decoration:underline;
  text-decoration-color:var(--tkg-plain-border);
  text-underline-offset:2px;
  padding:0;
  border-radius:0;
  background:transparent;
  border:none;
}
.directions-link .dl-icon{width:var(--icon-inline); height:var(--icon-inline); flex-shrink:0;}
.directions-link:active{opacity:0.6;}
.directions-link.attention{animation:directions-bounce 1.8s ease-in-out 1;}
@keyframes directions-bounce{
  0%, 100%{transform:translateY(0);}
  20%{transform:translateY(-3px);}
  35%{transform:translateY(0);}
  50%{transform:translateY(-2px);}
  65%{transform:translateY(0);}
}

/* "Get Directions" as a primary action, footer only — Sprint: Customer OS
   UI Polish, item 6. Reuses the exact .btn-primary tokens (gradient, shadow,
   active state) already used elsewhere on this screen; no new visual
   language, just applied to an <a> instead of a <button>. The Hero's own
   small .directions-link chip is untouched — this modifier is additive and
   only applies where the class is present. Destination/href unchanged. */
.directions-link--primary{
  width:100%;
  justify-content:center;
  gap:8px;
  padding:15px 16px;
  border-radius:var(--radius-md);
  background:var(--tkg-ctrl-bg);
  border:none;
  color:var(--tkg-ctrl-fg);
  font-size:0.9375rem;
  font-weight:700;
  letter-spacing:0.02em;
  text-decoration:none;
  transition:transform 0.12s ease, opacity 0.12s ease;
}
.directions-link--primary .dl-icon{width:var(--icon-inline); height:var(--icon-inline);}
.directions-link--primary:active{
  transform:translateY(1px) scale(0.99);
  opacity:0.88;
}
.app-hero-headline{
  font-family:var(--font-display);
  font-weight:800;
  line-height:1.04;
  letter-spacing:-0.01em;
}
.app-hero-headline .line-coal{
  display:block;
  font-size:1.3125rem;
  color:var(--ink-soft);
}
.app-hero-headline .line-gravy{
  display:block;
  font-size:2.625rem;
  color:var(--ember-deep);
  margin:2px 0;
}
.app-hero-headline .line-khichiya{
  display:block;
  font-size:1.0625rem;
  font-weight:600;
  color:var(--ink-soft);
}
.app-hero-row{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:10px;
}
.info-btn{
  flex-shrink:0;
  width:32px; height:32px;
  border-radius:50%;
  background:rgba(28,24,21,0.035);
  border:1px solid var(--stone-line);
  color:var(--ink-soft);
  font-size:0.875rem;
  font-weight:700;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-top:2px;
}
.info-btn:active{background:rgba(28,24,21,0.07);}

/* Story strip — compact 3-step visual explainer directly beneath the
   headline. Carries the "Gravy is the Hero" punch as its lead-in label
   instead of repeating it as a separate line, so the hero reads in two
   beats (headline, then story) instead of three. */
.hero-story-label{
  font-size:0.6875rem;
  font-weight:700;
  color:var(--gold-deep);
  margin-top:10px;
  margin-bottom:6px;
  letter-spacing:0.01em;
}
.hero-story-strip{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:6px 8px;
  padding:12px 8px;
  background:transparent;
  border:1px solid rgba(217,164,65, var(--tkg-amber-op));
  border-radius:14px;
  margin-bottom:12px;
  position:relative;
}
.hero-story-strip .story-step{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  flex:1 1 0;
  min-width:0;
  font-size:0.78rem;
  font-weight:600;
  letter-spacing:normal;
  color:var(--ink);
  white-space:normal;
  text-align:center;
}
.hero-story-strip .story-step .step-icon{
  width:var(--icon-inline); height:var(--icon-inline); flex-shrink:0; margin-top:0;
  fill:var(--ink-soft) !important;
}
.hero-story-strip .story-arrow{
  color:var(--ink-faint);
  font-size:0.6875rem;
  flex-shrink:0;
  align-self:center;
}

/* Story-progress bar for the REVIEW TEASER (not the pill strip above) —
   one segment per loaded review. Behaves like an IG story: the active
   segment fills over REVIEW_TEASER_DURATION then auto-advances to the
   next review; already-seen segments stay fully filled. Rebuilt by
   renderReviewTeaser() each time the review index or review data changes. */
.review-teaser-progress{
  display:flex;
  gap:4px;
  margin-top:14px;
}
.review-teaser-progress .rtp-seg{
  flex:1;
  height:2.5px;
  border-radius:2px;
  background:var(--stone-line);
  overflow:hidden;
}
.review-teaser-progress .rtp-seg span{
  display:block;
  height:100%;
  width:0%;
  border-radius:2px;
  background:var(--ember);
}
.review-teaser-progress .rtp-seg.seen span{width:100%;}
.review-teaser-progress .rtp-seg.active span{animation:rtp-fill 5s linear forwards;}
@keyframes rtp-fill{ to{ width:100%; } }

/* Single-review teaser card — restores the pre-redesign "one review,
   tap for more" card. Deliberately shows nothing but the review itself
   (avatar/name/stars + one truncated line + a view-more prompt); the
   full list still lives in openCustomerStoriesSheet() and this just
   opens that same sheet on tap. Reuses .cs-review-* tokens for visual
   consistency with the sheet it opens into. */
.review-teaser-card{
  background-color:var(--tkg-marble-bg-color);
  background-image:linear-gradient(var(--tkg-marble-overlay), var(--tkg-marble-overlay)), var(--tkg-marble-image);
  background-size:auto, cover;
  background-position:center, center;
  border:1px solid var(--tkg-marble-border);
  border-radius:16px;
  padding:13px 14px;
  margin-top:6px;
  cursor:pointer;
  transition:transform 0.12s ease;
  --ink:var(--tkg-marble-ink);
  --ink-soft:var(--tkg-marble-ink-soft);
  color:var(--tkg-marble-ink);
}
.review-teaser-card:active{transform:scale(0.99);}
.review-teaser-card .cs-review-quote{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.review-teaser-viewmore{
  margin-top:7px;
  font-size:0.7188rem;
  font-weight:700;
  color:var(--ember-deep);
}

/* ==========================================================================
   MENU SECTIONS — Sprint: UI Simplification. Previously tab-gated (only one
   category visible at a time, switched via .menu-tab clicks); removed
   because the "Traditional" tab was often missed. Both categories now flow
   as one plain list, separated by a heading (see .menu-section-heading
   below) rather than a click.
   ========================================================================== */
.menu-section{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.menu-section-heading{
  font-size:1.0625rem;
  font-weight:800;
  color:var(--ink);
  margin:18px 0 2px;
  padding-top:4px;
  border-top:1px solid var(--stone-line);
}
.menu-section-heading:first-child{
  margin-top:18px;
  padding-top:0;
  border-top:none;
}

.menu-section-label{
  font-size:0.7188rem;
  letter-spacing:0.08em;
  text-transform:uppercase;
  font-weight:700;
  color:var(--gold);
  margin:6px 0 2px;
}

.jain-tag{
  font-size:0.5938rem;
  letter-spacing:0.04em;
  text-transform:none;
  font-weight:700;
  color:var(--success);
  background:rgba(92,138,92,0.12);
  padding:2px 8px;
  border-radius:10px;
}

.footer-meta{
  display:flex;
  flex-direction:column;
  align-items:stretch;
  gap:10px;
  margin-top:18px;
  padding-top:14px;
  border-top:1px solid var(--stone-line);
}
.footer-meta .hours-note{
  text-align:center;
}
.hours-note{
  font-size:0.75rem;
  color:var(--ink-soft);
}
.phone-note{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:5px;
  margin-top:8px;
  font-size:0.7812rem;
  font-weight:700;
  color:var(--ink);
  text-decoration:none;
}
.phone-note .pn-icon{width:var(--icon-inline); height:var(--icon-inline); color:var(--ember-deep); flex-shrink:0;}
.phone-note:active{color:var(--ember-deep);}

/* ==========================================================================
   INFO SHEET — education content, tucked behind the info button
   ========================================================================== */
.info-sheet-title{
  font-family:var(--font-display);
  font-weight:800;
  font-size:1.1875rem;
  color:var(--ink);
  margin-bottom:12px;
}
.info-sheet-line{
  font-size:0.8125rem;
  color:var(--ink-soft);
  line-height:1.6;
  margin-bottom:10px;
}
.info-sheet-line:last-of-type{margin-bottom:0;}
.info-sheet-punch{
  margin-top:14px;
  padding:12px 14px;
  background:rgba(232,93,44,0.07);
  border:1px solid rgba(232,93,44,0.22);
  border-radius:var(--radius-md);
  font-size:0.8125rem;
  font-weight:700;
  color:var(--ember-deep);
  text-align:center;
}
.info-sheet-jain{
  display:inline-block;
  margin-top:14px;
  font-size:0.7188rem;
  font-weight:700;
  color:var(--success);
  background:rgba(92,138,92,0.12);
  padding:4px 11px;
  border-radius:10px;
}

/* ==========================================================================
   EXTRAS — compact chip row, replaces flour-note + notes-grid paragraphs
   ========================================================================== */
.extras-row{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-top:16px;
}
.extra-chip{
  font-size:0.6875rem;
  font-weight:600;
  color:var(--ink-soft);
  background:transparent;
  border:1px solid var(--tkg-plain-border);
  padding:6px 12px;
  border-radius:14px;
}
.extra-chip.jain{
  color:var(--success);
  border-color:rgba(76,122,76,0.35);
  background:rgba(76,122,76,0.14);
}
.extra-chip .extra-chip-price{
  font-weight:700;
  margin-left:4px;
  color:var(--gold-deep);
}

.link-row{
  display:flex;
  gap:8px;
  margin-top:16px;
}
.link-chip{
  flex:1;
  text-align:center;
  padding:12px 10px;
  border-radius:var(--radius-md);
  background:var(--tkg-ctrl-bg);
  border:none;
  color:var(--tkg-ctrl-fg);
  font-size:0.7812rem;
  font-weight:600;
  text-decoration:none;
  transition:opacity 0.15s ease;
}
.link-chip:active{
  opacity:0.85;
}

/* ==========================================================================
   FUN ACTIVITY CARD — Sprint: Fun Activity Card Consolidation. One card,
   three rows (Taste Discovery / Khichiya Runner / Leaderboard), replacing
   three separate .register-cta cards that were taking up too much scroll.
   ========================================================================== */
.fun-activity-card{
  margin-top:22px;
  background-color:var(--tkg-marble-bg-color);
  background-image:linear-gradient(var(--tkg-marble-overlay), var(--tkg-marble-overlay)), var(--tkg-marble-image);
  background-size:auto, cover;
  background-position:center, center;
  border:1px solid var(--tkg-marble-border);
  border-radius:16px;
  overflow:hidden;
  --ink:var(--tkg-marble-ink);
  --ink-soft:var(--tkg-marble-ink-soft);
  --ink-faint:var(--tkg-marble-ink-faint);
  --grey-warm:var(--tkg-marble-ink-soft);
  color:var(--tkg-marble-ink);
}
.fun-activity-header{padding:14px 16px 8px;}
.fun-activity-title{
  font-family:var(--font-display);
  font-weight:800;
  font-size:0.9688rem;
  color:var(--ink);
}
.fun-activity-sub{
  font-size:0.75rem;
  color:var(--ink-soft);
  margin-top:2px;
}
.fun-activity-row{border-top:1px solid var(--stone-line);}
.fun-activity-row--accent{background:rgba(232,93,44,0.05);}
.fun-activity-row-btn{
  width:100%;
  display:flex;
  align-items:center;
  gap:10px;
  background:none;
  border:none;
  padding:13px 16px;
  text-align:left;
}
.fun-activity-row-btn:active{background:rgba(28,24,21,0.03);}
.fun-activity-row--accent .fun-activity-row-btn:active{background:rgba(232,93,44,0.08);}
.far-text{flex:1; min-width:0;}
.far-title{
  display:block;
  font-size:0.8438rem;
  font-weight:700;
  color:var(--ink);
}
.far-sub{
  display:block;
  font-size:0.7188rem;
  color:var(--ink-soft);
  margin-top:2px;
}
.far-chevron{
  font-size:1.125rem;
  color:var(--grey-warm);
  flex-shrink:0;
}

.register-cta{
  margin-top:22px;
  background:var(--stone-card);
  backdrop-filter:blur(var(--glass-blur));
  -webkit-backdrop-filter:blur(var(--glass-blur));
  border:1px solid var(--stone-line);
  border-radius:var(--radius-lg);
  padding:18px 18px 16px;
  border-top:3px solid var(--gold);
  box-shadow:
    0 1px 2px rgba(28,24,21,0.05),
    0 6px 16px -8px rgba(28,24,21,0.12);
}
.register-cta-text{margin-bottom:12px;}
.leaderboard-btn{
  background:var(--ember);
  border-color:var(--ember);
  color:var(--marble);
  font-weight:700;
}
.register-cta-title{
  font-family:var(--font-display);
  font-weight:800;
  font-size:1rem;
  color:var(--ink);
}
.register-cta-sub{
  font-size:0.75rem;
  color:var(--ink-soft);
  margin-top:3px;
}

/* Sprint 2.0 — Taste Discovery Engine. New, additive only: reuses
   .register-cta family for the reminder chip (see markup) and adds one
   small new block for the in-overlay recommendation result. No existing
   CSS above this point was modified. */
.taste-result-card{
  background:var(--stone-card);
  backdrop-filter:blur(var(--glass-blur));
  -webkit-backdrop-filter:blur(var(--glass-blur));
  border:1px solid var(--stone-line);
  border-radius:var(--radius-lg);
  padding:16px 16px 14px;
  border-top:3px solid var(--gold);
  margin-bottom:6px;
}
.taste-result-name{
  font-family:var(--font-display);
  font-weight:800;
  font-size:1.0625rem;
  color:var(--ink);
  margin-bottom:4px;
}
.taste-result-desc{
  font-size:0.8125rem;
  color:var(--ink-soft);
  margin-bottom:8px;
}
.taste-result-price{
  font-size:0.875rem;
  font-weight:700;
  color:var(--ink);
}

/* ==========================================================================
   PREMIUM MENU CARDS — rounded, soft shadow, name+price scannable at a glance
   ========================================================================== */
.menu-item{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;
  background-color:var(--tkg-marble-bg-color);
  background-image:linear-gradient(var(--tkg-marble-overlay), var(--tkg-marble-overlay)), var(--tkg-marble-image);
  background-size:auto, cover;
  background-position:center, center;
  border:1px solid var(--tkg-marble-border);
  border-radius:16px;
  padding:12px;
  transition:transform 0.18s cubic-bezier(0.22, 1, 0.36, 1);
  --ink:var(--tkg-marble-ink);
  --ink-soft:var(--tkg-marble-ink-soft);
  --ink-faint:var(--tkg-marble-ink-faint);
  --grey-warm:var(--tkg-marble-ink-soft);
  color:var(--tkg-marble-ink);
}
.menu-item:active{
  transform:scale(0.985);
}
.menu-item-thumb{
  width:56px;
  height:56px;
  flex-shrink:0;
  border-radius:var(--radius-sm);
  background:var(--stone-base);
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
}
.menu-item-thumb img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
.menu-item-info{flex:1; min-width:0;}
.menu-item-top{
  display:flex;
  align-items:center;
  gap:7px;
  flex-wrap:wrap;
}
.menu-item-name{
  font-size:0.9688rem;
  font-weight:700;
  color:var(--ink);
  letter-spacing:normal;
}
.menu-item-desc{
  font-size:0.7188rem;
  color:var(--ink-soft);
  line-height:1.35;
  margin-top:3px;
}
.menu-item-tag{
  display:inline-block;
  font-size:0.5625rem;
  letter-spacing:0.05em;
  text-transform:uppercase;
  font-weight:700;
  color:rgba(217,164,65, var(--tkg-amber-op));
  background:transparent;
  border:1px solid rgba(217,164,65, var(--tkg-amber-op));
  padding:1px 7px;
  border-radius:100px;
}
.menu-item-price{
  font-weight:700;
  font-size:0.82rem;
  color:var(--ink);
  white-space:nowrap;
  text-align:right;
  flex-shrink:0;
}
.menu-item-price .price-large{
  display:block;
  font-size:0.6875rem;
  color:var(--ink-faint);
  font-weight:600;
  margin-top:1px;
}

.menu-footer{
  margin-top:24px;
  text-align:center;
}
.btn-secondary{
  background:none;
  border:1.5px solid var(--tkg-plain-border);
  color:var(--ink-soft);
  padding:12px 22px;
  border-radius:var(--radius-md);
  font-size:0.8125rem;
  font-weight:600;
  transition:opacity 0.12s ease;
}
.btn-secondary:active{opacity:0.6;}
.btn-secondary:disabled{opacity:0.4;}

/* ==========================================================================
   OWNER DASHBOARD
   ========================================================================== */
.dash-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:18px;
}
.dash-title{
  font-family:var(--font-display);
  font-weight:800;
  font-size:1.375rem;
  color:var(--marble);
}
.dash-close{
  background:none;
  border:1px solid var(--grey-line);
  color:var(--grey-warm);
  width:34px; height:34px;
  border-radius:50%;
  font-size:1rem;
  display:flex;
  align-items:center;
  justify-content:center;
}
.dash-header-actions{
  display:flex;
  align-items:center;
  gap:8px;
}
.dash-section-label{
  font-family:var(--font-display);
  font-weight:700;
  font-size:0.7812rem;
  color:var(--gold-bright);
  letter-spacing:0.05em;
  margin:4px 0 8px;
}

.pin-gate{
  display:flex;
  flex-direction:column;
  flex:1;
  justify-content:center;
  gap:16px;
}
.pin-gate p{
  text-align:center;
  color:var(--grey-warm);
  font-size:0.8125rem;
}
.pin-input{
  width:100%;
  padding:16px;
  border-radius:var(--radius-md);
  border:1.5px solid var(--grey-line);
  background:var(--ember-card);
  color:var(--marble);
  font-size:1.25rem;
  letter-spacing:0.3em;
  text-align:center;
  outline:none;
}
.pin-input:focus{border-color:var(--ember);}

.stat-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:18px;
}
.stat-card{
  background:var(--ember-card);
  border:1px solid var(--grey-line);
  border-radius:var(--radius-md);
  padding:16px 14px;
}
.stat-card.full{grid-column:1 / -1; display:flex; justify-content:space-between; align-items:center;}
.stat-num{
  font-family:var(--font-mono);
  font-weight:700;
  font-size:1.625rem;
  color:var(--gold-bright);
  line-height:1;
}
.stat-label{
  font-size:0.6875rem;
  color:var(--grey-warm);
  margin-top:6px;
  letter-spacing:0.03em;
}
.stat-card.full .stat-num{font-size:1.25rem; color:var(--ember-bright);}

.dash-actions{
  display:flex;
  gap:10px;
  margin-bottom:18px;
}
.dash-actions .btn-secondary{flex:1; padding:11px;}

.search-box{
  width:100%;
  padding:12px 14px;
  border-radius:var(--radius-md);
  border:1.5px solid var(--grey-line);
  background:var(--ember-card);
  color:var(--marble);
  font-size:0.875rem;
  margin-bottom:12px;
  outline:none;
}
.search-box:focus{border-color:var(--ember);}
.search-box::placeholder{color:var(--grey-warm);}

.cust-list{
  flex:1;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:8px;
  -webkit-overflow-scrolling:touch;
}
.cust-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:var(--ember-card);
  border:1px solid var(--grey-line);
  border-radius:var(--radius-sm);
  padding:12px 13px;
}
.cust-info .cust-name{font-size:0.8438rem; font-weight:700; color:var(--marble);}
.cust-info .cust-mobile{font-size:0.7188rem; color:var(--grey-warm); font-family:var(--font-mono); margin-top:2px;}
.cust-info .cust-tags{font-size:0.6562rem; color:var(--gold); margin-top:3px;}

.locality-breakdown{
  padding:10px 0;
  border-bottom:1px solid var(--grey-line);
}
.locality-breakdown:last-child{ border-bottom:none; }
.locality-breakdown-name{
  font-size:0.8125rem;
  font-weight:600;
  color:var(--marble);
  margin-bottom:4px;
}
.locality-breakdown-row{
  display:flex;
  justify-content:space-between;
  font-size:0.75rem;
  color:var(--marble);
  opacity:0.85;
  padding:1px 0;
}
.locality-breakdown-total{
  margin-top:3px;
  padding-top:4px;
  border-top:1px dashed var(--grey-line);
  font-weight:600;
  opacity:1;
}
.cust-meta{text-align:right;}
.cust-meta .cust-visits{
  font-family:var(--font-mono);
  font-size:0.8125rem;
  color:var(--gold-bright);
  font-weight:700;
}
.cust-meta .cust-last{font-size:0.625rem; color:var(--grey-warm); margin-top:2px;}
.cust-meta .pending-tag{
  font-size:0.5625rem;
  color:var(--ember-bright);
  text-transform:uppercase;
  letter-spacing:0.04em;
  margin-top:3px;
}
.owner-fields-btn{
  margin-top:6px;
  background:none;
  border:none;
  color:var(--gold);
  font-size:0.6562rem;
  font-weight:600;
  padding:2px 0;
  cursor:pointer;
}

.empty-state{
  text-align:center;
  padding:40px 10px;
  color:var(--grey-warm);
  font-size:0.8125rem;
}

/* ==========================================================================
   TOAST
   ========================================================================== */
.toast{
  position:fixed;
  bottom:24px;
  left:50%;
  transform:translateX(-50%) translateY(20px);
  background:var(--tkg-plain-opaque-bg);
  color:var(--tkg-plain-opaque-fg);
  padding:13px 20px;
  border-radius:var(--radius-md);
  font-size:0.8125rem;
  font-weight:600;
  box-shadow:0 12px 30px -8px rgba(28,24,21,0.35), 0 2px 8px rgba(28,24,21,0.12);
  opacity:0;
  pointer-events:none;
  transition:opacity 0.25s ease, transform 0.25s ease;
  z-index:200;
  max-width:90%;
  text-align:center;
}
.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* ==========================================================================
   INSTALL PROMPT — bottom banner, dismissible, platform-aware
   ========================================================================== */
.install-banner{
  position:fixed;
  left:50%;
  bottom:0;
  transform:translate(-50%, calc(110% + 20px));
  width:100%;
  max-width:var(--max-w);
  background:var(--stone-card);
  backdrop-filter:blur(var(--glass-blur));
  -webkit-backdrop-filter:blur(var(--glass-blur));
  border-top:1px solid var(--stone-line);
  border-radius:18px 18px 0 0;
  padding:16px 18px calc(16px + env(safe-area-inset-bottom, 0px));
  box-shadow:0 -1px 4px rgba(28,24,21,0.08);
  transition:transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
  z-index:140;
  display:flex;
  align-items:center;
  gap:13px;
}
.install-banner.show{
  transform:translate(-50%, 0);
}
.install-icon{
  width:42px; height:42px;
  border-radius:11px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:1.25rem;
  background:var(--stone-base);
  border:1px solid var(--stone-line);
}
.install-text{flex:1; min-width:0;}
.install-title{
  font-size:0.8438rem;
  font-weight:700;
  color:var(--ink);
}
.install-sub{
  font-size:0.7188rem;
  color:var(--ink-soft);
  margin-top:2px;
  line-height:1.4;
}
.install-actions{
  display:flex;
  flex-direction:column;
  gap:6px;
  flex-shrink:0;
}
.install-btn{
  padding:9px 14px;
  border-radius:var(--radius-sm);
  border:none;
  background:var(--ember);
  color:var(--marble);
  font-size:0.75rem;
  font-weight:700;
  white-space:nowrap;
}
.install-dismiss{
  background:none;
  border:none;
  color:var(--ink-soft);
  font-size:0.6875rem;
  padding:4px 6px;
}

/* Utility */
.hidden{display:none !important;}
</style>
</style>
</head>
<body>

<div id="toast" class="toast"></div>

  <section class="screen active" id="screen-moments">
    <div class="moments-topbar">
      <button type="button" class="moments-menu-btn" id="momentsMenuBtn" title="Open Menu" style="display: flex; align-items: center; gap: 8px; background: none; border: none; padding: 8px 0; cursor: pointer; font-family: inherit;">
        <img src="./icon-192.png" alt="TKG Logo" style="width: 36px; height: 36px; border-radius: 6px; background: rgba(232,93,44,0.1);">
        <span style="font-size: 14px; font-weight: 500; color: #1C1815;">Open Menu</span>
      </button>
      <div class="moments-stat" id="momentsStat"></div>
    </div>

    <div class="moments-viewer" id="momentsViewer"></div>
    <div class="moments-empty" id="momentsEmptyState" style="display:none;">No moments yet — be the first to share one!</div>
    <div class="moments-loading" id="momentsLoadingState">Loading gallery…</div>

    <div class="moments-fab-row">
      <input type="file" accept="image/*,video/*" multiple id="momentsFileInput" style="display:none;">
      <button type="button" class="moments-fab" id="momentShareBtn">Share your moment</button>
    </div>

    <!-- Compose step — shown only after a photo is picked, so the customer
         sees their own photo before deciding whether to add a caption.
         Nothing is uploaded until they tap Post here. -->
    <div class="moments-compose-overlay hidden" id="momentsComposeOverlay">
      <div class="moments-compose-card">
        <div class="moments-compose-grid" id="momentsComposeGrid"></div>
        <label class="field-label" for="momentsCaptionInput">Add a caption? (optional)</label>
        <input class="field-input" id="momentsCaptionInput" type="text" placeholder="Say something about this moment" maxlength="200">
        <div class="moments-status" id="momentsUploadStatus"></div>
        <button type="button" class="btn-primary" id="momentsComposePostBtn" style="width:100%; margin-top:10px;">Post</button>
        <button type="button" class="btn-secondary" id="momentsComposeCancelBtn" style="width:100%; margin-top:8px;">Cancel</button>
      </div>
    </div>

    <div class="moments-compose-overlay hidden" id="momentsLinkOverlay">
      <div class="moments-compose-card">
        <div class="journey-title" style="font-size:1.0625rem; margin-bottom:12px;">Share your Instagram moment</div>
        <label class="field-label" for="momentsLinkInput">Paste the link to your post or reel</label>
        <input class="field-input" id="momentsLinkInput" type="url" placeholder="https://www.instagram.com/p/..." maxlength="300">
        <div class="moments-status" id="momentsLinkStatus"></div>
        <button type="button" class="btn-primary" id="momentsLinkSubmitBtn" style="width:100%; margin-top:10px;">Add to Gallery</button>
        <button type="button" class="btn-secondary" id="momentsLinkCancelBtn" style="width:100%; margin-top:8px;">Cancel</button>
      </div>
    </div>

    <!-- Choice modal: Memory vs Instagram -->
    <div class="moments-compose-overlay hidden" id="momentsChoiceOverlay">
      <div class="moments-compose-card" style="max-width: 320px;">
        <div class="journey-title" style="font-size:1.0625rem; margin-bottom:16px; text-align: center;">Share your moment</div>
        <button type="button" id="choiceMemoryBtn" style="width: 100%; background: #1A1815; color: #FFFFFF; border: none; border-radius: 12px; padding: 16px; font-size: 15px; font-weight: 500; cursor: pointer; font-family: inherit; margin-bottom: 10px; transition: background 0.2s;">A memory here</button>
        <button type="button" id="choiceInstagramBtn" style="width: 100%; background: transparent; color: #E85D2C; border: 1.5px solid #E85D2C; border-radius: 12px; padding: 16px; font-size: 15px; font-weight: 500; cursor: pointer; font-family: inherit; transition: all 0.2s;">Your Instagram post</button>
        <button type="button" id="choiceCancelBtn" style="width: 100%; background: transparent; color: #9C9286; border: none; padding: 12px; font-size: 14px; cursor: pointer; font-family: inherit; margin-top: 8px;">Dismiss</button>
      </div>
    </div>

    <!-- Tutorial modal: How to share from Instagram -->
    <div class="moments-compose-overlay hidden" id="momentsTutorialOverlay">
