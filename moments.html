<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>TKG Moments</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">

<script>
(function(){
  try{
    var theme = localStorage.getItem('tkg_theme');
    document.documentElement.setAttribute('data-tkg-theme', theme === 'dark' ? 'dark' : 'light');
  }catch(e){
    document.documentElement.setAttribute('data-tkg-theme', 'light');
  }
})();
</script>

<script>
  if ('serviceWorker' in navigator) {
    let refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!refreshing) {
        refreshing = true;
        window.location.reload();
      }
    });
    window.addEventListener('load', () => {
      // updateViaCache: 'none' forces browser to bypass sw.js local cache
      navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' })
        .then((reg) => {
          reg.update();
        })
        .catch((err) => {
          console.error('[SW] Registration failed:', err);
        });
    });
  }
</script>

<style>
:root{
  /* PURE B&W PREMIUM AESTHETIC */
  --page-bg:     #FFFFFF;
  --page-border: #E0E0E0;
  --text-primary: #000000;
  --text-secondary: #666666;
  --text-tertiary: #999999;
  --card-bg: #000000;
  --card-text: #FFFFFF;
  --card-text-soft: rgba(255,255,255,0.8);
  --accent-bg: #1A1A1A;
  --accent-fg: #FFFFFF;
  --ctrl-bg: #000000;
  --ctrl-fg: #FFFFFF;
  --overlay-dark: rgba(0,0,0,0.5);
  --overlay-light: rgba(255,255,255,0.1);
  --border-crisp: rgba(0,0,0,0.12);
  --border-light: rgba(0,0,0,0.06);
  --radius-lg: 16px;
  --radius-md: 8px;
  --max-w: 430px;
  --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
}

html[data-tkg-theme="dark"]{
  --page-bg:     #000000;
  --page-border: #2A2A2A;
  --text-primary: #FFFFFF;
  --text-secondary: #CCCCCC;
  --text-tertiary: #888888;
  --card-bg: #1A1A1A;
  --card-text: #FFFFFF;
  --card-text-soft: rgba(255,255,255,0.7);
  --accent-bg: #2A2A2A;
  --accent-fg: #FFFFFF;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { 
  height: 100dvh; 
  width: 100%; 
  background: var(--page-bg); 
  color: var(--text-primary); 
  font-family: var(--font-body);
}
body { 
  display: flex; 
  justify-content: center;
  overflow: hidden;
}

.moments-app {
  width: 100%;
  max-width: var(--max-w);
  display: flex;
  flex-direction: column;
  height: 100dvh;
  position: relative;
}

.moments-header {
  background: var(--page-bg);
  border-bottom: 1px solid var(--page-border);
  padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 12px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}

.moments-header h1 {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -0.3px;
  flex: 1;
}

.moments-header-btn {
  background: none;
  border: none;
  padding: 8px;
  cursor: pointer;
  font-size: 20px;
  color: var(--text-primary);
}

.moments-content {
  flex: 1;
  overflow-y: scroll;
  scroll-behavior: smooth;
  scrollbar-width: none;
}

.moments-content::-webkit-scrollbar {
  display: none;
}

#momentsFeed {
  display: flex;
  flex-direction: column;
  gap: 24px;
  padding: 16px;
  scroll-snap-type: y mandatory;
}

.timeline-item {
  display: flex;
  flex-direction: column;
  gap: 8px;
  scroll-snap-align: start;
}

.timeline-item-media {
  width: 100%;
  height: auto;
  border-radius: var(--radius-md);
  overflow: hidden;
  background: var(--card-bg);
  display: block;
  border: 1px solid var(--border-crisp);
}

.timeline-item-image {
  width: 100%;
  height: auto;
  display: block;
}

.timeline-item-video-container {
  position: relative;
  width: 100%;
  background: var(--card-bg);
  display: flex;
  align-items: center;
  justify-content: center;
  aspect-ratio: 9 / 16;
  overflow: hidden;
  border: 1px solid var(--border-crisp);
}

.timeline-item-video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  background: var(--card-bg);
  cursor: pointer;
}

/* ===== ENGAGEMENT OVERLAY — Borderless SVG Icons ===== */
.engagement-overlay {
  position: absolute;
  right: 12px;
  bottom: 16px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  z-index: 10;
}

.engagement-btn {
  width: 44px;
  height: 44px;
  background: none;
  border: none;
  color: white;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  transition: transform 0.2s ease, opacity 0.2s ease;
  position: relative;
}

.engagement-btn svg {
  width: 28px;
  height: 28px;
  stroke: currentColor;
  stroke-width: 2;
  fill: none;
  filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.3));
  transition: fill 0.2s ease;
}

.engagement-btn:active {
  transform: scale(0.88);
}

.engagement-btn.liked svg {
  fill: currentColor;
  color: #FF1744;
  animation: heartPulse 0.6s ease-out;
}

@keyframes heartPulse {
  0% {
    transform: scale(0.8);
    opacity: 1;
  }
  100% {
    transform: scale(1.4);
    opacity: 0;
  }
}

/* ===== VIDEO CONTROLS OVERLAY (MUTE) ===== */
.video-controls-overlay {
  position: absolute;
  bottom: 16px;
  left: 16px;
  display: flex;
  gap: 12px;
  z-index: 10;
  opacity: 0.9;
  transition: opacity 0.3s ease;
}

.video-controls-overlay:hover {
  opacity: 1;
}

.control-btn {
  background: rgba(0, 0, 0, 0.4);
  border: 1px solid rgba(255, 255, 255, 0.3);
  border-radius: 50%;
  width: 48px;
  height: 48px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: white;
  transition: all 0.2s ease;
  backdrop-filter: blur(8px);
  padding: 0;
  font-size: 0;
}

.control-btn:active {
  background: rgba(0, 0, 0, 0.6);
  transform: scale(0.95);
}

.control-btn svg {
  width: 24px;
  height: 24px;
  fill: currentColor;
}

.control-btn.muted {
  opacity: 0.7;
}

.timeline-item-info {
  padding: 0 4px;
}

.timeline-item-caption {
  font-size: 14px;
  line-height: 1.4;
  color: var(--text-primary);
  margin-bottom: 4px;
  word-wrap: break-word;
}

.timeline-item-meta {
  font-size: 12px;
  color: var(--text-tertiary);
  letter-spacing: -0.2px;
  white-space: normal;
  word-break: break-word;
}

.timeline-item-review {
  background: var(--card-bg);
  border-radius: var(--radius-md);
  padding: 16px;
  border: 1px solid var(--border-crisp);
  border-left: 4px solid #FFFFFF;
}

.timeline-item-review-rating {
  display: flex;
  gap: 4px;
  margin-bottom: 8px;
  font-size: 16px;
}

.timeline-item-review-text {
  font-size: 13px;
  line-height: 1.5;
  color: var(--card-text-soft);
  margin-bottom: 8px;
  font-style: italic;
}

.timeline-item-review-author {
  font-size: 12px;
  color: var(--card-text-soft);
  opacity: 0.8;
}

/* ===== UPLOAD MODAL ===== */
.upload-modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.5);
  backdrop-filter: blur(4px);
  z-index: 100;
  justify-content: center;
  align-items: flex-end;
}

.upload-modal.open {
  display: flex;
}

.upload-modal-content {
  width: 100%;
  max-width: var(--max-w);
  background: var(--page-bg);
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  padding: 24px 16px;
  max-height: 90dvh;
  overflow-y: auto;
  padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
}

.upload-modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.upload-modal h2 {
  font-size: 18px;
  font-weight: 700;
}

.upload-close-btn {
  background: none;
  border: none;
  font-size: 24px;
  cursor: pointer;
  color: var(--text-primary);
}

.upload-form-group {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 16px;
}

.upload-form-group label {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-secondary);
}

.upload-form-group input[type="text"],
.upload-form-group textarea {
  padding: 12px;
  border: 1px solid var(--page-border);
  border-radius: var(--radius-md);
  background: var(--card-bg);
  color: var(--card-text);
  font-family: var(--font-body);
  font-size: 14px;
}

.upload-form-group input[type="text"]::placeholder,
.upload-form-group textarea::placeholder {
  color: rgba(255, 255, 255, 0.4);
}

.upload-form-group textarea {
  resize: none;
  min-height: 80px;
}

.upload-file-input-wrapper {
  position: relative;
}

.upload-file-input {
  display: none;
}

.upload-file-btn {
  display: block;
  width: 100%;
  padding: 12px;
  background: var(--accent-bg);
  color: var(--accent-fg);
  border: none;
  border-radius: var(--radius-md);
  font-weight: 600;
  cursor: pointer;
  font-size: 14px;
}

.upload-file-btn:active {
  opacity: 0.8;
}

.file-list {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 12px;
}

.file-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--accent-bg);
  color: var(--accent-fg);
  padding: 6px 12px;
  border-radius: 16px;
  font-size: 12px;
}

.file-chip-remove {
  cursor: pointer;
  font-weight: bold;
  opacity: 0.8;
}

.file-chip-remove:active {
  opacity: 0.6;
}

.file-counter {
  font-size: 12px;
  color: var(--text-secondary);
  margin-top: 8px;
}

.file-counter.warning {
  color: #FF6B6B;
}

.upload-preview {
  display: none;
  width: 100%;
  max-height: 200px;
  object-fit: cover;
  border-radius: var(--radius-md);
  margin-top: 12px;
}

.upload-preview.show {
  display: block;
}

.upload-progress {
  display: none;
  width: 100%;
  height: 4px;
  background: rgba(0, 0, 0, 0.1);
  border-radius: 2px;
  overflow: hidden;
  margin-top: 12px;
}

.upload-progress.show {
  display: block;
}

.upload-progress-bar {
  height: 100%;
  background: var(--accent-fg);
  width: 0%;
  transition: width 0.3s ease;
}

.upload-actions {
  display: flex;
  gap: 12px;
  margin-top: 20px;
}

.upload-cancel-btn,
.upload-submit-btn {
  flex: 1;
  padding: 12px;
  border: none;
  border-radius: var(--radius-md);
  font-weight: 600;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.2s ease;
}

.upload-cancel-btn {
  background: var(--page-border);
  color: var(--text-primary);
}

.upload-submit-btn {
  background: var(--accent-bg);
  color: var(--accent-fg);
}

.upload-cancel-btn:active,
.upload-submit-btn:active {
  transform: scale(0.95);
}

.upload-submit-btn:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

/* ===== FOOTER ===== */
.moments-footer {
  background: var(--page-bg);
  border-top: 1px solid var(--page-border);
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
  display: flex;
  justify-content: center;
  gap: 12px;
  flex-shrink: 0;
}

.moments-footer-btn {
  flex: 1;
  padding: 12px;
  background: var(--accent-bg);
  color: var(--accent-fg);
  border: none;
  border-radius: var(--radius-md);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
}

.moments-footer-btn:active {
  transform: scale(0.95);
  opacity: 0.8;
}

</style>
</head>
<body>

<div class="moments-app">
  <header class="moments-header">
    <h1>Moments</h1>
    <button class="moments-header-btn" id="backBtn" title="Back">←</button>
  </header>

  <div class="moments-content">
    <div id="momentsFeed"></div>
  </div>

  <footer class="moments-footer">
    <button class="moments-footer-btn" id="shareBtn">📸 Share Moment</button>
  </footer>
</div>

<!-- UPLOAD MODAL -->
<div class="upload-modal" id="uploadModal">
  <div class="upload-modal-content">
    <div class="upload-modal-header">
      <h2>Share Your Moment</h2>
      <button class="upload-close-btn" id="uploadCancel">×</button>
    </div>

    <div class="upload-form-group">
      <label for="uploadName">Your Name *</label>
      <input type="text" id="uploadName" placeholder="e.g. Deepak K." maxlength="50">
    </div>

    <div class="upload-form-group">
      <label for="uploadCaption">Caption (Optional)</label>
      <textarea id="uploadCaption" placeholder="Share a story about this moment..."></textarea>
    </div>

    <div class="upload-form-group">
      <label>Select Photos/Videos (Max 5) *</label>
      <div class="upload-file-input-wrapper">
        <button class="upload-file-btn">Choose Files</button>
        <input type="file" id="uploadFile" multiple accept="image/*,video/*">
      </div>
      <div class="file-counter" id="fileCounter"></div>
      <div class="file-list" id="fileList"></div>
      <img id="uploadPreview" class="upload-preview">
    </div>

    <div class="upload-progress" id="uploadProgress">
      <div class="upload-progress-bar" id="uploadProgressBar"></div>
    </div>

    <div class="upload-actions">
      <button class="upload-cancel-btn" id="uploadCancelFinal">Cancel</button>
      <button class="upload-submit-btn" id="uploadSubmit">Share</button>
    </div>
  </div>
</div>

<script>
// ========== CONFIG ==========
const APP_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxyftcQEeDkU1sf2MJy4Zwj12C9J8z4UVWTY1-ny5HM9HhJ0azlkMt5Gvp-nJXDgtLnLA/exec';
const CACHE_KEY = 'tkg_moments_cache';
const CACHE_DURATION = 5 * 60 * 1000; // 5 minutes
const MAX_FILES = 5;
const MAX_FILE_SIZE = 10 * 1024 * 1024; // 10 MB

// ========== DOM ELEMENTS ==========
const FEED = document.getElementById('momentsFeed');
const SHARE_BTN = document.getElementById('shareBtn');
const UPLOAD_MODAL = document.getElementById('uploadModal');
const UPLOAD_NAME = document.getElementById('uploadName');
const UPLOAD_CAPTION = document.getElementById('uploadCaption');
const UPLOAD_FILE = document.getElementById('uploadFile');
const UPLOAD_CANCEL = document.getElementById('uploadCancel');
const UPLOAD_CANCEL_FINAL = document.getElementById('uploadCancelFinal');
const UPLOAD_SUBMIT = document.getElementById('uploadSubmit');
const UPLOAD_PROGRESS = document.getElementById('uploadProgress');
const UPLOAD_PROGRESS_BAR = document.getElementById('uploadProgressBar');
const FILE_LIST = document.getElementById('fileList');
const FILE_COUNTER = document.getElementById('fileCounter');
const UPLOAD_PREVIEW = document.getElementById('uploadPreview');
const UPLOAD_FILE_BTN = document.querySelector('.upload-file-btn');
const BACK_BTN = document.getElementById('backBtn');

// ========== STATE ==========
let selectedFiles = [];
const likedVideos = new Set(JSON.parse(localStorage.getItem('tkg_liked_moments') || '[]'));

const MUTE_STATE = {
  muted: localStorage.getItem('tkg_muted') === 'true',
  listeners: [],
  
  toggle() {
    this.muted = !this.muted;
    localStorage.setItem('tkg_muted', String(this.muted));
    this.notifyListeners();
  },
  
  subscribe(fn) {
    this.listeners.push(fn);
  },
  
  notifyListeners() {
    this.listeners.forEach(fn => fn(this.muted));
  },
  
  updateAllVideos() {
    document.querySelectorAll('.timeline-item-video').forEach(video => {
      video.muted = this.muted;
    });
  }
};

// Debug: Log mute state initialization
console.log('[Moments] MUTE_STATE initialized:', MUTE_STATE.muted);

// ========== BACK NAVIGATION ==========
BACK_BTN.addEventListener('click', () => {
  window.history.back();
});

UPLOAD_FILE_BTN.addEventListener('click', () => {
  UPLOAD_FILE.click();
});

// ========== FETCH MOMENTS ==========
async function fetchMoments() {
  try {
    console.log('[Moments] Starting fetch...');
    
    // Check cache first
    const cached = localStorage.getItem(CACHE_KEY);
    if (cached) {
      try {
        const { data, timestamp } = JSON.parse(cached);
        if (Date.now() - timestamp < CACHE_DURATION) {
          console.log('[Moments] Using cached data');
          renderMoments(data);
          return;
        }
      } catch (cacheErr) {
        console.warn('[Moments] Cache parse error, fetching fresh:', cacheErr);
      }
    }

    console.log('[Moments] Fetching from Apps Script...');
    const response = await fetch(`${APP_SCRIPT_URL}?action=getTimelineItems`);
    
    if (!response.ok) {
      throw new Error(`HTTP ${response.status}: ${response.statusText}`);
    }
    
    const data = await response.json();
    console.log('[Moments] Fetch successful, got', data.timeline?.length || 0, 'items');
    
    // Store in cache
    try {
      localStorage.setItem(CACHE_KEY, JSON.stringify({
        data: data.timeline || [],
        timestamp: Date.now()
      }));
    } catch (cacheStoreErr) {
      console.warn('[Moments] Failed to cache:', cacheStoreErr);
    }

    renderMoments(data.timeline || []);
  } catch (err) {
    console.error('[Moments] Fetch failed:', err);
    
    // Try fallback cache even if expired
    const cached = localStorage.getItem(CACHE_KEY);
    if (cached) {
      try {
        const { data } = JSON.parse(cached);
        console.log('[Moments] Using stale cache as fallback');
        renderMoments(data);
        return;
      } catch (e) {
        console.warn('[Moments] Stale cache also failed');
      }
    }
    
    // No cache available — show error
    FEED.innerHTML = '<div style="text-align: center; padding: 40px; color: var(--text-tertiary);">Unable to load moments. Please check your connection and refresh.</div>';
  }
}

function renderMoments(timelineItems) {
  FEED.innerHTML = '';

  if (!timelineItems || timelineItems.length === 0) {
    FEED.innerHTML = '<div style="text-align: center; padding: 40px; color: var(--text-tertiary);">No moments yet. Be the first to share!</div>';
    return;
  }

  MUTE_STATE.subscribe((muted) => {
    document.querySelectorAll('.timeline-item-video').forEach(video => {
      video.muted = muted;
    });
  });

  function setupVideoObserver(video, container) {
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          video.play().catch(() => {});
        } else {
          video.pause();
        }
      });
    }, { threshold: 0.5 });
    
    observer.observe(container);
  }

  function setupVideoTapHandler(video) {
    video.addEventListener('click', () => {
      if (video.paused) {
        video.play();
      } else {
        video.pause();
      }
    });
  }

  function setupDoubleTapLike(container, cardId) {
    let lastTap = 0;
    container.addEventListener('click', (e) => {
      const now = Date.now();
      if (now - lastTap < 300) {
        e.stopPropagation();
        const likeBtn = container.querySelector('.like-btn');
        if (likeBtn) likeBtn.click();
      }
      lastTap = now;
    });
  }

  function toggleLike(cardId, container) {
    if (likedVideos.has(cardId)) {
      likedVideos.delete(cardId);
    } else {
      likedVideos.add(cardId);
    }
    localStorage.setItem('tkg_liked_moments', JSON.stringify(Array.from(likedVideos)));
    
    const likeBtn = container.querySelector('.like-btn');
    if (likeBtn) {
      likeBtn.classList.toggle('liked');
    }
  }

  timelineItems.forEach((item, idx) => {
    const card = createTimelineCard(item, `card-${idx}`);
    if (card) FEED.appendChild(card);
  });

  MUTE_STATE.updateAllVideos();
}

// ========== CREATE TIMELINE CARD ==========
function createTimelineCard(item, cardId) {
  const container = document.createElement('div');
  container.className = 'timeline-item';

  if (item.type === 'video') {
    const { caption, uploaderName, date, time, media } = item.data;
    const dateDisplay = formatDate(date, time);
    
    const mediaContainer = document.createElement('div');
    mediaContainer.className = 'timeline-item-media timeline-item-video-container';
    
    const fileId = extractGoogleDriveId(media.url);
    const streamUrl = fileId ? `/api/stream?id=${fileId}` : media.url;
    
    const video = document.createElement('video');
    video.className = 'timeline-item-video';
    video.src = streamUrl;
    video.playsinline = true;
    video.muted = MUTE_STATE.muted;
    
    // Mute control overlay (bottom-left)
    const controlsOverlay = document.createElement('div');
    controlsOverlay.className = 'video-controls-overlay';
    controlsOverlay.style.display = 'none';
    controlsOverlay.innerHTML = `
      <button class="control-btn mute-btn" title="${MUTE_STATE.muted ? 'Unmute' : 'Mute'}">
        ${MUTE_STATE.muted ? 
          '<svg viewBox="0 0 24 24"><path d="M6.3 7c0-1 .8-1.8 1.8-1.8h.5l6-5.5c.6-.5 1.5-.2 1.5.7v16c0 .9-.9 1.2-1.5.7l-6-5.5h-.5c-1 0-1.8-.8-1.8-1.8V7zm12 0c0 3.5-1.8 6.5-4.5 8.3m0-16.6c2.7 1.8 4.5 4.8 4.5 8.3M18 2l3 3m0 6l3-3"/></svg>' :
          '<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.26 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>'
        }
      </button>
    `;
    
    // Engagement overlay (right side) — Borderless SVG Icons
    const engagementOverlay = document.createElement('div');
    engagementOverlay.className = 'engagement-overlay';
    engagementOverlay.innerHTML = `
      <button class="engagement-btn like-btn ${likedVideos.has(cardId) ? 'liked' : ''}" title="Like">
        <svg viewBox="0 0 24 24">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
        </svg>
      </button>
      <button class="engagement-btn comment-btn" title="Comment">
        <svg viewBox="0 0 24 24">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
      </button>
      <button class="engagement-btn share-btn" title="Share">
        <svg viewBox="0 0 24 24">
          <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8m-4-6l-4-4m0 0L8 6m0 0v6"/>
        </svg>
      </button>
    `;
    
    mediaContainer.appendChild(video);
    mediaContainer.appendChild(controlsOverlay);
    mediaContainer.appendChild(engagementOverlay);
    
    // Setup observers and handlers
    setupVideoObserver(video, mediaContainer);
    setupVideoTapHandler(video);
    setupDoubleTapLike(mediaContainer, cardId);
    
    // Mute button handler
    const muteBtn = controlsOverlay.querySelector('.mute-btn');
    muteBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      MUTE_STATE.toggle();
    });
    
    // Engagement button handlers
    const likeBtn = engagementOverlay.querySelector('.like-btn');
    likeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleLike(cardId, mediaContainer);
    });
    
    const commentBtn = engagementOverlay.querySelector('.comment-btn');
    commentBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      alert('Comments coming soon');
    });
    
    const shareBtn = engagementOverlay.querySelector('.share-btn');
    shareBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      alert('Share feature coming soon');
    });
    
    const info = document.createElement('div');
    info.className = 'timeline-item-info';
    info.innerHTML = `
      ${caption ? `<div class="timeline-item-caption">${escapeHtml(caption)}</div>` : ''}
      <div class="timeline-item-meta">${escapeHtml(uploaderName || 'Community Member')} • ${dateDisplay}</div>
    `;
    
    container.appendChild(mediaContainer);
    container.appendChild(info);
    return container;
  }

  if (item.type === 'photo') {
    const { caption, uploaderName, date, time, media } = item.data;
    const dateDisplay = formatDate(date, time);
    
    const mediaContainer = document.createElement('div');
    mediaContainer.className = 'timeline-item-media';
    const img = document.createElement('img');
    img.className = 'timeline-item-image';
    img.src = media.url;
    img.alt = caption || 'Photo';
    img.loading = 'lazy';
    mediaContainer.appendChild(img);
    
    const info = document.createElement('div');
    info.className = 'timeline-item-info';
    info.innerHTML = `
      ${caption ? `<div class="timeline-item-caption">${escapeHtml(caption)}</div>` : ''}
      <div class="timeline-item-meta">${escapeHtml(uploaderName || 'Community Member')} • ${dateDisplay}</div>
    `;
    
    container.appendChild(mediaContainer);
    container.appendChild(info);
    return container;
  }

  if (item.type === 'google_review') {
    const { reviewer, rating, text } = item.data;
    const container = document.createElement('div');
    container.className = 'timeline-item';
    const reviewCard = document.createElement('div');
    reviewCard.className = 'timeline-item-review';
    
    const stars = '★'.repeat(rating || 0) + '☆'.repeat(5 - (rating || 0));
    reviewCard.innerHTML = `
      <div class="timeline-item-review-rating">${stars}</div>
      <div class="timeline-item-review-text">"${escapeHtml(text)}"</div>
      <div class="timeline-item-review-author">— ${escapeHtml(reviewer)}</div>
    `;
    
    container.appendChild(reviewCard);
    return container;
  }

  return container;
}

// ========== FORMAT DATE ==========
function formatDate(date, time) {
  const dayNames = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  let dateObj;
  
  try {
    dateObj = new Date(date);
  } catch (e) {
    return 'Recently';
  }
  
  if (isNaN(dateObj)) return 'Recently';
  
  const day = dayNames[dateObj.getDay()];
  const timeStr = time ? String(time).slice(0, 5) : '';
  
  return timeStr ? `${day} ${timeStr}` : day;
}

// ========== EXTRACT GOOGLE DRIVE ID ==========
function extractGoogleDriveId(rawUrl) {
  if (!rawUrl) return null;
  
  let match = rawUrl.match(/\/file\/d\/([^\/]+)/);
  if (match && match[1]) return match[1];

  match = rawUrl.match(/id=([^&]+)/);
  if (match && match[1]) return match[1];

  match = rawUrl.match(/\/d\/([a-zA-Z0-9_-]+)/);
  if (match && match[1]) return match[1];

  return null;
}

// ========== MULTI-FILE UPLOAD ==========
SHARE_BTN.addEventListener('click', () => {
  UPLOAD_MODAL.classList.add('open');
  UPLOAD_NAME.focus();
});

UPLOAD_CANCEL.addEventListener('click', () => {
  closeUploadModal();
});

UPLOAD_CANCEL_FINAL.addEventListener('click', () => {
  closeUploadModal();
});

UPLOAD_FILE.addEventListener('change', (e) => {
  selectedFiles = Array.from(e.target.files || []);
  
  if (selectedFiles.length > MAX_FILES) {
    alert(`Maximum ${MAX_FILES} files allowed. ${selectedFiles.length} selected.`);
    selectedFiles = selectedFiles.slice(0, MAX_FILES);
    e.target.value = '';
  }
  
  updateFilePreview();
});

function updateFilePreview() {
  FILE_LIST.innerHTML = '';
  FILE_COUNTER.textContent = `${selectedFiles.length}/${MAX_FILES} files selected`;
  
  if (selectedFiles.length === MAX_FILES) {
    FILE_COUNTER.classList.add('warning');
    FILE_COUNTER.textContent += ' (max reached)';
  } else {
    FILE_COUNTER.classList.remove('warning');
  }
  
  selectedFiles.forEach((file, idx) => {
    const chip = document.createElement('div');
    chip.className = 'file-chip';
    chip.innerHTML = `
      ${file.name.substring(0, 20)}
      <span class="file-chip-remove" data-idx="${idx}">×</span>
    `;
    chip.querySelector('.file-chip-remove').addEventListener('click', () => {
      selectedFiles.splice(idx, 1);
      updateFilePreview();
    });
    FILE_LIST.appendChild(chip);
  });
  
  if (selectedFiles.length > 0) {
    const file = selectedFiles[0];
    if (file.type.startsWith('image/')) {
      const reader = new FileReader();
      reader.onload = (e) => {
        UPLOAD_PREVIEW.src = e.target.result;
        UPLOAD_PREVIEW.classList.add('show');
      };
      reader.readAsDataURL(file);
    } else {
      UPLOAD_PREVIEW.classList.remove('show');
    }
  }
}

async function compressImage(file) {
  if (!file.type.startsWith('image/')) return file;
  
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let width = img.width;
        let height = img.height;
        
        const maxSize = 1200;
        if (width > height) {
          if (width > maxSize) {
            height = (height * maxSize) / width;
            width = maxSize;
          }
        } else {
          if (height > maxSize) {
            width = (width * maxSize) / height;
            height = maxSize;
          }
        }
        
        canvas.width = width;
        canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        
        canvas.toBlob((blob) => {
          resolve(new File([blob], file.name, { type: 'image/jpeg' }));
        }, 'image/jpeg', 0.8);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

UPLOAD_SUBMIT.addEventListener('click', async () => {
  const name = UPLOAD_NAME.value.trim();
  const caption = UPLOAD_CAPTION.value.trim();
  
  if (!name) {
    alert('Please enter your name');
    return;
  }
  
  if (selectedFiles.length === 0) {
    alert('Please select at least one file');
    return;
  }
  
  UPLOAD_SUBMIT.disabled = true;
  UPLOAD_PROGRESS.classList.add('show');
  let uploaded = 0;
  
  try {
    for (const file of selectedFiles) {
      const compressed = await compressImage(file);
      
      const formData = new FormData();
      formData.append('action', 'upload');
      formData.append('uploaderName', name);
      formData.append('caption', caption);
      formData.append('file', compressed);
      
      await fetch(APP_SCRIPT_URL, {
        method: 'POST',
        body: formData
      });
      
      uploaded++;
      UPLOAD_PROGRESS_BAR.style.width = Math.round((uploaded / selectedFiles.length) * 100) + '%';
    }
    
    closeUploadModal();
    localStorage.removeItem(CACHE_KEY);
    fetchMoments();
  } catch (err) {
    console.error('Upload error:', err);
    alert('Upload failed. Please try again.');
  } finally {
    UPLOAD_SUBMIT.disabled = false;
    UPLOAD_PROGRESS.classList.remove('show');
    UPLOAD_PROGRESS_BAR.style.width = '0%';
  }
});

function closeUploadModal() {
  UPLOAD_MODAL.classList.remove('open');
  UPLOAD_NAME.value = '';
  UPLOAD_CAPTION.value = '';
  UPLOAD_FILE.value = '';
  UPLOAD_PREVIEW.classList.remove('show');
  FILE_LIST.innerHTML = '';
  FILE_COUNTER.textContent = '';
  selectedFiles = [];
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && UPLOAD_MODAL.classList.contains('open')) {
    closeUploadModal();
  }
});

// ========== ESCAPE HTML ==========
function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// ========== INIT ==========
// Ensure fetchMoments runs after DOM is fully loaded
// (it should already be, but this is a safeguard for timing issues)
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', () => {
    setTimeout(() => {
      fetchMoments();
    }, 100);
  });
} else {
  // DOM is already loaded
  setTimeout(() => {
    fetchMoments();
  }, 100);
}
