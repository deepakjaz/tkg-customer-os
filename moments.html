<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>TKG Moments</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">

<script>
(function(){
  try{
    var theme = localStorage.getItem('tkg_theme');
    document.documentElement.setAttribute('data-tkg-theme', theme === 'dark' ? 'dark' : 'light');
  }catch(e){
    document.documentElement.setAttribute('data-tkg-theme', 'light');
  }
})();
</script>

<script>
  if ('serviceWorker' in navigator) {
    let refreshing = false;

    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!refreshing) {
        refreshing = true;
        window.location.reload();
      }
    });

    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' })
        .then((reg) => {
          reg.update();
        })
        .catch((err) => {
          console.error('[SW] Registration failed:', err);
        });
    });
  }
</script>

<style>
:root{
  /* PURE B&W PREMIUM AESTHETIC + GLASS SURFACES */
  --page-bg:     #FFFFFF;
  --page-border: #E0E0E0;
  --text-primary: #000000;
  --text-secondary: #666666;
  --text-tertiary: #999999;
  --card-bg: #000000;
  --card-text: #FFFFFF;
  --card-text-soft: rgba(255,255,255,0.8);
  --accent-bg: #1A1A1A;
  --accent-fg: #FFFFFF;
  --ctrl-bg: #000000;
  --ctrl-fg: #FFFFFF;
  --overlay-dark: rgba(0,0,0,0.5);
  --overlay-light: rgba(255,255,255,0.1);
  --border-crisp: rgba(0,0,0,0.12);
  --border-light: rgba(0,0,0,0.06);
  --radius-lg: 16px;
  --radius-md: 8px;
  --max-w: 430px;
  --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --glass-bg: rgba(20,20,20,0.55);
  --glass-border: rgba(255,255,255,0.14);
}

html[data-tkg-theme="dark"]{
  --page-bg:     #000000;
  --page-border: #2A2A2A;
  --text-primary: #FFFFFF;
  --text-secondary: #CCCCCC;
  --text-tertiary: #888888;
  --card-bg: #1A1A1A;
  --card-text: #FFFFFF;
  --card-text-soft: rgba(255,255,255,0.7);
  --accent-bg: #2A2A2A;
  --accent-fg: #FFFFFF;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100dvh;
  width: 100%;
  background: #000000;
  color: var(--text-primary);
  font-family: var(--font-body);
}
body {
  display: flex;
  justify-content: center;
  overflow: hidden;
}

.moments-app {
  width: 100%;
  max-width: var(--max-w);
  height: 100dvh;
  position: relative;
  background: var(--page-bg);
  overflow: hidden;
}

.moments-content {
  height: 100%;
  overflow-y: scroll;
  scroll-behavior: smooth;
  scroll-snap-type: y mandatory;
  scrollbar-width: none;
}

.moments-content::-webkit-scrollbar {
  display: none;
}

#momentsFeed {
  display: flex;
  flex-direction: column;
  padding-bottom: 110px; /* keeps trailing cards clear of the floating nav */
}

/* ===== FULL-BLEED MEDIA CARD (video / photo) ===== */
.timeline-item.media-item {
  height: 100dvh;
  width: 100%;
  scroll-snap-align: start;
  scroll-snap-stop: always;
  position: relative;
  overflow: hidden;
  background: #000;
}

/* ===== COMPACT CARD (review / instagram embed) ===== */
.timeline-item.compact-item {
  padding: 16px;
  margin-bottom: 16px;
  scroll-snap-align: start;
}

.timeline-item-media {
  width: 100%;
  height: 100%;
  position: relative;
  overflow: hidden;
  background: var(--card-bg);
}

.timeline-item-video-container,
.timeline-item-photo-container {
  width: 100%;
  height: 100%;
  position: relative;
  overflow: hidden;
  background: #000;
}

.timeline-item-video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  background: #000;
  cursor: pointer;
  display: block;
}

/* Blurred background fill for photos that aren't natively 9:16, so
   object-fit:cover never leaves a bare gap at the top/bottom of the frame */
.media-bg-blur {
  position: absolute;
  inset: -24px;
  background-size: cover;
  background-position: center;
  filter: blur(28px) brightness(0.55) saturate(1.1);
  transform: scale(1.15);
  z-index: 0;
}

.timeline-item-image {
  position: relative;
  z-index: 1;
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

/* ===== CREATOR HEADER OVERLAY (top of media) ===== */
.creator-header {
  position: absolute;
  top: 0; left: 0; right: 0;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px 44px;
  background: linear-gradient(to bottom, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0.28) 55%, transparent 100%);
  z-index: 15;
  pointer-events: none;
}

.creator-header .follow-btn { pointer-events: auto; }

.creator-avatar {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: var(--accent-bg);
  color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 14px;
  border: 1.5px solid rgba(255,255,255,0.35);
  flex-shrink: 0;
}

.creator-name {
  color: #fff;
  font-size: 14px;
  font-weight: 600;
  flex: 1;
  text-shadow: 0 1px 3px rgba(0,0,0,0.5);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.follow-btn {
  padding: 6px 14px;
  border-radius: 999px;
  border: 1.5px solid rgba(255,255,255,0.7);
  color: #fff;
  font-size: 12px;
  font-weight: 700;
  text-decoration: none;
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  flex-shrink: 0;
  transition: background 0.2s ease, transform 0.2s ease;
}

.follow-btn:active {
  transform: scale(0.94);
  background: rgba(255,255,255,0.2);
}

/* ===== CAPTION SCRIM (bottom of media) ===== */
.caption-scrim {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  padding: 60px 84px calc(120px + env(safe-area-inset-bottom, 0px)) 16px;
  background: linear-gradient(to top, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0.35) 45%, transparent 100%);
  z-index: 12;
  pointer-events: none;
}

.caption-scrim .timeline-item-caption {
  color: #fff;
  font-size: 14px;
  line-height: 1.4;
  margin-bottom: 4px;
  word-wrap: break-word;
  text-shadow: 0 1px 2px rgba(0,0,0,0.4);
}

.caption-scrim .timeline-item-meta {
  color: rgba(255,255,255,0.75);
  font-size: 12px;
  letter-spacing: -0.1px;
}

/* ===== RIGHT-SIDE ACTION STACK (icon-only, glass pills) ===== */
.engagement-overlay {
  position: absolute;
  right: 14px;
  bottom: 210px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  z-index: 20;
}

.video-controls-overlay {
  position: absolute;
  right: 14px;
  bottom: 150px;
  display: none;
  flex-direction: column;
  gap: 14px;
  z-index: 20;
}

.engagement-btn, .control-btn {
  position: relative;
  width: 46px; height: 46px;
  border-radius: 50%;
  background: rgba(0, 0, 0, 0.4);
  border: 1px solid rgba(255, 255, 255, 0.25);
  color: white;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  transition: transform 0.25s cubic-bezier(.34,1.56,.64,1), background 0.2s ease;
}

.engagement-btn svg, .control-btn svg {
  width: 23px; height: 23px;
  fill: currentColor;
}

.engagement-btn:active, .control-btn:active {
  background: rgba(0, 0, 0, 0.6);
  transform: scale(0.88);
}

.engagement-btn .icon-fill { display: none; }
.engagement-btn.liked .icon-outline { display: none; }
.engagement-btn.liked .icon-fill { display: block; }

.engagement-btn.liked {
  color: #FF1744;
  background: rgba(255, 23, 68, 0.22);
  border-color: rgba(255, 23, 68, 0.5);
  transform: scale(1.06);
}

.engagement-btn.liked::after {
  content: '';
  position: absolute;
  inset: -1px;
  border-radius: 50%;
  border: 2px solid #FF1744;
  animation: heartPulse 0.6s ease-out;
}

@keyframes heartPulse {
  0% { transform: scale(0.85); opacity: 1; }
  100% { transform: scale(1.5); opacity: 0; }
}

.control-btn.muted { opacity: 0.75; }

/* ===== FLOATING ACTION BUTTON (Share) ===== */
.fab-share {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 16px);
  right: 16px;
  width: 44px; height: 44px;
  border-radius: 50%;
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  color: #fff;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  z-index: 55;
  box-shadow: 0 6px 20px rgba(0,0,0,0.3);
  transition: transform 0.2s ease;
}

.fab-share svg { width: 22px; height: 22px; stroke: currentColor; fill: none; }
.fab-share:active { transform: scale(0.9); }

/* ===== COMPACT CARDS: Google Review + Instagram Embed ===== */
.timeline-item-review {
  background: var(--card-bg);
  border-radius: var(--radius-lg);
  padding: 18px;
  border: 1px solid var(--border-crisp);
  border-left: 4px solid #FFFFFF;
}

.timeline-item-review-rating {
  display: flex;
  gap: 4px;
  margin-bottom: 8px;
  font-size: 16px;
}

.timeline-item-review-text {
  font-size: 13px;
  line-height: 1.5;
  color: var(--card-text-soft);
  margin-bottom: 8px;
  font-style: italic;
}

.timeline-item-review-author {
  font-size: 12px;
  color: var(--text-tertiary);
  font-weight: 500;
}

.instagram-embed-card {
  background: var(--card-bg);
  border-radius: var(--radius-lg);
  padding: 16px;
  border: 1px solid var(--border-crisp);
}

.instagram-embed-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
}

.instagram-embed-meta {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.instagram-embed-meta .creator-name {
  color: var(--card-text);
  font-size: 14px;
  font-weight: 600;
  text-shadow: none;
}

.instagram-embed-date {
  color: var(--card-text-soft);
  font-size: 11px;
}

.instagram-embed-caption {
  color: var(--card-text-soft);
  font-size: 13px;
  line-height: 1.4;
  margin-bottom: 12px;
}

.instagram-embed-frame {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 24px 16px;
  border-radius: var(--radius-md);
  background: linear-gradient(135deg, rgba(225,48,108,0.18), rgba(120,60,220,0.18));
  border: 1px dashed rgba(255,255,255,0.2);
  color: var(--card-text-soft);
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 12px;
}

.instagram-embed-frame svg { width: 22px; height: 22px; stroke: #E1306C; fill: none; }

.instagram-embed-cta {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 12px;
  border-radius: var(--radius-md);
  background: #fff;
  color: #000;
  font-size: 14px;
  font-weight: 700;
  text-decoration: none;
  transition: opacity 0.2s ease;
}

.instagram-embed-cta svg { width: 16px; height: 16px; stroke: currentColor; fill: none; }
.instagram-embed-cta:active { opacity: 0.85; }

/* ===== FLOATING ISLAND BOTTOM NAVIGATION ===== */
.moments-nav {
  position: fixed;
  left: 50%;
  bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 6px;
  border-radius: 999px;
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  backdrop-filter: blur(22px) saturate(180%);
  -webkit-backdrop-filter: blur(22px) saturate(180%);
  box-shadow: 0 10px 30px rgba(0,0,0,0.35);
  z-index: 50;
  transition: transform 0.4s cubic-bezier(.4,0,.2,1), opacity 0.3s ease;
}

.moments-nav.nav-condensed {
  transform: translateX(-50%) translateY(160%);
  opacity: 0;
  pointer-events: none;
}

.moments-nav-btn {
  width: 46px; height: 46px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: none;
  border: none;
  color: rgba(255,255,255,0.7);
  cursor: pointer;
  text-decoration: none;
  transition: background 0.2s ease, color 0.2s ease, transform 0.15s ease;
}

.moments-nav-btn:active { transform: scale(0.88); }

.moments-nav-btn svg {
  width: 21px; height: 21px;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.8;
}

.moments-nav-btn.active {
  background: rgba(255,255,255,0.16);
  color: #fff;
}

.moments-nav-btn.instagram-btn { color: #E1306C; }

/* ===== UPLOAD MODAL (unchanged structurally, icon-only tweaks) ===== */
.upload-modal {
  display: none;
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 100;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 16px;
}

.upload-modal.open { display: flex; }

.upload-modal-content {
  background: var(--page-bg);
  border-radius: var(--radius-lg);
  padding: 24px;
  width: 100%;
  max-width: 360px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  border: 1px solid var(--page-border);
  max-height: 85dvh;
  overflow-y: auto;
}

.upload-modal-title {
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 12px;
  text-align: left;
  letter-spacing: -0.3px;
}

.upload-modal-subtitle {
  font-size: 12px;
  color: var(--text-tertiary);
  margin-bottom: 16px;
}

.upload-modal-field { margin-bottom: 16px; }

.upload-modal-label {
  display: block;
  font-size: 11px;
  font-weight: 700;
  color: var(--text-secondary);
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.upload-modal-input {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--page-border);
  border-radius: 6px;
  background: var(--page-bg);
  color: var(--text-primary);
  font-family: inherit;
  font-size: 14px;
  transition: border-color 0.2s ease;
}

.upload-modal-input:focus {
  outline: none;
  border-color: var(--text-primary);
}

.upload-modal-file { display: none; }

.upload-modal-file-list {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 12px;
}

.file-chip {
  background: var(--accent-bg);
  color: var(--card-text);
  padding: 6px 12px;
  border-radius: 16px;
  font-size: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.file-chip-remove {
  cursor: pointer;
  font-weight: bold;
  opacity: 0.7;
  transition: opacity 0.2s;
}

.file-chip-remove:active { opacity: 1; }

.file-counter {
  font-size: 12px;
  color: var(--text-tertiary);
  margin-bottom: 8px;
}

.file-counter.warning { color: #FF6B00; }

.upload-modal-file-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  padding: 12px;
  border: 2px dashed var(--page-border);
  border-radius: 6px;
  background: transparent;
  color: var(--text-secondary);
  cursor: pointer;
  font-size: 14px;
  text-align: center;
  transition: border-color 0.2s ease;
  font-weight: 500;
}

.upload-modal-file-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; }

.upload-modal-file-btn:active {
  border-color: var(--text-primary);
  color: var(--text-primary);
}

#uploadPreview {
  width: 100%;
  max-height: 200px;
  object-fit: cover;
  border-radius: 6px;
  margin: 12px 0;
  display: none;
}

#uploadPreview.show { display: block; }

.upload-modal-actions {
  display: flex;
  gap: 12px;
  margin-top: 20px;
}

.upload-modal-btn {
  flex: 1;
  padding: 12px;
  border: 1px solid var(--text-primary);
  border-radius: 6px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
  font-size: 14px;
}

.upload-modal-btn.submit {
  background: var(--text-primary);
  color: var(--page-bg);
  border-color: var(--text-primary);
}

.upload-modal-btn.submit:active {
  opacity: 0.85;
  transform: scale(0.98);
}

.upload-modal-btn.submit:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.upload-modal-btn.cancel {
  background: transparent;
  color: var(--text-primary);
  border-color: var(--page-border);
}

.upload-modal-btn.cancel:active { background: var(--accent-bg); }

.upload-progress {
  width: 100%;
  height: 4px;
  background: var(--page-border);
  border-radius: 2px;
  overflow: hidden;
  margin-top: 12px;
  display: none;
}

.upload-progress.show { display: block; }

.upload-progress-bar {
  height: 100%;
  background: var(--text-primary);
  width: 0%;
  transition: width 0.3s ease;
}

</style>
</head>
<body>

<div class="moments-app">

  <div class="moments-content" id="momentsContent">
    <div id="momentsFeed"></div>
  </div>

  <button id="shareBtn" class="fab-share" title="Share a moment">
    <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <div class="upload-modal" id="uploadModal">
    <div class="upload-modal-content">
      <h2 class="upload-modal-title">Share a Moment</h2>
      <p class="upload-modal-subtitle">Upload up to 10 photos or videos</p>
      
      <div class="upload-modal-field">
        <label class="upload-modal-label">Your Name</label>
        <input type="text" id="uploadName" class="upload-modal-input" placeholder="First name">
      </div>

      <div class="upload-modal-field">
        <label class="upload-modal-label">Photos or Videos (Max 10)</label>
        <input type="file" id="uploadFile" class="upload-modal-file" accept="image/*,video/*" multiple>
        <button class="upload-modal-file-btn" onclick="document.getElementById('uploadFile').click()">
          <svg viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h3l2-3h6l2 3h3a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2z"/><circle cx="12" cy="13" r="4"/></svg>
          <span>Tap to choose files</span>
        </button>
        <div id="fileList" class="upload-modal-file-list"></div>
        <div id="fileCounter" class="file-counter"></div>
        <img id="uploadPreview" alt="Preview">
        <div id="uploadProgress" class="upload-progress">
          <div id="uploadProgressBar" class="upload-progress-bar"></div>
        </div>
      </div>

      <div class="upload-modal-field">
        <label class="upload-modal-label">Caption (Optional)</label>
        <input type="text" id="uploadCaption" class="upload-modal-input" placeholder="Say something...">
      </div>

      <div class="upload-modal-actions">
        <button class="upload-modal-btn cancel" id="uploadCancelBtn">Cancel</button>
        <button class="upload-modal-btn submit" id="uploadSubmitBtn">Share</button>
      </div>
    </div>
  </div>

  <nav class="moments-nav" id="momentsNav">
    <a href="./moments_hub.html" class="moments-nav-btn" title="Hub">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
    </a>
    <button class="moments-nav-btn active" disabled title="Moments">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M9.5 8.5v7l6-3.5z" fill="currentColor" stroke="none"/></svg>
    </button>
    <a href="./khichiya-runner.html" class="moments-nav-btn" title="Khichiya Runner">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 9h.01M15 9h.01M9 15a3 3 0 0 0 6 0"/></svg>
    </a>
    <a href="https://www.instagram.com/the.khichiyagravy" target="_blank" rel="noopener" class="moments-nav-btn instagram-btn" title="Instagram">

// ========== GLOBAL MUTE STATE MANAGER ==========
const MUTE_STATE = {
  muted: localStorage.getItem('tkg_muted') === 'false' ? false : true,
  
  setMuted: function(isMuted) {
    this.muted = isMuted;
    localStorage.setItem('tkg_muted', String(isMuted));
    this.updateAllVideos();
  },
  
  toggle: function() {
    this.setMuted(!this.muted);
  },
  
  updateAllVideos: function() {

    videos.forEach(video => {
      video.muted = this.muted;

    const muteBtn = document.querySelector('.control-btn.mute-btn');

      if (this.muted) {
        muteBtn.classList.add('muted');
        muteBtn.title = 'Unmute';
      } else {
        muteBtn.classList.remove('muted');
        muteBtn.title = 'Mute';
      }
    }
  }
};

// Global active video tracker
let activeVideo = null;
const videoObservers = new Map();
const likedVideos = new Set(JSON.parse(localStorage.getItem('tkg_liked_videos') || '[]'));

// ========== INTERSECTION OBSERVER ==========
function setupVideoObserver(videoElement, container) {
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting && entry.intersectionRatio >= 0.75) {
        if (activeVideo && activeVideo !== videoElement) {
          activeVideo.pause();
        }
        activeVideo = videoElement;
        videoElement.play().catch(err => {
          console.warn("Autoplay blocked:", err);
        });
        
        const overlay = container.querySelector('.video-controls-overlay');
        if (overlay) overlay.style.display = 'flex';
      } else {
        if (activeVideo === videoElement) {
          videoElement.pause();
          activeVideo = null;
        }
        
        const overlay = container.querySelector('.video-controls-overlay');
        if (overlay) overlay.style.display = 'none';
      }
    });
  }, { threshold: 0.75 });
  
  observer.observe(videoElement);
  videoObservers.set(videoElement, observer);
}

// ========== TAP TO PAUSE/PLAY ==========
function setupVideoTapHandler(videoElement) {
  videoElement.addEventListener('click', (e) => {
    e.stopPropagation();
    if (videoElement.paused) {
      videoElement.play();
    } else {
      videoElement.pause();
    }
  });
}

// ========== DOUBLE-TAP LIKE GESTURE ==========
function setupDoubleTapLike(container, videoId) {
  let lastTap = 0;
  
  container.addEventListener('click', (e) => {
    const currentTime = new Date().getTime();
    const tapLength = currentTime - lastTap;
    
    if (tapLength < 500 && tapLength > 0) {
      e.preventDefault();
      toggleLike(videoId, container);
    }
    lastTap = currentTime;
  });
}

function toggleLike(videoId, container) {
  const likeBtn = container.querySelector('.like-btn');
  
  if (likedVideos.has(videoId)) {
    likedVideos.delete(videoId);
    likeBtn.classList.remove('liked');
  } else {
    likedVideos.add(videoId);
    likeBtn.classList.add('liked');
  }
  
  localStorage.setItem('tkg_liked_videos', JSON.stringify([...likedVideos]));
}

// ========== CANVAS COMPRESSION ==========
async function compressImage(file) {
  return new Promise((resolve) => {
    if (!file.type.startsWith('image/')) {
      resolve(file);
      return;
    }
    
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const maxDim = 1200;
        let width = img.width;
        let height = img.height;
        
        if (width > height) {
          if (width > maxDim) {
            height = Math.round(height * (maxDim / width));
            width = maxDim;
          }
        } else {
          if (height > maxDim) {
            width = Math.round(width * (maxDim / height));
            height = maxDim;
          }
        }
        
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        
        canvas.toBlob(
          (blob) => {
            const compressedFile = new File([blob], file.name, {
              type: 'image/jpeg',
              lastModified: file.lastModified
            });
            resolve(compressedFile);
          },
          'image/jpeg',
          COMPRESSION_QUALITY
        );
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

// ========== BASE64 ENCODING ==========
function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]); // strip data: prefix, keep raw base64
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// ========== FETCH MOMENTS ==========
async function fetchMoments() {
  try {
    const response = await fetch(APP_SCRIPT_URL + '?action=moments');
    if (!response.ok) throw new Error('Network error');
    
    const data = await response.json();
    if (data.status !== 'ok') throw new Error(data.message || 'API error');
    
    moments = data.moments || [];
    renderTimeline();
  } catch (err) {
    console.error('Failed to fetch moments:', err);
    FEED.innerHTML = '<div style="padding: 16px; text-align: center; color: var(--text-tertiary);">Failed to load moments. Please try again later.</div>';
  }
}

// ========== RENDER TIMELINE ==========
function renderTimeline() {
  FEED.innerHTML = '';
  
  if (moments.length === 0) {
    FEED.innerHTML = '<div style="padding: 16px; text-align: center; color: var(--text-tertiary);">No moments shared yet</div>';
    return;
  }

  let timelineItems = [];

  moments.forEach((moment) => {
    const type = String(moment.type || 'customer_photo').toLowerCase();
    
    if (type === 'google_review' || type === 'review') {
      timelineItems.push({
        type: 'google_review',
        data: moment
      });
      return;
    }

    if (type === 'instagram' || type === 'social_link' || moment.instagramUrl || moment.socialUrl) {
      timelineItems.push({
        type: 'instagram',
        data: moment
      });
      return;
    }

    if (moment.media && Array.isArray(moment.media)) {
      moment.media.forEach((item) => {
        const mimeType = item.mimeType || 'image/jpeg';
        const isVideo = mimeType.indexOf('video/') === 0;
        
        timelineItems.push({
          type: isVideo ? 'video' : 'photo',
          data: {
            ...moment,
            media: item
          }
        });
      });
    }
  });

  timelineItems.forEach((item, idx) => {
    const card = createTimelineCard(item, `card-${idx}`);
    if (card) FEED.appendChild(card);
  });

  MUTE_STATE.updateAllVideos();
}

// ========== FORMAT DATE ==========
function formatDate(date, time) {
  const dayNames = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  let dateObj;
  
  try {
    dateObj = new Date(date);
  } catch (e) {
    return 'Recently';
  }
  
  if (isNaN(dateObj)) return 'Recently';
  
  const day = dayNames[dateObj.getDay()];
  const timeStr = time ? String(time).slice(0, 5) : '';
  
  return timeStr ? `${day} ${timeStr}` : day;
}

// ========== EXTRACT GOOGLE DRIVE ID ==========
function extractGoogleDriveId(rawUrl) {
  if (!rawUrl) return null;
  
  let match = rawUrl.match(/\/file\/d\/([^\/]+)/);
  if (match && match[1]) return match[1];

  match = rawUrl.match(/id=([^&]+)/);
  if (match && match[1]) return match[1];

  match = rawUrl.match(/\/d\/([a-zA-Z0-9_-]+)/);
  if (match && match[1]) return match[1];

  return null;
}

// ========== TRANSFORM DRIVE URL FOR <img> TAGS ==========
function transformDriveImageUrl(rawUrl) {
  if (!rawUrl) return rawUrl;
  const fileId = extractGoogleDriveId(rawUrl);
  if (!fileId) return rawUrl;
  // lh3.googleusercontent.com loads cleanly in <img> tags without Drive's viewer chrome
  return `https://lh3.googleusercontent.com/d/${fileId}`;
}

SHARE_BTN.addEventListener('click', () => {

  UPLOAD_NAME.focus();
});

UPLOAD_CANCEL.addEventListener('click', () => {

});

UPLOAD_FILE.addEventListener('change', (e) => {
  selectedFiles = Array.from(e.target.files || []);
  
  if (selectedFiles.length > MAX_FILES) {
    alert(`Maximum ${MAX_FILES} files allowed. ${selectedFiles.length} selected.`);
    selectedFiles = selectedFiles.slice(0, MAX_FILES);
    e.target.value = '';
  }
  
  updateFilePreview();
});

function updateFilePreview() {
  FILE_LIST.innerHTML = '';
  FILE_COUNTER.textContent = `${selectedFiles.length}/${MAX_FILES} files selected`;
  
  if (selectedFiles.length === MAX_FILES) {
    FILE_COUNTER.classList.add('warning');
    FILE_COUNTER.textContent += ' (max reached)';
  } else {
    FILE_COUNTER.classList.remove('warning');
  }
  
  selectedFiles.forEach((file, idx) => {
    const chip = document.createElement('div');
    chip.className = 'file-chip';
    chip.innerHTML = `
      ${file.name.substring(0, 20)}
      <span class="file-chip-remove" data-idx="${idx}">×</span>
    `;
    chip.querySelector('.file-chip-remove').addEventListener('click', () => {
      selectedFiles.splice(idx, 1);
      updateFilePreview();
    });
    FILE_LIST.appendChild(chip);
  });
  
  if (selectedFiles.length > 0) {
    const file = selectedFiles[0];
    if (file.type.startsWith('image/')) {
      const reader = new FileReader();
      reader.onload = (e) => {
        UPLOAD_PREVIEW.src = e.target.result;
        UPLOAD_PREVIEW.classList.add('show');
      };
      reader.readAsDataURL(file);
    } else {
      UPLOAD_PREVIEW.classList.remove('show');
    }
  }
}

UPLOAD_SUBMIT.addEventListener('click', async () => {

  const caption = UPLOAD_CAPTION.value.trim();
  
  if (!name) {
    alert('Please enter your name');
    return;

  if (selectedFiles.length === 0) {
    alert('Please select at least one file');
    return;
  }
  
  UPLOAD_SUBMIT.disabled = true;
  UPLOAD_PROGRESS.classList.add('show');
  let uploaded = 0;
  
  try {
    for (const file of selectedFiles) {
      const compressed = await compressImage(file);
      const base64 = await fileToBase64(compressed);
      
      const payload = {
        action: 'upload',
        uploaderName: name,
        caption: caption,
        media: [{
          fileName: compressed.name,
          fileType: compressed.type,
          fileData: base64
        }]
      };
      
      const response = await fetch(APP_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      
      if (!response.ok) {
        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
      }
      
      const result = await response.json();
      if (result.status !== 'ok') {
        throw new Error(result.message || 'Upload failed');
      }
      
      uploaded++;
      UPLOAD_PROGRESS_BAR.style.width = Math.round((uploaded / selectedFiles.length) * 100) + '%';
    }
    
    closeUploadModal();
    fetchMoments();
  } catch (err) {
    console.error('Upload error:', err);
    alert('Upload failed: ' + err.message);
  } finally {
    UPLOAD_SUBMIT.disabled = false;
    UPLOAD_PROGRESS.classList.remove('show');
    UPLOAD_PROGRESS_BAR.style.width = '0%';
  }
});

function closeUploadModal() {
  UPLOAD_MODAL.classList.remove('open');
  UPLOAD_NAME.value = '';
  UPLOAD_CAPTION.value = '';
  UPLOAD_FILE.value = '';
  UPLOAD_PREVIEW.classList.remove('show');
  FILE_LIST.innerHTML = '';
  FILE_COUNTER.textContent = '';
  selectedFiles = [];
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && UPLOAD_MODAL.classList.contains('open')) {
    closeUploadModal();
  }
});

// ========== ESCAPE HTML ==========
function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// ========== FLOATING NAV — SCROLL-RESPONSIVE CONDENSE/REVEAL ==========
// Additive only: does not touch video/mute/upload logic. Hides the pill on
// scroll-down to maximize media viewing area, restores it on scroll-up, on
// tap, or once scrolling settles for a moment.
(function setupFloatingNavScroll() {
  const scrollEl = document.getElementById('momentsContent');
  const nav = document.getElementById('momentsNav');
  if (!scrollEl || !nav) return;

  let lastScrollTop = scrollEl.scrollTop;
  let settleTimer = null;
  const DELTA_THRESHOLD = 12; // ignore tiny scroll jitter

  function showNav() { nav.classList.remove('nav-condensed'); }
  function hideNav() { nav.classList.add('nav-condensed'); }

  scrollEl.addEventListener('scroll', () => {
    const current = scrollEl.scrollTop;
    const delta = current - lastScrollTop;

    if (Math.abs(delta) > DELTA_THRESHOLD) {
      if (delta > 0 && current > 40) {
        hideNav(); // scrolling down past the first screen
      } else {
        showNav(); // scrolling up
      }
      lastScrollTop = current;
    }

    clearTimeout(settleTimer);
    settleTimer = setTimeout(showNav, 900); // reveal once scrolling settles
  }, { passive: true });

  nav.addEventListener('click', showNav);
})();


// ========== INIT ==========
fetchMoments();
</script>
