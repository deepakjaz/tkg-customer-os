<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>TKG Moments — The Khichiya Gravy</title>
<meta name="theme-color" content="#0B0B0C">
<meta name="description" content="TKG Moments — customer photos and Instagram moments from The Khichiya Gravy">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<script async src="https://www.instagram.com/embed.js"></script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<script>
(function(){
  try{
    var scale = localStorage.getItem('tkg_font_scale');
    var sizes = { small: '92%', medium: '100%', large: '115%' };
    document.documentElement.style.fontSize = sizes[scale] || sizes.medium;
  }catch(e){}
})();
</script>

<script>
(function(){
  try{
    var theme = localStorage.getItem('tkg_theme');
    document.documentElement.setAttribute('data-tkg-theme', theme === 'dark' ? 'dark' : 'light');
  }catch(e){
    document.documentElement.setAttribute('data-tkg-theme', 'light');
  }
})();
</script>

<style>
:root{
  --charcoal:       #160F0C;
  --tkg-page-bg:     #FFFFFF;
  --tkg-plain-border: #E6E3DD;
  --tkg-plain-opaque-bg: #1A1815;
  --tkg-plain-opaque-fg: #FFFFFF;
  --tkg-marble-bg-color: #0F0E0C;
  --tkg-marble-image: url('tkg-marble-black.jpg');
  --tkg-marble-overlay: rgba(0,0,0,0.42);
  --tkg-marble-border: rgba(0,0,0,0.06);
  --tkg-marble-ink: #F2EFEA;
  --tkg-marble-ink-soft: rgba(242,239,234,0.72);
  --tkg-ctrl-bg: #1A1815;
  --tkg-ctrl-fg: #FFFFFF;
  --stone-card:      rgba(255,255,255,0.62);
  --glass-blur:      18px;
  --ink:             #1C1815;
  --ink-soft:        #6B6256;
  --ember:          #E85D2C;
  --ember-deep:     #B8431D;
  --moments-ambient-bg:
    radial-gradient(ellipse 90% 55% at 50% 8%, rgba(232,93,44,0.30), transparent 60%),
    radial-gradient(ellipse 70% 45% at 50% 100%, rgba(184,67,29,0.22), transparent 65%),
    var(--charcoal);
  --radius-lg: 18px;
  --radius-md: 12px;
  --max-w: 430px;
  --font-display: 'Charcoal-Display', system-ui, -apple-system, sans-serif;
  --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}

*{box-sizing:border-box; margin:0; padding:0;}
html,body{
  background:var(--tkg-page-bg);
  color:var(--ink);
  font-family:var(--font-body);
  -webkit-tap-highlight-color:transparent;
  height:100%;
}
body{
  display:flex;
  justify-content:center;
  min-height:100vh;
  min-height:100dvh;
}
button{font-family:inherit; cursor:pointer;}
input{font-family:inherit;}

.screen{
  flex:1;
  display:none;
  flex-direction:column;
  padding:0 20px 28px;
  animation:fade-in 0.35s ease;
}
.screen.active{display:flex;}
#screen-moments{ padding:0 !important; }

.moments-topbar{
  position:fixed;
  top:0; left:0; right:0;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:calc(env(safe-area-inset-top, 0px) + 12px) 16px 12px;
  background:linear-gradient(180deg, rgba(0,0,0,0.55), rgba(0,0,0,0));
  pointer-events:none;
}
.moments-stat{
  pointer-events:auto;
  color:#fff;
  font-size:0.75rem;
  font-weight:700;
  background:rgba(28,24,21,0.45);
  padding:8px 14px;
  border-radius:20px;
}
.moments-viewer{
  position:fixed;
  inset:0;
  overflow-y:auto;
  scroll-snap-type:y mandatory;
  background:var(--moments-ambient-bg);
  -webkit-overflow-scrolling:touch;
}
.moments-slide{
  position:relative;
  width:100%;
  height:100vh;
  height:100dvh;
  scroll-snap-align:start;
  scroll-snap-stop:always;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:var(--moments-ambient-bg);
}
.moments-slide-media{
  width:100%;
  height:100%;
  object-fit:cover;
}

.moments-video-wrap {
  position: relative;
  width: 100%;
  height: 55vh;
  display: flex;
  align-items: center;
  justify-content: center;
}
.moments-video-wrap iframe {
  width: 100%;
  height: 100%;
  border: none;
}

.moments-slide-media-scroller{
  display:flex;
  width:100%;
  height:55vh;
  overflow-x:auto;
  scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;
}
.moments-slide-media-scroller > .moments-slide-media, 
.moments-slide-media-scroller > .moments-video-wrap {
  flex:0 0 100%;
  scroll-snap-align:start;
}
.moments-slide-media-dots{
  position:absolute;
  top:calc(env(safe-area-inset-top, 0px) + 16px);
  left:0; right:0;
  display:flex;
  justify-content:center;
  gap:5px;
  z-index:5;
  pointer-events:none;
}
.moments-slide-media-dots span{
  width:5px; height:5px;
  border-radius:50%;
  background:rgba(255,255,255,0.45);
}
.moments-slide-gradient{
  position:absolute;
  left:0; right:0; bottom:0;
  height:40%;
  background:linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.8) 100%);
  pointer-events:none;
}
.moments-slide-caption{
  position:absolute;
  left:16px; right:76px; bottom:calc(env(safe-area-inset-bottom, 0px) + 78px);
  color:#fff;
  font-size:0.9375rem;
  line-height:1.4;
  text-shadow:0 1px 4px rgba(0,0,0,0.4);
}
.moments-slide-actions{
  position:absolute;
  right:14px; bottom:calc(env(safe-area-inset-bottom, 0px) + 78px);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:16px;
  z-index:5;
}
.moments-heart-btn, .moments-share-btn{
  width:42px;
  height:42px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,0.15);
  background:rgba(0,0,0,0.38);
  backdrop-filter:blur(4px);
  display:flex;
  align-items:center;
  justify-content:center;
  transition:transform 0.18s ease, background 0.18s ease;
}
.moments-heart-btn svg, .moments-share-btn svg{
  width:21px; height:21px;
}
.moments-heart-btn.liked{
  background:var(--ember);
  border-color:transparent;
  transform:scale(1.08);
}
.moments-empty, .moments-loading{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:#fff;
  background:#000;
  font-size:0.875rem;
  padding:32px 16px;
  z-index:10;
}
.moments-fab-row{
  position:fixed;
  left:16px; right:16px;
  bottom:calc(env(safe-area-inset-bottom, 0px) + 16px);
  z-index:20;
  display:flex;
  gap:10px;
}
.moments-fab{
  flex:1;
  background:var(--ember);
  color:#fff;
  border:none;
  border-radius:24px;
  padding:13px;
  font-size:0.8125rem;
  font-weight:700;
  box-shadow:0 6px 16px -6px rgba(0,0,0,0.5);
}
.moments-compose-overlay{
  position:fixed;
  inset:0;
  z-index:30;
  background:rgba(0,0,0,0.75);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.moments-compose-overlay.hidden{ display:none; }
.moments-compose-card{
  width:100%;
  max-width:360px;
  background:var(--stone-card);
  backdrop-filter:blur(var(--glass-blur));
  -webkit-backdrop-filter:blur(var(--glass-blur));
  border-radius:var(--radius-lg);
  padding:18px;
  max-height:90vh;
  overflow-y:auto;
}
.moments-compose-grid{
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:8px;
  margin-bottom:14px;
}
.moments-compose-thumb-wrap{
  position:relative;
  width:100%;
  aspect-ratio:1;
  border-radius:var(--radius-md);
  overflow:hidden;
  background:#000;
}
.moments-compose-thumb-wrap img, .moments-compose-thumb-wrap video{
  width:100%; height:100%; object-fit:cover; display:block;
}
.moments-compose-remove-badge{
  position:absolute; top:4px; right:4px;
  width:22px; height:22px; border-radius:50%; border:none;
  background:rgba(232,93,44,0.95); color:#fff; font-size:0.8rem; font-weight:700;
  display:flex; align-items:center; justify-content:center;
}
.moments-compose-add-tile{
  width:100%; aspect-ratio:1; border-radius:var(--radius-md);
  border:2px dashed rgba(0,0,0,0.15); background:none;
  display:flex; align-items:center; justify-content:center; font-size:1.5rem; color:var(--ink-soft);
}
.moments-status{ font-size:0.75rem; color:var(--ink-soft); margin-top:8px; }
.moments-status.error{ color:var(--ember-deep); }

.toast{
  position:fixed; bottom:24px; left:50%;
  transform:translateX(-50%) translateY(20px);
  background:var(--tkg-plain-opaque-bg); color:var(--tkg-plain-opaque-fg);
  padding:13px 20px; border-radius:var(--radius-md); font-size:0.8125rem; font-weight:600;
  opacity:0; pointer-events:none; transition:all 0.25s ease; z-index:200;
}
.toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
.hidden{display:none !important;}
</style>
</head>
<body>

<div id="toast" class="toast"></div>

<section class="screen active" id="screen-moments">
  <div class="moments-topbar">
    <button type="button" id="momentsMenuBtn" style="display:flex; align-items:center; gap:8px; background:none; border:none; cursor:pointer; pointer-events:auto;">
      <img src="./icon-192.png" alt="TKG Logo" style="width:36px; height:36px; border-radius:6px;">
      <span style="font-size:14px; font-weight:500; color:#1C1815;">Open Menu</span>
    </button>
    <div class="moments-stat" id="momentsStat"></div>
  </div>

  <div class="moments-viewer" id="momentsViewer"></div>
  <div class="moments-empty" id="momentsEmptyState" style="display:none;">No moments yet — be the first to share one!</div>
  <div class="moments-loading" id="momentsLoadingState">Loading gallery…</div>

  <div class="moments-fab-row">
    <input type="file" accept="image/*,video/*" multiple id="momentsFileInput" style="display:none;">
    <button type="button" class="moments-fab" id="momentShareBtn">Share your moment</button>
  </div>

  <!-- Compose Modal -->
  <div class="moments-compose-overlay hidden" id="momentsComposeOverlay">
    <div class="moments-compose-card">
      <div class="moments-compose-grid" id="momentsComposeGrid"></div>
      <label style="font-size:0.75rem; font-weight:700; text-transform:uppercase; margin-bottom:6px; display:block;" for="momentsCaptionInput">Add a caption? (optional)</label>
      <input style="width:100%; padding:12px; border-radius:8px; border:1px solid #ccc; font-size:0.9rem;" id="momentsCaptionInput" type="text" placeholder="Say something about this moment" maxlength="200">
      <div class="moments-status" id="momentsUploadStatus"></div>
      <button type="button" id="momentsComposePostBtn" style="width:100%; margin-top:12px; padding:14px; border-radius:10px; border:none; background:#1A1815; color:#fff; font-weight:700;">Post</button>
      <button type="button" id="momentsComposeCancelBtn" style="width:100%; margin-top:8px; padding:12px; border-radius:10px; border:1px solid #ccc; background:none; font-weight:600;">Cancel</button>
    </div>
  </div>

  <!-- Instagram Link Modal -->
  <div class="moments-compose-overlay hidden" id="momentsLinkOverlay">
    <div class="moments-compose-card">
      <div style="font-weight:800; font-size:1.1rem; margin-bottom:12px;">Share Instagram link</div>
      <input style="width:100%; padding:12px; border-radius:8px; border:1px solid #ccc;" id="momentsLinkInput" type="url" placeholder="https://www.instagram.com/p/...">
      <div class="moments-status" id="momentsLinkStatus"></div>
      <button type="button" id="momentsLinkSubmitBtn" style="width:100%; margin-top:12px; padding:14px; border-radius:10px; border:none; background:#E85D2C; color:#fff; font-weight:700;">Add to Gallery</button>
      <button type="button" id="momentsLinkCancelBtn" style="width:100%; margin-top:8px; padding:12px; border-radius:10px; border:none; background:none;">Cancel</button>
    </div>
  </div>

  <!-- Choice Modal -->
  <div class="moments-compose-overlay hidden" id="momentsChoiceOverlay">
    <div class="moments-compose-card" style="max-width:320px;">
      <div style="font-weight:800; font-size:1.1rem; margin-bottom:16px; text-align:center;">Share your moment</div>
      <button type="button" id="choiceMemoryBtn" style="width:100%; background:#1A1815; color:#fff; border:none; border-radius:12px; padding:16px; font-weight:600; margin-bottom:10px;">A memory here (Photo/Video)</button>
      <button type="button" id="choiceInstagramBtn" style="width:100%; background:transparent; color:#E85D2C; border:1.5px solid #E85D2C; border-radius:12px; padding:16px; font-weight:600;">Your Instagram post</button>
      <button type="button" id="choiceCancelBtn" style="width:100%; background:none; border:none; padding:12px; color:#9C9286; margin-top:8px;">Dismiss</button>
    </div>
  </div>
</section>

<script>
const APP_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxyftcQEeDkU1sf2MJy4Zwj12C9J8z4UVWTY1-ny5HM9HhJ0azlkMt5Gvp-nJXDgtLnLA/exec';

const momentsMenuBtn = document.getElementById('momentsMenuBtn');
const momentsStat = document.getElementById('momentsStat');
const momentsViewer = document.getElementById('momentsViewer');
const momentsEmptyState = document.getElementById('momentsEmptyState');
const momentsLoadingState = document.getElementById('momentsLoadingState');
const momentsFileInput = document.getElementById('momentsFileInput');
const momentShareBtn = document.getElementById('momentShareBtn');
const momentsComposeOverlay = document.getElementById('momentsComposeOverlay');
const momentsComposeGrid = document.getElementById('momentsComposeGrid');
const momentsCaptionInput = document.getElementById('momentsCaptionInput');
const momentsUploadStatus = document.getElementById('momentsUploadStatus');
const momentsComposePostBtn = document.getElementById('momentsComposePostBtn');
const momentsComposeCancelBtn = document.getElementById('momentsComposeCancelBtn');
const momentsLinkOverlay = document.getElementById('momentsLinkOverlay');
const momentsLinkInput = document.getElementById('momentsLinkInput');
const momentsLinkStatus = document.getElementById('momentsLinkStatus');
const momentsLinkSubmitBtn = document.getElementById('momentsLinkSubmitBtn');
const momentsLinkCancelBtn = document.getElementById('momentsLinkCancelBtn');
const momentsChoiceOverlay = document.getElementById('momentsChoiceOverlay');
const choiceMemoryBtn = document.getElementById('choiceMemoryBtn');
const choiceInstagramBtn = document.getElementById('choiceInstagramBtn');
const choiceCancelBtn = document.getElementById('choiceCancelBtn');

let momentsStagedFiles = [];

momentsMenuBtn.addEventListener('click', () => { window.location.href = './index.html'; });

function setMomentsStatus(el, text, kind){
  el.textContent = text || '';
  el.classList.remove('error');
  if(kind === 'error') el.classList.add('error');
}

async function loadMomentsStat(){
  try{
    const [cRes, sRes] = await Promise.all([
      fetch(APP_SCRIPT_URL + '?action=customers'),
      fetch(APP_SCRIPT_URL + '?action=runnerScores')
    ]);
    const cData = await cRes.json();
    const sData = await sRes.json();
    const total = ((cData.customers || []).length) + ((sData.scores || []).length);
    if(total > 0) momentsStat.textContent = '🔥 ' + total + '+ part of the TKG story';
  }catch(e){}
}

const MOMENTS_LIKED_KEY = 'tkg_liked_moments';
function getLikedMomentIds(){
  try{ return new Set(JSON.parse(localStorage.getItem(MOMENTS_LIKED_KEY) || '[]')); } catch(e){ return new Set(); }
}
function toggleLikedMomentId(id){
  const liked = getLikedMomentIds();
  if(liked.has(id)) liked.delete(id); else liked.add(id);
  try{ localStorage.setItem(MOMENTS_LIKED_KEY, JSON.stringify(Array.from(liked))); }catch(e){}
  return liked.has(id);
}

// Helper: Extract Drive File ID from any Drive link format
function getDriveFileId(url) {
  if (!url) return null;
  const matchD = url.match(/\/d\/([a-zA-Z0-9-_]+)/);
  const matchId = url.match(/[?&]id=([a-zA-Z0-9-_]+)/);
  if (matchD && matchD[1]) return matchD[1];
  if (matchId && matchId[1]) return matchId[1];
  return null;
}

async function loadMoments(){
  momentsLoadingState.style.display = '';
  momentsEmptyState.style.display = 'none';
  momentsViewer.innerHTML = '';

  try{
    const res = await fetch(APP_SCRIPT_URL + '?action=moments');
    const data = await res.json();
    momentsLoadingState.style.display = 'none';

    if(!data || data.status !== 'ok' || !data.moments.length){
      momentsEmptyState.style.display = '';
      return;
    }

    const likedIds = getLikedMomentIds();
    const ordered = data.moments.slice().reverse();

    momentsViewer.innerHTML = ordered.map(m => {
      const mediaList = (m.media && m.media.length) ? m.media : (m.imageUrl ? [{ url: m.imageUrl, mimeType: 'image/jpeg' }] : []);
      
      if(m.type === 'photo' && mediaList.length){
        const isLiked = likedIds.has(m.id);
        const mediaHtml = mediaList.map(item => {
          const isVideo = item.mimeType && item.mimeType.indexOf('video/') === 0;

          if(isVideo){
            const fileId = getDriveFileId(item.url);
            const embedUrl = fileId 
              ? 'https://drive.google.com/file/d/' + fileId + '/preview' 
              : item.url;

            return '<div class="moments-video-wrap">' +
              '<iframe src="' + escapeHtml(embedUrl) + '" allow="autoplay"></iframe>' +
            '</div>';
          }
          return '<img class="moments-slide-media" src="' + escapeHtml(item.url) + '" alt="TKG moment" loading="lazy">';
        }).join('');

        const dotsHtml = mediaList.length > 1 ? '<div class="moments-slide-media-dots">' + mediaList.map(() => '<span></span>').join('') + '</div>' : '';

        return '<div class="moments-slide" data-id="' + escapeHtml(m.id) + '">' +
          dotsHtml +
          '<div class="moments-slide-media-scroller">' + mediaHtml + '</div>' +
          '<div class="moments-slide-gradient"></div>' +
          (m.caption ? '<div class="moments-slide-caption">' + escapeHtml(m.caption) + '</div>' : '') +
          '<div class="moments-slide-actions">' +
            '<button type="button" class="moments-heart-btn' + (isLiked ? ' liked' : '') + '" data-id="' + escapeHtml(m.id) + '">' +
              '<svg viewBox="0 0 24 24" fill="#fff"><path d="M12 21s-6.7-4.35-9.3-8.28C1.1 10.4 1.6 7.4 4 5.6c2.1-1.6 4.9-1.2 6.6.7L12 7.7l1.4-1.4c1.7-1.9 4.5-2.3 6.6-.7 2.4 1.8 2.9 4.8 1.3 7.12C18.7 16.65 12 21 12 21z"/></svg>' +
            '</button>' +
            '<button type="button" class="moments-share-btn" data-url="' + escapeHtml(mediaList[0].url) + '">' +
              '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>' +
            '</button>' +
          '</div>' +
        '</div>';
      }

      if(m.type === 'instagram' && m.instagramUrl){
        return '<div class="moments-slide">' +
          '<div class="moments-slide-embed"><blockquote class="instagram-media" data-instgrm-permalink="' + escapeHtml(m.instagramUrl) + '" data-instgrm-version="14"></blockquote></div>' +
        '</div>';
      }
      return '';
    }).join('');

    if(window.instgrm && window.instgrm.Embeds) window.instgrm.Embeds.process();

    // Wire actions
    momentsViewer.querySelectorAll('.moments-heart-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const nowLiked = toggleLikedMomentId(btn.dataset.id);
        btn.classList.toggle('liked', nowLiked);
      });
    });

    momentsViewer.querySelectorAll('.moments-share-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        if(navigator.share) navigator.share({ title: 'TKG Moments', url: btn.dataset.url });
        else { navigator.clipboard.writeText(btn.dataset.url); showToast('Link copied!'); }
      });
    });

  }catch(err){
    momentsLoadingState.style.display = 'none';
    momentsEmptyState.style.display = '';
  }
}

momentShareBtn.addEventListener('click', () => momentsChoiceOverlay.classList.remove('hidden'));
choiceMemoryBtn.addEventListener('click', () => { momentsChoiceOverlay.classList.add('hidden'); momentsFileInput.click(); });
choiceInstagramBtn.addEventListener('click', () => { momentsChoiceOverlay.classList.add('hidden'); momentsLinkOverlay.classList.remove('hidden'); });
choiceCancelBtn.addEventListener('click', () => momentsChoiceOverlay.classList.add('hidden'));

momentsFileInput.addEventListener('change', async () => {
  const files = Array.from(momentsFileInput.files || []);
  momentsFileInput.value = '';

  for(const file of files){
    if(file.size > 8 * 1024 * 1024){ alert('File "' + file.name + '" exceeds 8MB cap.'); continue; }
    const isVideo = file.type.indexOf('video/') === 0;
    const dataUrl = await readFileAsDataUrl(file);
    momentsStagedFiles.push({ localId: 'f_' + Date.now(), mimeType: file.type, dataUrl: dataUrl, isVideo: isVideo });
  }

  if(momentsStagedFiles.length > 0){
    renderComposeGrid();
    momentsComposeOverlay.classList.remove('hidden');
  }
});

function readFileAsDataUrl(file){
  return new Promise((res, rej) => {
    const reader = new FileReader();
    reader.onload = () => res(reader.result);
    reader.onerror = rej;
    reader.readAsDataURL(file);
  });
}

function renderComposeGrid(){
  momentsComposeGrid.innerHTML = momentsStagedFiles.map(f => {
    const tag = f.isVideo ? '<video src="' + f.dataUrl + '"></video>' : '<img src="' + f.dataUrl + '">';
    return '<div class="moments-compose-thumb-wrap">' + tag + '<button type="button" class="moments-compose-remove-badge" data-id="' + f.localId + '">×</button></div>';
  }).join('') + '<button type="button" class="moments-compose-add-tile" id="addMoreTile">+</button>';

  momentsComposeGrid.querySelectorAll('.moments-compose-remove-badge').forEach(b => {
    b.addEventListener('click', () => {
      momentsStagedFiles = momentsStagedFiles.filter(f => f.localId !== b.dataset.id);
      renderComposeGrid();
    });
  });
  const addMoreTile = document.getElementById('addMoreTile');
  if(addMoreTile) addMoreTile.addEventListener('click', () => momentsFileInput.click());
}

momentsComposeCancelBtn.addEventListener('click', () => { momentsStagedFiles = []; momentsComposeOverlay.classList.add('hidden'); });

momentsComposePostBtn.addEventListener('click', async () => {
  if(!momentsStagedFiles.length) return;
  momentsComposePostBtn.disabled = true;

  try {
    const media = [];
    for(let i = 0; i < momentsStagedFiles.length; i++){
      setMomentsStatus(momentsUploadStatus, 'Uploading ' + (i+1) + '/' + momentsStagedFiles.length + '…');
      const f = momentsStagedFiles[i];
      const res = await fetch(APP_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'uploadMomentFile', base64Data: f.dataUrl.split('base64,')[1], mimeType: f.mimeType })
      });
      const data = await res.json();
      if(data.status === 'ok') media.push({ url: data.url, thumbnailUrl: data.thumbnailUrl, mimeType: data.mimeType });
    }

    setMomentsStatus(momentsUploadStatus, 'Posting…');
    await fetch(APP_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'uploadMoment', media: media, caption: momentsCaptionInput.value.trim() })
    });

    momentsStagedFiles = [];
    momentsCaptionInput.value = '';
    momentsComposeOverlay.classList.add('hidden');
    loadMoments();
  } catch(e) {
    setMomentsStatus(momentsUploadStatus, 'Upload failed, please try again.', 'error');
  } finally {
    momentsComposePostBtn.disabled = false;
  }
});

momentsLinkCancelBtn.addEventListener('click', () => momentsLinkOverlay.classList.add('hidden'));
momentsLinkSubmitBtn.addEventListener('click', async () => {
  const url = momentsLinkInput.value.trim();
  if(!url || url.indexOf('instagram.com') === -1){ setMomentsStatus(momentsLinkStatus, 'Invalid Instagram URL', 'error'); return; }
  momentsLinkSubmitBtn.disabled = true;
  
  try {
    await fetch(APP_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'submitMomentLink', instagramUrl: url })
    });
    momentsLinkOverlay.classList.add('hidden');
    loadMoments();
  } catch(e) {
    setMomentsStatus(momentsLinkStatus, 'Failed to add link.', 'error');
  } finally {
    momentsLinkSubmitBtn.disabled = false;
  }
});

function escapeHtml(s){ return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
let toastTimer;
function showToast(m){
  const t = document.getElementById('toast');
  t.textContent = m; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

loadMoments();
loadMomentsStat();
</script>
</body>
</html>
