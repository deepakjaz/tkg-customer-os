<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>TKG Moments</title>
<meta name="theme-color" content="#0B0B0C">
<meta name="apple-mobile-web-app-capable" content="yes">

<script>
// Theme anti-FOUC — same pattern as index.html
(function(){
  try{
    var theme = localStorage.getItem('tkg_theme');
    document.documentElement.setAttribute('data-tkg-theme', theme === 'dark' ? 'dark' : 'light');
  }catch(e){
    document.documentElement.setAttribute('data-tkg-theme', 'light');
  }
})();
</script>

<style>
/* ==========================================================================
   THEME TOKENS (reused from index.html)
   ========================================================================== */
:root{
  --charcoal:       #160F0C;
  --charcoal-soft:  #221813;
  --ember-card:     #2A1E17;
  --ember-card-top: #32241B;
  --marble:         #FAF7F2;
  --marble-dim:     #EEEEEC;
  --marble-warm:    #F7F6F3;
  --grey-line:      #3D2E24;

  --stone-base:      #F6F6F5;
  --tkg-page-bg:     #FFFFFF;
  --tkg-plain-border: #E6E3DD;
  --tkg-plain-opaque-bg: #1A1815;
  --tkg-plain-opaque-fg: #FFFFFF;
  --tkg-marble-bg-color: #0F0E0C;
  --tkg-marble-image: url('tkg-marble-black.jpg');
  --tkg-marble-overlay: rgba(0,0,0,0.42);
  --tkg-marble-border: rgba(0,0,0,0.06);
  --tkg-marble-ink: #F2EFEA;
  --tkg-marble-ink-soft: rgba(242,239,234,0.72);
  --tkg-marble-ink-faint: rgba(242,239,234,0.55);
  --tkg-ctrl-bg: #1A1815;
  --tkg-ctrl-fg: #FFFFFF;
  --stone-card:      rgba(255,255,255,0.62);
  --stone-card-alt:  rgba(255,255,255,0.5);
  --stone-vein:      #C9C9C7;
  --stone-vein-soft: #DCDCDA;
  --stone-line:      rgba(255,255,255,0.65);
  --stone-divider:   rgba(28,24,21,0.14);
  --glass-blur:      18px;
  --ink:             #1C1815;
  --ink-soft:        #6B6256;
  --ink-faint:       #9C9286;

  --ember:          #E85D2C;
  --ember-bright:   #FF7A45;
  --ember-deep:     #B8431D;
  --ember-glow:     #FAC646;

  --radius-lg: 18px;
  --radius-md: 12px;
  --radius-sm: 8px;
  --max-w: 430px;

  --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
}

html[data-tkg-theme="dark"]{
  --tkg-page-bg:     #0B0B0C;
  --tkg-plain-border: #2A2420;
  --tkg-plain-opaque-bg: #FAF7F2;
  --tkg-plain-opaque-fg: #160F0C;
  --tkg-marble-bg-color: #FAF7F2;
  --tkg-marble-overlay: rgba(255,255,255,0.06);
  --tkg-marble-border: rgba(255,255,255,0.12);
  --tkg-marble-ink: #160F0C;
  --tkg-marble-ink-soft: rgba(22,15,12,0.64);
  --tkg-marble-ink-faint: rgba(22,15,12,0.48);
  --tkg-ctrl-bg: #FAF7F2;
  --tkg-ctrl-fg: #160F0C;
  --ink:             #F2EFEA;
  --ink-soft:        #A89878;
  --ink-faint:       #6B6256;
}

/* ==========================================================================
   BASE STYLES
   ========================================================================== */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { 
  height: 100%; 
  width: 100%; 
  background: var(--tkg-page-bg); 
  color: var(--ink); 
  font-family: var(--font-body);
}
body { 
  display: flex; 
  justify-content: center; 
}

.moments-app {
  width: 100%;
  max-width: var(--max-w);
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

/* ==========================================================================
   HEADER (reusing logo component from index.html)
   ========================================================================== */
.moments-header {
  background: var(--tkg-page-bg);
  border-bottom: 0.5px solid var(--tkg-plain-border);
  padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 12px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}

.hero-logo-large {
  width: 56px;
  height: 56px;
  flex-shrink: 0;
  border-radius: 50%;
  object-fit: cover;
}

.moments-header-text {
  flex: 1;
}

.moments-header-title {
  font-size: 16px;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 2px;
}

.moments-header-subtitle {
  font-size: 12px;
  color: var(--ink-soft);
}

/* ==========================================================================
   FEED (VERTICAL SCROLLING)
   ========================================================================== */
.moments-feed {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  display: flex;
  flex-direction: column;
}

/* Instagram-style card: full width, stacked vertically */
.moment-card {
  width: 100%;
  border-bottom: 0.5px solid var(--tkg-plain-border);
  padding: 12px 0;
  display: flex;
  flex-direction: column;
}

.moment-media {
  width: 100%;
  background: var(--stone-base);
  overflow: hidden;
  position: relative;
}

.moment-media-image {
  width: 100%;
  height: auto;
  display: block;
  object-fit: contain;
}

.moment-media-video {
  width: 100%;
  height: auto;
  display: block;
}

/* Video thumbnail + play button overlay */
.moment-video-container {
  position: relative;
  width: 100%;
  background: #000;
  display: flex;
  align-items: center;
  justify-content: center;
}

.moment-video-thumbnail {
  width: 100%;
  height: auto;
  display: block;
}

.moment-video-play-button {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0, 0, 0, 0.35);
  border: none;
  cursor: pointer;
  padding: 0;
  font-size: 56px;
  color: #fff;
  text-shadow: 0 2px 8px rgba(0,0,0,0.5);
  transition: background 0.2s ease;
}

.moment-video-play-button:active {
  background: rgba(0, 0, 0, 0.55);
}

.moment-info {
  padding: 12px 16px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.moment-caption {
  font-size: 14px;
  line-height: 1.4;
  color: var(--ink);
}

.moment-meta {
  font-size: 12px;
  color: var(--ink-soft);
}

/* Empty & loading states */
.moments-empty,
.moments-loading,
.moments-error {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 48px 24px;
  color: var(--ink-soft);
}

.moments-error {
  color: var(--ink);
  background: rgba(181, 57, 47, 0.1);
  border-radius: 12px;
  margin: 12px;
}

/* ==========================================================================
   FULLSCREEN VIDEO PLAYER
   ========================================================================== */
.fullscreen-video-player {
  display: none;
  position: fixed;
  inset: 0;
  background: #000;
  z-index: 200;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px) 0;
}

.fullscreen-video-player.open {
  display: flex;
}

.fullscreen-video-player-close {
  position: absolute;
  top: calc(env(safe-area-inset-top, 0px) + 12px);
  right: 16px;
  background: none;
  border: none;
  color: #fff;
  font-size: 28px;
  cursor: pointer;
  z-index: 201;
  padding: 0;
  width: 40px;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity 0.2s ease;
}

.fullscreen-video-player-close:active {
  opacity: 0.6;
}

.fullscreen-video-player video {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

/* ==========================================================================
   BOTTOM NAV
   ========================================================================== */
.moments-nav {
  background: var(--tkg-page-bg);
  border-top: 0.5px solid var(--tkg-plain-border);
  padding: 8px 0 calc(8px + env(safe-area-inset-bottom, 0px));
  display: flex;
  justify-content: space-around;
  align-items: center;
  flex-shrink: 0;
}

.moments-nav-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 4px 8px;
  background: none;
  border: none;
  cursor: pointer;
  text-decoration: none;
  color: var(--ink-soft);
  font-size: 11px;
  font-weight: 500;
  transition: color 0.2s ease;
}

.moments-nav-btn.active {
  color: var(--ember);
}

.moments-nav-btn:active {
  opacity: 0.7;
}

.moments-nav-btn svg {
  width: 20px;
  height: 20px;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.5;
}

.moments-nav-btn.instagram-btn svg {
  fill: currentColor;
}

/* ==========================================================================
   RESPONSIVE
   ========================================================================== */
@media (max-width: 380px) {
  .moments-header {
    padding: calc(env(safe-area-inset-top, 0px) + 8px) 12px 8px;
    gap: 8px;
  }
  
  .hero-logo-large {
    width: 48px;
    height: 48px;
  }
  
  .moments-header-title {
    font-size: 14px;
  }

  .moment-info {
    padding: 10px 12px;
  }

  .moment-caption {
    font-size: 13px;
  }
}
</style>
</head>
<body>

<div class="moments-app">
  <!-- HEADER -->
  <div class="moments-header">
    <img class="hero-logo-large" src="./icon-192.png" alt="TKG">
    <div class="moments-header-text">
      <div class="moments-header-title">TKG Moments</div>
      <div class="moments-header-subtitle">Gallery from the community</div>
    </div>
  </div>

  <!-- FEED (vertical scrolling) -->
  <div class="moments-feed" id="momentsFeed">
    <div class="moments-loading">Loading moments...</div>
  </div>

  <!-- FULLSCREEN VIDEO PLAYER (overlay) -->
  <div class="fullscreen-video-player" id="fullscreenPlayer">
    <button class="fullscreen-video-player-close" id="closePlayer">✕</button>
    <video id="fullscreenVideo" playsinline controls></video>
  </div>

  <!-- BOTTOM NAV -->
  <nav class="moments-nav">
    <a href="./index.html" class="moments-nav-btn" title="Menu">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      <span>Menu</span>
    </a>
    <button class="moments-nav-btn active" id="momentsBtn" title="Moments" disabled>
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
      <span>Moments</span>
    </button>
    <a href="./khichiya-runner.html" class="moments-nav-btn" title="Khichiya Runner">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 9h.01M15 9h.01M9 15a3 3 0 0 0 6 0"/></svg>
      <span>TKR</span>
    </a>
    <a href="https://www.instagram.com/the.khichiyagravy" target="_blank" class="moments-nav-btn instagram-btn" title="Instagram">
      <svg viewBox="0 0 24 24"><path d="M7.8 2h8.4C19.4 2 22 4.6 22 7.8v8.4c0 3.2-2.6 5.8-5.8 5.8H7.8C4.6 22 2 19.4 2 16.2V7.8C2 4.6 4.6 2 7.8 2m-.6 2c-2 0-3.6 1.6-3.6 3.6v8.5c0 2 1.6 3.6 3.6 3.6h9.6c2 0 3.6-1.6 3.6-3.6V7.6c0-2-1.6-3.6-3.6-3.6H7.2m9.65 1.5a1.25 1.25 0 0 1 1.25 1.25A1.25 1.25 0 0 1 16.9 6a1.25 1.25 0 0 1-1.25-1.25 1.25 1.25 0 0 1 1.25-1.25M12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10m0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/></svg>
      <span>Instagram</span>
    </a>
  </nav>
</div>

<script>
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxyftcQEeDkU1sf2MJy4Zwj12C9J8z4UVWTY1-ny5HM9HhJ0azlkMt5Gvp-nJXDgtLnLA/exec';

const FEED = document.getElementById('momentsFeed');
const FULLSCREEN_PLAYER = document.getElementById('fullscreenPlayer');
const FULLSCREEN_VIDEO = document.getElementById('fullscreenVideo');
const CLOSE_PLAYER_BTN = document.getElementById('closePlayer');

let moments = [];

// ========== FETCH MOMENTS FROM APPS SCRIPT ==========
async function fetchMoments() {
  try {
    const response = await fetch(APPS_SCRIPT_URL + '?action=moments');
    if (!response.ok) throw new Error('Network error');
    
    const data = await response.json();
    if (data.status !== 'ok') throw new Error(data.message || 'API error');
    
    moments = data.moments || [];
    renderFeed();
  } catch (err) {
    console.error('Failed to fetch moments:', err);
    FEED.innerHTML = '<div class="moments-error">Failed to load moments. Please try again later.</div>';
  }
}

// ========== RENDER FEED (vertical scrolling cards) ==========
function renderFeed() {
  FEED.innerHTML = '';
  
  if (moments.length === 0) {
    FEED.innerHTML = '<div class="moments-empty">No moments shared yet</div>';
    return;
  }
  
  moments.forEach((moment) => {
    // Handle direct imageUrl (single image)
    if (moment.imageUrl) {
      const card = createImageCard(moment, moment.imageUrl);
      FEED.appendChild(card);
    }
    
    // Handle media array (multiple items per moment)
    if (moment.media && Array.isArray(moment.media)) {
      moment.media.forEach((item) => {
        const mimeType = item.mimeType || 'image/jpeg';
        const isVideo = mimeType.indexOf('video/') === 0;
        
        if (isVideo) {
          const card = createVideoCard(moment, item);
          FEED.appendChild(card);
        } else {
          const card = createImageCard(moment, item.url);
          FEED.appendChild(card);
        }
      });
    }
  });
}

// ========== CREATE IMAGE CARD ==========
function createImageCard(moment, imageUrl) {
  const card = document.createElement('div');
  card.className = 'moment-card';
  
  card.innerHTML = `
    <div class="moment-media">
      <img class="moment-media-image" src="${imageUrl}" alt="${moment.caption || 'Moment'}" loading="lazy">
    </div>
    <div class="moment-info">
      ${moment.caption ? `<div class="moment-caption">${moment.caption}</div>` : ''}
      <div class="moment-meta">Shared by TKG</div>
    </div>
  `;
  
  return card;
}

// ========== CREATE VIDEO CARD ==========
function createVideoCard(moment, mediaItem) {
  const card = document.createElement('div');
  card.className = 'moment-card';
  
  const thumbnailUrl = mediaItem.thumbnailUrl || mediaItem.url;
  
  card.innerHTML = `
    <div class="moment-media moment-video-container">
      <img class="moment-video-thumbnail" src="${thumbnailUrl}" alt="Video thumbnail" loading="lazy">
      <button class="moment-video-play-button" aria-label="Play video">▶</button>
    </div>
    <div class="moment-info">
      ${moment.caption ? `<div class="moment-caption">${moment.caption}</div>` : ''}
      <div class="moment-meta">Shared by TKG • Video</div>
    </div>
  `;
  
  // Tap play button to open fullscreen player
  const playBtn = card.querySelector('.moment-video-play-button');
  playBtn.addEventListener('click', () => openFullscreenPlayer(mediaItem.url));
  
  return card;
}

// ========== OPEN FULLSCREEN VIDEO PLAYER ==========
function openFullscreenPlayer(videoUrl) {
  FULLSCREEN_VIDEO.src = videoUrl;
  FULLSCREEN_PLAYER.classList.add('open');
  document.body.style.overflow = 'hidden';
  FULLSCREEN_VIDEO.play();
}

// ========== CLOSE FULLSCREEN PLAYER ==========
function closeFullscreenPlayer() {
  FULLSCREEN_VIDEO.pause();
  FULLSCREEN_VIDEO.src = '';
  FULLSCREEN_PLAYER.classList.remove('open');
  document.body.style.overflow = '';
}

// ========== EVENT LISTENERS ==========
CLOSE_PLAYER_BTN.addEventListener('click', closeFullscreenPlayer);

FULLSCREEN_PLAYER.addEventListener('click', (e) => {
  if (e.target === FULLSCREEN_PLAYER) closeFullscreenPlayer();
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && FULLSCREEN_PLAYER.classList.contains('open')) {
    closeFullscreenPlayer();
  }
});

// ========== INIT ==========
fetchMoments();
</script>
</body>
</html>
