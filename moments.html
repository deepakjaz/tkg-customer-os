<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>TKG Moments</title>
<meta name="theme-color" content="#0B0B0C">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
:root {
  --charcoal: #160F0C;
  --tkg-page-bg: #FFFFFF;
  --tkg-border: #E6E3DD;
  --ink: #1C1815;
  --ink-soft: #6B6256;
  --ember: #E85D2C;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; width: 100%; background: var(--tkg-page-bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
body { display: flex; justify-content: center; }

.moments-page {
  width: 100%;
  max-width: 430px;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

/* HEADER */
.moments-header {
  background: #fff;
  border-bottom: 0.5px solid var(--tkg-border);
  padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.moments-header-left {
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
}

.moments-header-logo {
  width: 36px;
  height: 36px;
  border-radius: 6px;
  background: #E85D2C;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-weight: bold;
  font-size: 16px;
}

.moments-header-text {
  font-size: 12px;
  font-weight: 600;
  color: var(--ink);
  line-height: 1.2;
}

.moments-stat {
  font-size: 11px;
  font-weight: 700;
  color: var(--ink-soft);
}

/* SCROLL AREA */
.moments-scroll {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* CARD */
.moments-card {
  background: #fff;
  border-radius: 12px;
  border: 0.5px solid var(--tkg-border);
  overflow: hidden;
  cursor: pointer;
}

.moments-card-image {
  width: 100%;
  aspect-ratio: 1;
  object-fit: cover;
  display: block;
  background: #e8e8e8;
}

.moments-card-content {
  padding: 12px;
  display: flex;
  gap: 12px;
  align-items: flex-start;
}

.moments-card-text {
  flex: 1;
}

.moments-card-caption {
  font-size: 14px;
  font-weight: 500;
  color: var(--ink);
  margin-bottom: 4px;
}

.moments-card-meta {
  font-size: 12px;
  color: var(--ink-soft);
}

.moments-card-buttons {
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: center;
  justify-content: flex-start;
}

.moments-btn-action {
  background: none;
  border: none;
  font-size: 18px;
  cursor: pointer;
  color: var(--ink-soft);
  padding: 0;
  width: 24px;
  height: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.moments-btn-action.liked {
  color: #E85D2C;
}

/* EMPTY */
.moments-empty {
  text-align: center;
  padding: 48px 32px;
  color: var(--ink-soft);
}

/* BOTTOM NAV */
.moments-nav {
  background: #fff;
  border-top: 0.5px solid var(--tkg-border);
  padding: 8px 0 calc(8px + env(safe-area-inset-bottom, 0px));
  display: flex;
  justify-content: space-around;
  align-items: center;
}

.moments-nav-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 4px 8px;
  background: none;
  border: none;
  cursor: pointer;
  text-decoration: none;
  color: var(--ink-soft);
  font-size: 11px;
  font-weight: 500;
}

.moments-nav-btn.active {
  color: #E85D2C;
}

.moments-nav-btn svg {
  width: 20px;
  height: 20px;
}

/* VIEWER OVERLAY */
.moments-viewer {
  display: none;
  position: fixed;
  inset: 0;
  background: #000;
  z-index: 100;
  flex-direction: column;
}

.moments-viewer.open {
  display: flex;
}

.moments-viewer-close {
  position: absolute;
  top: calc(env(safe-area-inset-top, 0px) + 12px);
  right: 16px;
  background: none;
  border: none;
  color: #fff;
  font-size: 24px;
  cursor: pointer;
  z-index: 101;
  padding: 0;
  width: 32px;
  height: 32px;
}

.moments-viewer-image {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: auto;
}

.moments-viewer-image img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
}

/* TOAST */
.moments-toast {
  position: fixed;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 80px);
  left: 50%;
  transform: translateX(-50%);
  background: var(--ink);
  color: #fff;
  padding: 12px 20px;
  border-radius: 8px;
  font-size: 13px;
  opacity: 0;
  pointer-events: none;
  z-index: 150;
}

.moments-toast.show {
  opacity: 1;
}
</style>
</head>
<body>

<div class="moments-page">
  <!-- HEADER -->
  <div class="moments-header">
    <div class="moments-header-left" id="headerMenu">
      <div class="moments-header-logo">TKG</div>
      <div class="moments-header-text">THE KHICHIYA<br>GRAVY</div>
    </div>
    <div class="moments-stat">🔥 34+</div>
  </div>

  <!-- SCROLL -->
  <div class="moments-scroll" id="momentsList"></div>

  <!-- VIEWER -->
  <div class="moments-viewer" id="viewer">
    <button class="moments-viewer-close" id="closeViewer">✕</button>
    <div class="moments-viewer-image" id="viewerImage"></div>
  </div>

  <!-- NAV -->
  <nav class="moments-nav">
    <a href="./index.html" class="moments-nav-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      Menu
    </a>
    <button class="moments-nav-btn active" id="momentsBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
      Moments
    </button>
    <a href="./khichiya-runner.html" class="moments-nav-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M9 9h.01M15 9h.01M9 15a3 3 0 0 0 6 0"/></svg>
      TKR
    </a>
    <a href="https://www.instagram.com/the.khichiyagravy" target="_blank" class="moments-nav-btn">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7.8 2h8.4C19.4 2 22 4.6 22 7.8v8.4c0 3.2-2.6 5.8-5.8 5.8H7.8C4.6 22 2 19.4 2 16.2V7.8C2 4.6 4.6 2 7.8 2m-.6 2c-2 0-3.6 1.6-3.6 3.6v8.5c0 2 1.6 3.6 3.6 3.6h9.6c2 0 3.6-1.6 3.6-3.6V7.6c0-2-1.6-3.6-3.6-3.6H7.2m9.65 1.5a1.25 1.25 0 0 1 1.25 1.25A1.25 1.25 0 0 1 16.9 6a1.25 1.25 0 0 1-1.25-1.25 1.25 1.25 0 0 1 1.25-1.25M12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10m0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/></svg>
      Instagram
    </a>
  </nav>

  <!-- TOAST -->
  <div class="moments-toast" id="toast"></div>
</div>

<script>
const DEMO_MOMENTS = [
  { id: 'm1', caption: 'Delicious khichiya at the event', image: 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 400 400%22%3E%3Crect width=%22400%22 height=%22400%22 fill=%22%23e8e8e8%22/%3E%3C/svg%3E' },
  { id: 'm2', caption: 'Team at TKG kitchen', image: 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 400 400%22%3E%3Crect width=%22400%22 height=%22400%22 fill=%22%23e8e8e8%22/%3E%3C/svg%3E' },
  { id: 'm3', caption: 'Customer enjoying the meal', image: 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 400 400%22%3E%3Crect width=%22400%22 height=%22400%22 fill=%22%23e8e8e8%22/%3E%3C/svg%3E' },
  { id: 'm4', caption: 'Beautiful sunset at TKG', image: 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 400 400%22%3E%3Crect width=%22400%22 height=%22400%22 fill=%22%23e8e8e8%22/%3E%3C/svg%3E' },
  { id: 'm5', caption: 'Fresh ingredients from local market', image: 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 400 400%22%3E%3Crect width=%22400%22 height=%22400%22 fill=%22%23e8e8e8%22/%3E%3C/svg%3E' }
];

const LIST = document.getElementById('momentsList');
const VIEWER = document.getElementById('viewer');
const CLOSE_BTN = document.getElementById('closeViewer');
const VIEWER_IMG = document.getElementById('viewerImage');
const HEADER_MENU = document.getElementById('headerMenu');
const TOAST_EL = document.getElementById('toast');

let likedMoments = new Set();

// Load liked from localStorage
function loadLiked() {
  try {
    const data = localStorage.getItem('tkg_liked_moments');
    likedMoments = new Set(data ? JSON.parse(data) : []);
  } catch (e) {}
}

// Save liked to localStorage
function saveLiked() {
  try {
    localStorage.setItem('tkg_liked_moments', JSON.stringify(Array.from(likedMoments)));
  } catch (e) {}
}

// Show toast
function showToast(msg) {
  TOAST_EL.textContent = msg;
  TOAST_EL.classList.add('show');
  setTimeout(() => TOAST_EL.classList.remove('show'), 2500);
}

// Render moments
function renderMoments() {
  LIST.innerHTML = '';
  
  if (!DEMO_MOMENTS.length) {
    LIST.innerHTML = '<div class="moments-empty">No moments yet</div>';
    return;
  }
  
  DEMO_MOMENTS.forEach(m => {
    const isLiked = likedMoments.has(m.id);
    
    const card = document.createElement('div');
    card.className = 'moments-card';
    card.innerHTML = `
      <img class="moments-card-image" src="${m.image}" alt="Moment">
      <div class="moments-card-content">
        <div class="moments-card-text">
          <div class="moments-card-caption">${m.caption}</div>
          <div class="moments-card-meta">Shared by TKG family</div>
        </div>
        <div class="moments-card-buttons">
          <button class="moments-btn-action heart-btn ${isLiked ? 'liked' : ''}" data-id="${m.id}">${isLiked ? '♥' : '♡'}</button>
          <button class="moments-btn-action share-btn" data-image="${m.image}">→</button>
        </div>
      </div>
    `;
    
    // Click to open viewer
    card.addEventListener('click', (e) => {
      if (e.target.closest('.moments-btn-action')) return;
      openViewer(m);
    });
    
    // Heart button
    const heartBtn = card.querySelector('.heart-btn');
    heartBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (likedMoments.has(m.id)) {
        likedMoments.delete(m.id);
        heartBtn.textContent = '♡';
        heartBtn.classList.remove('liked');
      } else {
        likedMoments.add(m.id);
        heartBtn.textContent = '♥';
        heartBtn.classList.add('liked');
      }
      saveLiked();
    });
    
    // Share button
    const shareBtn = card.querySelector('.share-btn');
    shareBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (navigator.share) {
        navigator.share({ title: 'TKG Moments', url: m.image });
      } else {
        navigator.clipboard.writeText(m.image);
        showToast('Link copied!');
      }
    });
    
    LIST.appendChild(card);
  });
}

// Open viewer
function openViewer(moment) {
  VIEWER_IMG.innerHTML = `<img src="${moment.image}" alt="${moment.caption}">`;
  VIEWER.classList.add('open');
}

// Close viewer
CLOSE_BTN.addEventListener('click', () => VIEWER.classList.remove('open'));
VIEWER.addEventListener('click', (e) => {
  if (e.target === VIEWER) VIEWER.classList.remove('open');
});

// Header menu
HEADER_MENU.addEventListener('click', () => window.location.href = './index.html');

// Init
loadLiked();
renderMoments();
</script>
</body>
</html>
