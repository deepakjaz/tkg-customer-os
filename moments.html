      <div class="moments-compose-card" style="max-width: 360px;">
        <button type="button" id="tutorialCloseBtn" style="position: absolute; top: 12px; right: 12px; background: none; border: none; font-size: 20px; color: #1C1815; cursor: pointer; padding: 4px 8px;">×</button>
        <div class="journey-title" style="font-size:1.0625rem; margin-bottom:16px;">How to share from Instagram</div>
        
        <div id="tutorialStepContainer" style="background: #F6F6F5; border-radius: 12px; padding: 12px; margin-bottom: 16px; aspect-ratio: 9/16; display: flex; align-items: center; justify-content: center; overflow: hidden;">
          <svg id="instagramTutorialSvg" viewBox="0 0 280 400" style="width: 100%; height: 100%; max-width: 260px;">
            <defs>
              <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
                <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.2"/>
              </filter>
            </defs>
            
            <!-- Phone frame -->
            <rect x="20" y="20" width="240" height="360" rx="20" fill="#FFFFFF" stroke="#E6E3DD" stroke-width="2"/>

<script>
const APP_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxyftcQEeDkU1sf2MJy4Zwj12C9J8z4UVWTY1-ny5HM9HhJ0azlkMt5Gvp-nJXDgtLnLA/exec';

// ---------------------------------------------------------------------------
// TKG MOMENTS — customer photo/Instagram-moment gallery. Fullscreen
// vertical-swipe viewer. Two submission paths (direct photo upload via
// Apps Script -> Drive, or pasting a link to a moment already posted on
// the customer's own Instagram, embedded client-side via Instagram's own
// embed.js) feeding one shared, newest-first feed. No approval queue for
// now — everything submitted publishes immediately.
// ---------------------------------------------------------------------------
const momentsMenuBtn = document.getElementById('momentsMenuBtn');
const momentsStat = document.getElementById('momentsStat');
const momentsViewer = document.getElementById('momentsViewer');
const momentsEmptyState = document.getElementById('momentsEmptyState');
const momentsLoadingState = document.getElementById('momentsLoadingState');
const momentsFileInput = document.getElementById('momentsFileInput');
const momentShareBtn = document.getElementById('momentShareBtn');
const momentsComposeOverlay = document.getElementById('momentsComposeOverlay');
const momentsComposeGrid = document.getElementById('momentsComposeGrid');
const momentsCaptionInput = document.getElementById('momentsCaptionInput');
const momentsUploadStatus = document.getElementById('momentsUploadStatus');
const momentsComposePostBtn = document.getElementById('momentsComposePostBtn');
const momentsComposeCancelBtn = document.getElementById('momentsComposeCancelBtn');
const momentsLinkOverlay = document.getElementById('momentsLinkOverlay');
const momentsLinkInput = document.getElementById('momentsLinkInput');
const momentsLinkStatus = document.getElementById('momentsLinkStatus');
const momentsLinkSubmitBtn = document.getElementById('momentsLinkSubmitBtn');
const momentsLinkCancelBtn = document.getElementById('momentsLinkCancelBtn');

const momentsChoiceOverlay = document.getElementById('momentsChoiceOverlay');
const choiceMemoryBtn = document.getElementById('choiceMemoryBtn');
const choiceInstagramBtn = document.getElementById('choiceInstagramBtn');
const choiceCancelBtn = document.getElementById('choiceCancelBtn');

const momentsTutorialOverlay = document.getElementById('momentsTutorialOverlay');
const tutorialCloseBtn = document.getElementById('tutorialCloseBtn');
const tutorialNextBtn = document.getElementById('tutorialNextBtn');
const tutorialStepDots = document.querySelectorAll('.tutorial-step-dot');

let tutorialCurrentStep = 0;

momentsMenuBtn.addEventListener('click', () => {
  window.location.href = './index.html';
});

function setMomentsStatus(el, text, kind){
  el.textContent = text || '';
  el.classList.remove('error', 'success');
  if(kind) el.classList.add(kind);
}

// ---------------------------------------------------------------------------
// Honest community stat — real registered-customer count + real total game
// plays, added together and shown plainly labeled ("part of the TKG
// story"), never attached to any single photo as if it were that photo's
// like count. Both counts already come from existing, already-public GET
// actions — no new endpoint needed. Best-effort: if either fetch fails,
// the stat line is simply left blank rather than guessed at.
// ---------------------------------------------------------------------------
async function loadMomentsStat(){
  momentsStat.textContent = '';
  try{
    const [customersRes, scoresRes] = await Promise.all([
      fetch(APP_SCRIPT_URL + '?action=customers'),
      fetch(APP_SCRIPT_URL + '?action=runnerScores')
    ]);
    const customersData = await customersRes.json();
    const scoresData = await scoresRes.json();
    const customerCount = (customersData && Array.isArray(customersData.customers)) ? customersData.customers.length : 0;
    const playCount = (scoresData && Array.isArray(scoresData.scores)) ? scoresData.scores.length : 0;
    const total = customerCount + playCount;
    if(total > 0){
      momentsStat.textContent = '🔥 ' + total + '+ part of the TKG story';
    }
  }catch(err){
    console.warn('loadMomentsStat failed, leaving stat blank:', err);
  }
}

// Local-only "liked" memory, same pattern as the menu's item-heart
// localStorage use — purely a personal toggle so a moment you've tapped
// still shows filled if you scroll back to it, not a real shared count.
const MOMENTS_LIKED_KEY = 'tkg_liked_moments';
function getLikedMomentIds(){
  try{ return new Set(JSON.parse(localStorage.getItem(MOMENTS_LIKED_KEY) || '[]')); }
  catch(e){ return new Set(); }
}
function toggleLikedMomentId(id){
  const liked = getLikedMomentIds();
  if(liked.has(id)) liked.delete(id); else liked.add(id);
  try{ localStorage.setItem(MOMENTS_LIKED_KEY, JSON.stringify(Array.from(liked))); }catch(e){}
  return liked.has(id);
}

async function loadMoments(){
  momentsLoadingState.style.display = '';
  momentsEmptyState.style.display = 'none';
  momentsViewer.innerHTML = '';

  try{
    const res = await fetch(APP_SCRIPT_URL + '?action=moments');
    if(!res.ok) throw new Error('moments fetch failed: ' + res.status);
    const data = await res.json();
    if(!data || data.status !== 'ok' || !Array.isArray(data.moments)) throw new Error('Unexpected response');

    momentsLoadingState.style.display = 'none';

    if(data.moments.length === 0){
      momentsEmptyState.style.display = '';
      return;
    }

    const likedIds = getLikedMomentIds();
    // Newest first.
    const ordered = data.moments.slice().reverse();

    momentsViewer.innerHTML = ordered.map(m => {
      const mediaList = (m.media && m.media.length) ? m.media : (m.imageUrl ? [{ url: m.imageUrl, mimeType: 'image/jpeg' }] : []);
      if(m.type === 'photo' && mediaList.length){
        const isLiked = likedIds.has(m.id);
        const mediaHtml = mediaList.map(item => {
          const isVideo = item.mimeType && item.mimeType.indexOf('video/') === 0;
          return isVideo
            ? '<video class="moments-slide-media" src="' + escapeHtml(item.url) + '" muted loop playsinline controls></video>'
            : '<img class="moments-slide-media" src="' + escapeHtml(item.url) + '" alt="TKG moment" loading="lazy">';
        }).join('');
        const dotsHtml = mediaList.length > 1
          ? '<div class="moments-slide-media-dots">' + mediaList.map(() => '<span></span>').join('') + '</div>'
          : '';
        return '<div class="moments-slide">' +
          dotsHtml +
          '<div class="moments-slide-media-scroller">' + mediaHtml + '</div>' +
          '<div class="moments-slide-gradient"></div>' +
          (m.caption ? '<div class="moments-slide-caption">' + escapeHtml(m.caption) + '</div>' : '') +
          '<div class="moments-slide-actions">' +
            '<button type="button" class="moments-heart-btn' + (isLiked ? ' liked' : '') + '" data-id="' + escapeHtml(m.id) + '">' +
              '<svg viewBox="0 0 24 24" fill="#fff"><path d="M12 21s-6.7-4.35-9.3-8.28C1.1 10.4 1.6 7.4 4 5.6c2.1-1.6 4.9-1.2 6.6.7L12 7.7l1.4-1.4c1.7-1.9 4.5-2.3 6.6-.7 2.4 1.8 2.9 4.8 1.3 7.12C18.7 16.65 12 21 12 21z"/></svg>' +
            '</button>' +
            '<button type="button" class="moments-comment-btn">' +
              '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><path d="M21 12c0 4.4-4 8-9 8-1.2 0-2.4-.2-3.4-.6L3 20l1.1-4.1C3.4 14.7 3 13.4 3 12c0-4.4 4-8 9-8s9 3.6 9 8z"/></svg>' +
            '</button>' +
            '<button type="button" class="moments-share-btn" data-url="' + escapeHtml(mediaList[0].url) + '" data-caption="' + escapeHtml(m.caption || '') + '">' +
              '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>' +
            '</button>' +
          '</div>' +
        '</div>';
      }
      if(m.type === 'instagram' && m.instagramUrl){
        return '<div class="moments-slide">' +
          '<div class="moments-slide-embed"><blockquote class="instagram-media" data-instgrm-permalink="' +
            escapeHtml(m.instagramUrl) + '" data-instgrm-version="14"></blockquote></div>' +
        '</div>';
      }
      return '';
    }).join('');

    // Ask Instagram's embed script to render any new blockquotes just
    // inserted above. Guarded since embed.js loads async and may not have
    // attached window.instgrm yet on a very first, very fast visit.
    if(window.instgrm && window.instgrm.Embeds){
      window.instgrm.Embeds.process();
    }

    // Wire the heart/share buttons just rendered (delegation not needed —
    // the whole viewer is rebuilt fresh on every loadMoments() call).
    momentsViewer.querySelectorAll('.moments-heart-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const nowLiked = toggleLikedMomentId(btn.dataset.id);
        btn.classList.toggle('liked', nowLiked);
      });
    });
    // Comment icon is visual-only for now — no commenting system is built
    // yet. A gentle placeholder response instead of a dead tap.
    momentsViewer.querySelectorAll('.moments-comment-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        showToast('Comments coming soon!');
      });
    });
    momentsViewer.querySelectorAll('.moments-share-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const url = btn.dataset.url;
        const caption = btn.dataset.caption || '';

        // Copy the caption first (if there is one) so it's sitting ready
        // to paste the moment someone opens Instagram to post — this is
        // the whole point of the share button, since the OS share sheet
        // itself can't hand a caption directly into another app's composer.
        if(caption && navigator.clipboard){
          navigator.clipboard.writeText(caption).then(() => {
            showToast('Caption copied — paste it when you post!');
          }).catch(() => {});
        }

        if(navigator.share){
          navigator.share({ title: 'TKG Moments', text: caption || 'Check out this moment at TKG!', url: url }).catch(() => {});
        }else if(navigator.clipboard && !caption){
          navigator.clipboard.writeText(url);
          showToast('Link copied!');
        }
      });
    });
  }catch(err){
    console.warn('loadMoments failed:', err);
    momentsLoadingState.style.display = 'none';
    momentsEmptyState.style.display = '';
    momentsEmptyState.textContent = "Couldn't load the gallery right now — check your connection and try again.";
  }
}

// Resizes/compresses a photo client-side before upload (max 1280px on the
// long edge, JPEG ~0.82 quality) — keeps the upload fast and each request
// well within size limits, regardless of how large the original phone
// photo is. Videos are NOT run through this — canvas can't resize video,
// so videos are capped by the 8MB-per-file check below instead.
function resizeImageForUpload(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Could not read file'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('Could not load image'));
      img.onload = () => {
        const maxDim = 1280;
        let { width, height } = img;
        if(width > height && width > maxDim){
          height = Math.round(height * (maxDim / width));
          width = maxDim;
        }else if(height > maxDim){
          width = Math.round(width * (maxDim / height));
          height = maxDim;
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', 0.82));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

// Videos can't be resized client-side the way photos can, so they're just
// read as-is (still subject to the 8MB cap checked before this is called).
function readFileAsDataUrl(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Could not read file'));
    reader.onload = () => resolve(reader.result);
    reader.readAsDataURL(file);
  });
}

// ---------------------------------------------------------------------------
// Upload flow — two steps, not one. Picking photos/videos no longer uploads
// immediately: it opens the Compose card with a preview grid so the customer
// sees exactly what they're posting (and can remove any item with the ×
// badge, or add more) before anything is sent. Nothing reaches the backend
// until they tap Post.
// ---------------------------------------------------------------------------
const MOMENTS_MAX_FILE_BYTES = 8 * 1024 * 1024; // 8MB per file, images and videos alike
let momentsStagedFiles = []; // [{ localId, mimeType, dataUrl, isVideo }]

momentShareBtn.addEventListener('click', () => {
  momentsChoiceOverlay.classList.remove('hidden');
});

choiceMemoryBtn.addEventListener('click', () => {
  momentsChoiceOverlay.classList.add('hidden');
  momentsFileInput.click();
});

choiceInstagramBtn.addEventListener('click', () => {
  momentsChoiceOverlay.classList.add('hidden');
  tutorialCurrentStep = 0;
  updateTutorialStep();
  momentsTutorialOverlay.classList.remove('hidden');
});

choiceCancelBtn.addEventListener('click', () => {
  momentsChoiceOverlay.classList.add('hidden');
});

tutorialCloseBtn.addEventListener('click', () => {
  momentsTutorialOverlay.classList.add('hidden');
});

tutorialNextBtn.addEventListener('click', () => {
  tutorialCurrentStep++;
  if(tutorialCurrentStep >= 4){
    momentsTutorialOverlay.classList.add('hidden');
    momentsLinkInput.value = '';
    setMomentsStatus(momentsLinkStatus, '');
    momentsLinkOverlay.classList.remove('hidden');
  } else {
    updateTutorialStep();
  }
});

tutorialStepDots.forEach(dot => {
  dot.addEventListener('click', () => {
    tutorialCurrentStep = parseInt(dot.getAttribute('data-step'));
    updateTutorialStep();
  });
});

function updateTutorialStep(){
  for(let i = 0; i < 4; i++){
    const step = document.getElementById('step' + i);
    step.style.opacity = i === tutorialCurrentStep ? '1' : '0';
  }
  tutorialStepDots.forEach((dot, i) => {
    dot.style.background = i === tutorialCurrentStep ? '#E85D2C' : '#E6E3DD';
  });
  tutorialNextBtn.textContent = tutorialCurrentStep === 3 ? 'Got it! Now paste the link' : 'Next step';
}

momentsFileInput.addEventListener('change', async () => {
  const files = Array.from(momentsFileInput.files || []);
  momentsFileInput.value = ''; // allow picking the same file again later

  for(const file of files){
    if(file.size > MOMENTS_MAX_FILE_BYTES){
      alert('"' + file.name + '" is over 8MB — please pick a smaller photo/video.');
      continue;
    }
    try{
      const isVideo = file.type.indexOf('video/') === 0;
      const dataUrl = isVideo ? await readFileAsDataUrl(file) : await resizeImageForUpload(file);
      momentsStagedFiles.push({
        localId: 'f_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8),
        mimeType: isVideo ? file.type : 'image/jpeg',
        dataUrl: dataUrl,
        isVideo: isVideo
      });
    }catch(err){
      console.warn('Could not read/resize a picked file:', err);
    }
  }

  if(momentsStagedFiles.length > 0){
    momentsCaptionInput.value = momentsCaptionInput.value || '';
    setMomentsStatus(momentsUploadStatus, '');
    renderMomentsComposeGrid();
    momentsComposeOverlay.classList.remove('hidden');
  }
});

function renderMomentsComposeGrid(){
  momentsComposeGrid.innerHTML = momentsStagedFiles.map(f => {
    const mediaTag = f.isVideo
      ? '<video src="' + f.dataUrl + '" muted playsinline></video>'
      : '<img src="' + f.dataUrl + '" alt="Selected photo">';
    return '<div class="moments-compose-thumb-wrap">' + mediaTag +
      '<button type="button" class="moments-compose-remove-badge" data-local-id="' + f.localId + '">×</button>' +
      '</div>';
  }).join('') + '<button type="button" class="moments-compose-add-tile" id="momentsComposeAddTile">+</button>';

  momentsComposeGrid.querySelectorAll('.moments-compose-remove-badge').forEach(btn => {
    btn.addEventListener('click', () => {
      momentsStagedFiles = momentsStagedFiles.filter(f => f.localId !== btn.dataset.localId);
      renderMomentsComposeGrid();
    });
  });
  const addTile = document.getElementById('momentsComposeAddTile');
  if(addTile) addTile.addEventListener('click', () => momentsFileInput.click());
}

momentsComposeCancelBtn.addEventListener('click', () => {
  momentsStagedFiles = [];
  momentsComposeOverlay.classList.add('hidden');
});

momentsComposePostBtn.addEventListener('click', async () => {
  if(momentsStagedFiles.length === 0) return;

  momentsComposePostBtn.disabled = true;

  try{
    // Step 1 — upload each staged file individually (never batching several
    // files' base64 into one request), collecting the resulting Drive URLs.
    const media = [];
    for(let i = 0; i < momentsStagedFiles.length; i++){
      setMomentsStatus(momentsUploadStatus, 'Uploading ' + (i + 1) + ' of ' + momentsStagedFiles.length + '…');
      const f = momentsStagedFiles[i];
      const res = await fetch(APP_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // avoids CORS preflight on Apps Script
        body: JSON.stringify({
          action: 'uploadMomentFile',
          base64Data: f.dataUrl.split('base64,')[1],
          mimeType: f.mimeType
        })
      });
      if(!res.ok) throw new Error('Upload failed: ' + res.status);
      const data = await res.json();
      if(!data || data.status !== 'ok') throw new Error('File upload not recorded');
      media.push({ url: data.url, mimeType: data.mimeType });
    }

    // Step 2 — one final call writes a single Sheet row for the whole post,
    // holding all the media URLs together plus the caption. Uploader
    // identity (if this device already has one saved) is sent along
    // privately — it's logged in the Sheet but never shown publicly and
    // never returned by the moments API.
    setMomentsStatus(momentsUploadStatus, 'Posting…');
    const identity = getMyIdentity();
    const finalRes = await fetch(APP_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        action: 'uploadMoment',
        media: media,
        caption: momentsCaptionInput.value.trim(),
        uploaderName: identity ? identity.name : '',
        uploaderMobile: identity ? identity.mobile : ''
      })
    });
    if(!finalRes.ok) throw new Error('Upload failed: ' + finalRes.status);
    const finalData = await finalRes.json();
    if(!finalData || finalData.status !== 'ok') throw new Error('Upload not recorded');

    momentsStagedFiles = [];
    momentsComposeOverlay.classList.add('hidden');
    loadMoments();
    loadMomentsStat();
  }catch(err){
    console.warn('Moment upload failed:', err);
    setMomentsStatus(momentsUploadStatus, "Couldn't upload right now — check your connection and try again.", 'error');
  }finally{
    momentsComposePostBtn.disabled = false;
  }
});

momentsLinkCancelBtn.addEventListener('click', () => {
  momentsLinkOverlay.classList.add('hidden');
});

momentsLinkSubmitBtn.addEventListener('click', async () => {
  const url = momentsLinkInput.value.trim();
  if(!url || url.indexOf('instagram.com') === -1){
    setMomentsStatus(momentsLinkStatus, 'Please paste a valid Instagram post/reel link.', 'error');
    return;
  }

  momentsLinkSubmitBtn.disabled = true;
  setMomentsStatus(momentsLinkStatus, 'Adding…');

  try{
    const res = await fetch(APP_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'submitMomentLink', instagramUrl: url })
    });
    if(!res.ok) throw new Error('Submit failed: ' + res.status);
    const data = await res.json();
    if(!data || data.status !== 'ok') throw new Error('Link not recorded');

    momentsLinkOverlay.classList.add('hidden');
    loadMoments();
    loadMomentsStat();
  }catch(err){
    console.warn('Moment link submit failed:', err);
    setMomentsStatus(momentsLinkStatus, "Couldn't add that right now — check your connection and try again.", 'error');
  }finally{
    momentsLinkSubmitBtn.disabled = false;
  }
});

// --- Helpers ported over from index.html (used by the code above) ---
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
let toastTimer;
function showToast(msg){
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2600);
}
const MY_IDENTITY_KEY = 'tkg_my_identity';
function getMyIdentity(){
  try{
    const raw = localStorage.getItem(MY_IDENTITY_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){
    return null;
  }
}
