<!DOCTYPE html>
<html lang="en">
<head>

<title>The Khichiya Gravy — Moments</title>
<meta name="theme-color" content="#000000">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">

<script>
(function(){
  try{
    var theme = localStorage.getItem('tkg_theme');
    document.documentElement.setAttribute('data-tkg-theme', theme === 'dark' ? 'dark' : 'light');
  }catch(e){
    document.documentElement.setAttribute('data-tkg-theme', 'light');
  }
})();
</script>

<script>
  if ('serviceWorker' in navigator) {
    let refreshing = false;

    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!refreshing) {
        refreshing = true;
        window.location.reload();
      }
    });

    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' })
        .then((reg) => {
          reg.update();
        })
        .catch((err) => {
          console.error('[SW] Registration failed:', err);
        });
    });
  }
</script>

<script src="./tkg-shared.js"></script>
<script>
// Step 1 cross-surface connection (2026-08-13): read the shared Journey
// context set on Menu (tkg_journey_context, via TKGShared.setJourneyContext)
// so this surface understands the visitor's active Journey. Read-only —
// this page never writes tkg_journey_context. logEvent() below already
// attaches this same state to the 'opened' entry automatically.
var tkgActiveJourney = window.TKGShared ? TKGShared.getJourneyContext() : null;
if (window.TKGShared) TKGShared.logEvent('moments', 'opened');

// Sprint B — 200m Proximity Nudge (2026-08-15). Silent no-op unless
// it's Fri/Sat/Sun, location permission is already granted, and the
// device is within 200m of TKG. Never auto-selects a Journey.
if (window.TKGShared) TKGShared.checkProximityNudge('Moments', function(){ openJourneyPrompt(); });
</script>

<style>
:root{
  /* PURE B&W PREMIUM AESTHETIC + GLASS SURFACES */
  --page-bg:     #FFFFFF;
  --page-border: #E0E0E0;
  --text-primary: #000000;
  --text-secondary: #666666;
  --text-tertiary: #999999;
  --card-bg: #000000;
  --card-text: #FFFFFF;
  --card-text-soft: rgba(255,255,255,0.8);
  --accent-bg: #1A1A1A;
  --accent-fg: #FFFFFF;
  --ctrl-bg: #000000;
  --ctrl-fg: #FFFFFF;
  --overlay-dark: rgba(0,0,0,0.5);
  --overlay-light: rgba(255,255,255,0.1);
  --border-crisp: rgba(0,0,0,0.12);
  --border-light: rgba(0,0,0,0.06);
  --radius-lg: 16px;
  --radius-md: 8px;
  --max-w: 430px;
  --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --glass-bg: rgba(20,20,20,0.65);
  --glass-border: rgba(255,255,255,0.18);
}

html[data-tkg-theme="dark"]{
  --page-bg:     #000000;
  --page-border: #2A2A2A;
  --text-primary: #FFFFFF;
  --text-secondary: #CCCCCC;
  --text-tertiary: #888888;
  --card-bg: #1A1A1A;
  --card-text: #FFFFFF;
  --card-text-soft: rgba(255,255,255,0.7);
  --accent-bg: #2A2A2A;
  --accent-fg: #FFFFFF;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100dvh;
  width: 100%;
  background: #000000;
  color: var(--text-primary);
  font-family: var(--font-body);
}
body {
  display: flex;
  justify-content: center;
  overflow: hidden;
}

.moments-app {
  width: 100%;
  max-width: var(--max-w);
  height: 100dvh;
  position: relative;
  background: var(--page-bg);
  overflow: hidden;
}

/* ===== APP HEADER BAR ===== */
.brand-header {
  position: absolute;
  top: 0; left: 0; right: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 12px;
  background: linear-gradient(to bottom, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.4) 70%, transparent 100%);
  z-index: 40;
  pointer-events: none;
}

.brand-header-text {
  pointer-events: auto;
  display: flex;
  align-items: center;
  gap: 8px;
}

.brand-header-badge {
  width: 28px;
  height: 28px;
  flex-shrink: 0;
  object-fit: contain;
}

.brand-header-title {
  color: #FFFFFF;
  font-size: 18px;
  font-weight: 800;
  letter-spacing: -0.3px;
}

.brand-header-subtitle {
  color: rgba(255,255,255,0.7);
  font-size: 11px;
  font-weight: 500;
}

.moments-content {
  height: 100%;
  overflow-y: scroll;
  scroll-behavior: smooth;
  scroll-snap-type: y mandatory;
  scrollbar-width: none;
}

.moments-content::-webkit-scrollbar {
  display: none;
}

/* One-time scroll cue (2026-08-17, repositioned 2026-08-17) — text-free
   upward swipe cue shown only on first-ever visit. bottom:80px clears
   the Global Nav pill (bottom:16px, 46px tall, z-index:99999 — the old
   bottom:28px position sat directly inside that zone). */
.moments-scroll-cue {
  position: fixed;
  left: 50%;
  bottom: 80px;
  transform: translateX(-50%);
  z-index: 60;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.4s ease;
}
.moments-scroll-cue.show {
  opacity: 1;
}
.moments-scroll-cue svg {
  display: block;
  width: 26px;
  height: 26px;
  color: rgba(255, 255, 255, 0.9);
  filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.6));
  animation: momentsSwipeUp 2.2s cubic-bezier(0.25, 1, 0.5, 1) infinite;
}
@keyframes momentsSwipeUp {
  0% { transform: translateY(12px); opacity: 0; }
  30% { opacity: 1; }
  70% { transform: translateY(-12px); opacity: 1; }
  100% { transform: translateY(-20px); opacity: 0; }
}

#momentsFeed {
  display: flex;
  flex-direction: column;
  padding-bottom: 110px;
}

/* ===== FULL-BLEED MEDIA CARD (video / photo) ===== */
.timeline-item.media-item {
  height: 100dvh;
  width: 100%;
  scroll-snap-align: start;
  scroll-snap-stop: always;
  position: relative;
  overflow: hidden;
  background: #000;
  /* iOS WebKit hardening: keep vertical swipe-to-scroll available to the
     browser even where a tap/double-tap gesture handler also lives on
     this element — horizontal gestures remain free for any future use. */
  touch-action: pan-y;
}

/* ===== COMPACT CARD (google review / instagram embed) ===== */
.timeline-item.compact-item {
  padding: 80px 16px 16px;
  margin-bottom: 16px;
  scroll-snap-align: start;
}

.timeline-item-media {
  width: 100%;
  height: 100%;
  position: relative;
  overflow: hidden;
  background: var(--card-bg);
}

.timeline-item-video-container,
.timeline-item-photo-container {
  width: 100%;
  height: 100%;
  position: relative;
  overflow: hidden;
  background: #000;
  touch-action: pan-y;
}

.timeline-item-video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  background: #000;
  cursor: pointer;
  display: block;
  touch-action: pan-y;
}

.media-bg-blur {
  position: absolute;
  inset: -24px;
  background-size: cover;
  background-position: center;
  filter: blur(28px) brightness(0.55) saturate(1.1);
  transform: scale(1.15);
  z-index: 0;
}

.timeline-item-image {
  position: relative;
  z-index: 1;
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

/* ===== INSTAGRAM BASIC EMBED CONTAINER ===== */
.instagram-embed-wrapper {
  background: var(--card-bg);
  border-radius: var(--radius-lg);
  padding: 12px;
  border: 1px solid var(--border-crisp);
  width: 100%;
  overflow: hidden;
}

.instagram-embed-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
  padding: 4px 6px;
}

.instagram-embed-meta {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.instagram-embed-meta .creator-name {
  color: var(--card-text);
  font-size: 14px;
  font-weight: 700;
}

.instagram-embed-date {
  color: var(--card-text-soft);
  font-size: 11px;
}

.instagram-iframe-container {
  width: 100%;
  border-radius: var(--radius-md);
  overflow: hidden;
  background: #000;
}

.instagram-iframe {
  width: 100%;
  height: 480px;
  border: none;
  border-radius: var(--radius-md);
  background: #000;
}

/* ===== INSTAGRAM-STYLE MULTI-MEDIA CAROUSEL ===== */
.timeline-item-carousel-container {
  width: 100%;
  height: 100%;
  position: relative;
  overflow: hidden;
  background: #000;
}

.carousel-track {
  display: flex;
  width: 100%;
  height: 100%;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}

.carousel-track::-webkit-scrollbar { display: none; }

.carousel-slide {
  flex: 0 0 100%;
  width: 100%;
  height: 100%;
  position: relative;
  scroll-snap-align: start;
  scroll-snap-stop: always;
  overflow: hidden;
  background: #000;
}

.carousel-slide .timeline-item-video,
.carousel-slide .timeline-item-image {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.carousel-counter {
  position: absolute;
  top: calc(env(safe-area-inset-top, 0px) + 66px);
  right: 14px;
  background: rgba(0,0,0,0.55);
  color: #fff;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.2px;
  padding: 4px 10px;
  border-radius: 999px;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  z-index: 16;
  pointer-events: none;
}

/* ===== CAPTION SCRIM + BESOINS OVERLAY FOLLOW BUTTON ===== */
.caption-scrim {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  padding: 60px 84px calc(110px + env(safe-area-inset-bottom, 0px)) 16px;
  background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.4) 50%, transparent 100%);
  z-index: 12;
  pointer-events: none;
}

.caption-meta-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 6px;
  pointer-events: auto;
}

.caption-uploader-name {
  color: #FFFFFF;
  font-size: 14px;
  font-weight: 700;
  text-shadow: 0 1px 3px rgba(0,0,0,0.6);
}

.follow-btn {
  padding: 4px 12px;
  border-radius: 999px;
  border: 1px solid rgba(255,255,255,0.8);
  color: #FFFFFF;
  font-size: 11px;
  font-weight: 700;
  text-decoration: none;
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  transition: background 0.2s ease, transform 0.2s ease;
}

.follow-btn:active {
  transform: scale(0.92);
  background: rgba(255,255,255,0.3);
}

.caption-scrim .timeline-item-caption {
  color: #fff;
  font-size: 14px;
  line-height: 1.4;
  margin-bottom: 4px;
  word-wrap: break-word;
  text-shadow: 0 1px 2px rgba(0,0,0,0.5);
  pointer-events: auto;
}

.caption-scrim .timeline-item-meta {
  color: rgba(255,255,255,0.75);
  font-size: 12px;
  letter-spacing: -0.1px;
  pointer-events: auto;
}

/* ===== RIGHT-SIDE ACTION STACK (CLEAN FLOATING ICONS) ===== */
.engagement-overlay {
  position: absolute;
  right: 14px;
  bottom: 210px;
  display: flex;
  flex-direction: column;
  gap: 18px;
  z-index: 20;
}

.video-controls-overlay {
  position: absolute;
  right: 14px;
  bottom: 154px;
  display: none;
  flex-direction: column;
  gap: 18px;
  z-index: 20;
  touch-action: pan-y;
}

.engagement-btn, .control-btn {
  position: relative;
  width: 44px; height: 44px;
  background: none;
  border: none;
  color: #FFFFFF;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.8));
  transition: transform 0.2s cubic-bezier(.34,1.56,.64,1);
}

.engagement-btn svg, .control-btn svg {
  width: 26px; height: 26px;
  fill: currentColor;
}

.engagement-btn:active, .control-btn:active {
  background: none;
  transform: scale(0.85);
}

.engagement-btn .icon-fill { display: none; }
.engagement-btn.liked .icon-outline { display: none; }
.engagement-btn.liked .icon-fill { display: block; }

.engagement-btn.liked {
  color: #FF1744;
  transform: scale(1.1);
}

.control-btn.muted { opacity: 0.75; }

/* ===== FLOATING ACTION BUTTON (Share / +) ===== */
.fab-share {
  pointer-events: auto;
  width: 40px; height: 40px;
  border-radius: 50%;
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  color: #fff;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  box-shadow: 0 4px 16px rgba(0,0,0,0.3);
  transition: transform 0.2s ease;
}

.fab-share svg { width: 20px; height: 20px; stroke: currentColor; fill: none; }
.fab-share:active { transform: scale(0.9); }

/* ===== COMPACT CARD: Google Review ===== */
.timeline-item-review {
  background: var(--card-bg);
  border-radius: var(--radius-lg);
  padding: 18px;
  border: 1px solid var(--border-crisp);
  border-left: 4px solid #FFFFFF;
}

.timeline-item-review-rating {
  display: flex;
  gap: 4px;
  margin-bottom: 8px;
  font-size: 16px;
}

.timeline-item-review-text {
  font-size: 13px;
  line-height: 1.5;
  color: var(--card-text-soft);
  margin-bottom: 8px;
  font-style: italic;
}

.timeline-item-review-author {
  font-size: 12px;
  color: var(--text-tertiary);
  font-weight: 500;
}

/* ============================================================
   TKG FLOATING GLASS PILL NAVIGATION (DIRECTIONAL TRANSITION)
   Standardized component — identical to moments_hub.html's verified
   version. Geometry is INVARIANT; .scrolled only ever changes
   opacity/scale, never width/height/border-radius.
   ============================================================ */
.tkg-global-nav {
  position: fixed !important;
  bottom: 16px !important;
  left: 50% !important;
  transform: translateX(-50%) !important;
  width: min(320px, calc(100vw - 32px)) !important;
  height: 46px !important;
  border-radius: 9999px !important;
  background: rgba(255, 255, 255, 0.65) !important;
  backdrop-filter: blur(16px) saturate(180%) !important;
  -webkit-backdrop-filter: blur(16px) saturate(180%) !important;
  border: 1px solid rgba(255, 255, 255, 0.4) !important;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1) !important;
  box-sizing: border-box !important;
  z-index: 99999 !important;
  opacity: 1 !important;
  transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1),
              opacity 0.25s ease,
              background-color 0.3s ease,
              width 0.45s cubic-bezier(0.4, 0, 0.2, 1),
              height 0.45s cubic-bezier(0.4, 0, 0.2, 1),
              border-radius 0.45s cubic-bezier(0.4, 0, 0.2, 1) !important;
}

/* Worm-curl collapse: instead of just shrinking width, the bar curls
   itself into a ring around the fixed TKG Hub badge. Hub never moves
   and never shrinks — Menu/Moments/Runner/Leaderboard curl in around
   it, same idea as an earthworm coiling up when touched. */
.tkg-global-nav.scrolled {
  transform: translateX(-50%) !important;
  width: 104px !important;
  height: 104px !important;
  border-radius: 9999px !important;
  opacity: 0.94 !important;
  background: rgba(255, 255, 255, 0.55) !important;
}

[data-tkg-theme="dark"] .tkg-global-nav,
.theme-dark .tkg-global-nav,
body.dark-mode .tkg-global-nav {
  background: rgba(18, 18, 18, 0.72) !important;
  border: 1px solid rgba(255, 255, 255, 0.12) !important;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35) !important;
}

[data-tkg-theme="dark"] .tkg-global-nav.scrolled,
.theme-dark .tkg-global-nav.scrolled,
body.dark-mode .tkg-global-nav.scrolled {
  background: rgba(18, 18, 18, 0.62) !important;
}

.tkg-nav-item {
  position: absolute !important;
  left: 50% !important;
  top: 50% !important;
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
  width: 40px !important;
  height: 32px !important;
  border-radius: 9999px !important;
  color: rgba(0, 0, 0, 0.55) !important;
  text-decoration: none !important;
  transition: background-color 0.2s ease, color 0.2s ease,
              width 0.3s cubic-bezier(0.4, 0, 0.2, 1),
              height 0.3s cubic-bezier(0.4, 0, 0.2, 1),
              transform 0.45s cubic-bezier(0.4, 0, 0.2, 1) !important;
  -webkit-tap-highlight-color: transparent;
}

/* Bar (expanded) positions — Menu, Moments, Hub, Runner, Leaderboard in
   that markup order. Hub (3rd item) sits dead-center. */
.tkg-nav-item:nth-child(1){ transform: translate(calc(-50% - 104px), -50%) !important; }
.tkg-nav-item:nth-child(2){ transform: translate(calc(-50% - 52px), -50%) !important; }
.tkg-nav-item:nth-child(3){ transform: translate(-50%, -50%) !important; }
.tkg-nav-item:nth-child(4){ transform: translate(calc(-50% + 52px), -50%) !important; }
.tkg-nav-item:nth-child(5){ transform: translate(calc(-50% + 104px), -50%) !important; }

/* Circle (collapsed/scrolled) positions — Hub keeps the exact same
   transform as the bar state (dead-center, never moves), the other 4
   curl into a ring around it. */
.tkg-global-nav.scrolled .tkg-nav-item:nth-child(1){ transform: translate(calc(-50% - 36px), -50%) !important; }
.tkg-global-nav.scrolled .tkg-nav-item:nth-child(2){ transform: translate(-50%, calc(-50% - 36px)) !important; }
.tkg-global-nav.scrolled .tkg-nav-item:nth-child(3){ transform: translate(-50%, -50%) !important; }
.tkg-global-nav.scrolled .tkg-nav-item:nth-child(4){ transform: translate(-50%, calc(-50% + 36px)) !important; }
.tkg-global-nav.scrolled .tkg-nav-item:nth-child(5){ transform: translate(calc(-50% + 36px), -50%) !important; }

.tkg-global-nav.scrolled .tkg-nav-item {
  width: 30px !important;
  height: 26px !important;
}

.tkg-nav-item svg {
  width: 18px !important;
  height: 18px !important;
  stroke-width: 2 !important;
  transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1), height 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important;
}

.tkg-global-nav.scrolled .tkg-nav-item svg {
  width: 14px !important;
  height: 14px !important;
}

.tkg-nav-item.active {
  color: #B8431D !important;
  background: rgba(250, 198, 70, 0.25) !important;
}

[data-tkg-theme="dark"] .tkg-nav-item,
.theme-dark .tkg-nav-item,
body.dark-mode .tkg-nav-item {
  color: rgba(255, 255, 255, 0.55) !important;
}

[data-tkg-theme="dark"] .tkg-nav-item.active,
.theme-dark .tkg-nav-item.active,
body.dark-mode .tkg-nav-item.active {
  color: #FAC646 !important;
  background: rgba(250, 198, 70, 0.22) !important;
}

/* TKG Hub badge — the real locked glass-badge artwork (tkg-hub-nav.png),
   deliberately bigger than the other 4 nav icons at all times (bar AND
   circle state) so it reads as the fixed anchor everything else curls
   around. Does not shrink when the nav collapses, unlike the others. */
.tkg-nav-hub {
  width: 52px !important;
  height: 44px !important;
}
.tkg-global-nav.scrolled .tkg-nav-hub {
  width: 52px !important;
  height: 44px !important;
}
.tkg-nav-hub .tkg-hub-badge-icon {
  width: 34px !important;
  height: 34px !important;
  object-fit: contain !important;
  filter: drop-shadow(0 0 4px rgba(250, 198, 70, 0.55));
}
.tkg-global-nav.scrolled .tkg-nav-hub .tkg-hub-badge-icon {
  width: 34px !important;
  height: 34px !important;
}

.tkg-moments-icon-stack {
  position: relative;
  width: 18px;
  height: 18px;
  transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1), height 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
.tkg-global-nav.scrolled .tkg-moments-icon-stack { width: 14px; height: 14px; }
.tkg-moments-icon-stack svg {
  position: absolute !important;
  inset: 0;
  width: 100% !important;
  height: 100% !important;
  stroke-width: 2 !important;
  transition: opacity 0.5s ease !important;
}
.tkg-icon-camera { opacity: 1; }
.tkg-icon-recorder { opacity: 0; }
.tkg-nav-moments.tkg-swap .tkg-icon-camera { opacity: 0; }
.tkg-nav-moments.tkg-swap .tkg-icon-recorder { opacity: 1; }

/* ===== UPLOAD / SHARE MODAL ===== */
.upload-modal {
  display: none;
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.6);
  z-index: 100;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 16px;
}

.upload-modal.open { display: flex; }

/* JOURNEY PROMPT choice buttons — cross-surface Journey correction
   (2026-08-13). Same page-local vars as the rest of the Share modal —
   no new visual system. */
.journey-prompt-choice {

<script>
const APP_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxyftcQEeDkU1sf2MJy4Zwj12C9J8z4UVWTY1-ny5HM9HhJ0azlkMt5Gvp-nJXDgtLnLA/exec';
const MAX_FILES = 10;
// Raw video ceiling (2026-08-16): Apps Script doPost doesn't publish an
// official hard payload limit — the widely-cited practical ceiling for
// the whole request body is ~50MB. Base64 encoding adds ~33% overhead,
// so 20MB raw becomes ~26.6MB encoded — solid headroom under that,
// while comfortably covering short smartphone video clips. Enforced
// again server-side in AppsScript.gs — this is a UX pre-check, not the
// only guard.
const MAX_FILE_SIZE = 20 * 1024 * 1024;
const COMPRESSION_QUALITY = 0.75;

const FEED = document.getElementById('momentsFeed');
const MOMENTS_CONTENT = document.getElementById('momentsContent');
// Deep-link target (2026-08-17): captured once at page load, applied at
// the end of every renderTimeline() pass — harmless if it re-applies
// across the cache-render + network-render that both happen on initial
// load, since scrolling to an element already in place is a no-op.
const DEEP_LINK_MOMENT_ID = new URLSearchParams(window.location.search).get('id');
const SHARE_BTN = document.getElementById('shareBtn');
const UPLOAD_MODAL = document.getElementById('uploadModal');
const UPLOAD_NAME = document.getElementById('uploadName');
const UPLOAD_MOBILE = document.getElementById('uploadMobile');
const UPLOAD_NAME_FIELD = document.getElementById('uploadNameField');
const UPLOAD_MOBILE_FIELD = document.getElementById('uploadMobileField');

const UPLOAD_PREVIEW = document.getElementById('uploadPreview');
const UPLOAD_SUBMIT = document.getElementById('uploadSubmitBtn');
const UPLOAD_CANCEL = document.getElementById('uploadCancelBtn');

const FILE_COUNTER = document.getElementById('fileCounter');
const UPLOAD_PROGRESS = document.getElementById('uploadProgress');
const UPLOAD_PROGRESS_BAR = document.getElementById('uploadProgressBar');
const UPLOAD_SUBTITLE = document.getElementById('uploadSubtitle');
const UPLOAD_TABS = document.getElementById('uploadTabs');
const UPLOAD_MEDIA_PANEL = document.getElementById('uploadMediaPanel');
const UPLOAD_LINK_PANEL = document.getElementById('uploadLinkPanel');
const SOCIAL_LINK_INPUT = document.getElementById('socialLinkInput');

let moments = [];
let selectedFiles = [];
let currentUploadTab = 'media';

// ========== GLOBAL MUTE STATE MANAGER ==========
const MUTE_STATE = {
  muted: localStorage.getItem('tkg_muted') === 'false' ? false : true,
  
  setMuted: function(isMuted) {
    this.muted = isMuted;
    localStorage.setItem('tkg_muted', String(isMuted));
    this.updateAllVideos();
  },
  
  toggle: function() {
    this.setMuted(!this.muted);
  },
  
  updateAllVideos: function() {
    const videos = document.querySelectorAll('.timeline-item-video');
    videos.forEach(video => {
      video.muted = this.muted;
    });
    
    const muteBtn = document.querySelector('.control-btn.mute-btn');
    if (muteBtn) {
      if (this.muted) {
        muteBtn.classList.add('muted');
        muteBtn.title = 'Unmute';
      } else {
        muteBtn.classList.remove('muted');
        muteBtn.title = 'Mute';
      }
    }
  }
};

let activeVideo = null;
const videoObservers = new Map();
const likedVideos = new Set(JSON.parse(localStorage.getItem('tkg_liked_videos') || '[]'));

// ========== INTERSECTION OBSERVER ==========
function setupVideoObserver(videoElement, container) {
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting && entry.intersectionRatio >= 0.75) {
        if (activeVideo && activeVideo !== videoElement) {
          activeVideo.pause();
        }
        activeVideo = videoElement;
        const playPromise = videoElement.play();
        if (playPromise !== undefined) {
          playPromise.catch(err => {
            console.warn("Autoplay blocked, retrying muted:", err);
            // iOS WebKit sometimes rejects autoplay even when the video is
            // already muted (e.g. after a permission-state change). Retry
            // once, forcing mute on THIS element only — never touches
            // MUTE_STATE, so the user's session mute/unmute choice is
            // untouched once they interact again.
            videoElement.muted = true;
            videoElement.play().catch(() => {});
          });
        }
        
        const overlay = container.querySelector('.video-controls-overlay');
        if (overlay) overlay.style.display = 'flex';
      } else {
        if (activeVideo === videoElement) {
          videoElement.pause();
          activeVideo = null;
        }
        
        const overlay = container.querySelector('.video-controls-overlay');
        if (overlay) overlay.style.display = 'none';
      }
    });
  }, { threshold: 0.75 });
  
  observer.observe(videoElement);
  videoObservers.set(videoElement, observer);
}

// ========== EXTERNAL EMBED LIFECYCLE (Instagram iframe) ==========
// 2026-08-17: instagram_embed cards previously had no lifecycle management
// at all — an off-screen embed kept its iframe.src live indefinitely,
// which can keep embedded audio/video playing in the background as the
// user scrolls past. Blanking the src when the card leaves view and
// restoring it on return stops that, without touching the embed markup
// itself. Generic to any future iframe-based embed type, not just
// Instagram — keyed off the iframe element, not the card type.
function setupEmbedObserver(iframeElement, container) {
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.intersectionRatio >= 0.65) {
        if (iframeElement.dataset.src) {
          iframeElement.src = iframeElement.dataset.src;
          delete iframeElement.dataset.src;
        }
      } else if (entry.intersectionRatio < 0.2) {
        if (iframeElement.src && iframeElement.src !== 'about:blank') {
          iframeElement.dataset.src = iframeElement.src;
          iframeElement.src = 'about:blank';
        }
      }
    });
  }, { threshold: [0.2, 0.65] });

  observer.observe(iframeElement);
  videoObservers.set(iframeElement, observer);
}

// ========== TAP TO PAUSE/PLAY ==========
function setupVideoTapHandler(videoElement) {
  videoElement.addEventListener('click', (e) => {
    e.stopPropagation();
    if (videoElement.paused) {
      const playPromise = videoElement.play();
      if (playPromise !== undefined) {
        playPromise.catch(err => {
          console.warn("Tap-to-play blocked, retrying muted:", err);
          videoElement.muted = true;
          videoElement.play().catch(() => {});
        });
      }
    } else {
      videoElement.pause();
    }
  });
}

// ========== DOUBLE-TAP LIKE GESTURE ==========
function setupDoubleTapLike(container, videoId) {
  let lastTap = 0;
  
  container.addEventListener('click', (e) => {
    const currentTime = new Date().getTime();
    const tapLength = currentTime - lastTap;
    
    if (tapLength < 500 && tapLength > 0) {
      e.preventDefault();
      toggleLike(videoId, container);
    }
    lastTap = currentTime;
  });
}

function toggleLike(videoId, container) {
  const likeBtn = container.querySelector('.like-btn');
  
  if (likedVideos.has(videoId)) {
    likedVideos.delete(videoId);
    likeBtn.classList.remove('liked');
  } else {
    likedVideos.add(videoId);
    likeBtn.classList.add('liked');
  }
  
  localStorage.setItem('tkg_liked_videos', JSON.stringify([...likedVideos]));
}

// ========== DEEP-LINK SHARE ==========
// 2026-08-17: replaces the "Share feature coming soon" stub on all three
// card types. moment.id is always present (see appendMomentPhoto_/
// appendMomentLink_ in AppsScript.gs — a stable 'mom-XXXXXXXX' id written
// at upload time), so no fallback chain is needed. Native share sheet
// first; clipboard + brief inline confirmation as the fallback for
// browsers without the Web Share API (mainly desktop Chrome).
async function shareTimelineMoment(item, btn) {
  const id = item.data && item.data.id;
  if (!id) return;

  const shareUrl = `${window.location.origin}${window.location.pathname}?id=${encodeURIComponent(id)}`;

  if (navigator.share) {
    try {
      await navigator.share({ title: 'TKG Moments', url: shareUrl });
      return;
    } catch (err) {
      if (err && err.name === 'AbortError') return; // user cancelled the share sheet
      // fall through to clipboard fallback below
    }
  }

  try {
    await navigator.clipboard.writeText(shareUrl);
    if (btn) {
      const original = btn.innerHTML;
      btn.innerHTML = ICON_SHARE_COPIED;
      setTimeout(() => { btn.innerHTML = original; }, 1500);
    }
  } catch (err) {
    console.warn('Clipboard share fallback failed:', err);
  }
}

// ========== CANVAS COMPRESSION ==========
async function compressImage(file) {
  return new Promise((resolve) => {
    if (!file.type.startsWith('image/')) {
      resolve(file);
      return;
    }
    
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const maxDim = 1200;
        let width = img.width;
        let height = img.height;
        
        if (width > height) {
          if (width > maxDim) {
            height = Math.round(height * (maxDim / width));
            width = maxDim;
          }
        } else {
          if (height > maxDim) {
            width = Math.round(width * (maxDim / height));
            height = maxDim;
          }
        }
        
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        
        canvas.toBlob(
          (blob) => {
            const compressedFile = new File([blob], file.name, {
              type: 'image/jpeg',
              lastModified: file.lastModified
            });
            resolve(compressedFile);
          },
          'image/jpeg',
          COMPRESSION_QUALITY
        );
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

// ========== BASE64 ENCODING ==========
function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// ========== EXTRACT INSTAGRAM SHORTCODE ==========
function getInstagramShortcode(url) {
  if (!url) return null;
  const match = url.match(/instagram\.com\/(?:p|reel|reels)\/([^/?#&]+)/i);
  return (match && match[1]) ? match[1] : null;
}

// ========== FETCH MOMENTS (Stale-While-Revalidate) ==========
// tkg_moments_feed_cache holds the last successfully fetched feed.
// loadMomentsFromCache() renders it instantly on page load, if present;
// fetchMoments() always still runs afterward to silently refresh against
// the live server and update the cache. This key is feed content only —
// entirely separate from tkg_customer/tkg_my_identity/tkg_session_trail.
const MOMENTS_CACHE_KEY = 'tkg_moments_feed_cache';

function loadMomentsFromCache() {
  try {
    const raw = localStorage.getItem(MOMENTS_CACHE_KEY);
    if (!raw) return false;
    const cached = JSON.parse(raw);
    if (!cached || !Array.isArray(cached.moments)) return false;
    moments = cached.moments;
    renderTimeline();
    return true;
  } catch (e) {
    return false;
  }
}

async function fetchMoments() {
  const hadCachedRender = moments.length > 0;
  try {
    const response = await fetch(APP_SCRIPT_URL + '?action=moments');
    if (!response.ok) throw new Error('Network error');
    
    const data = await response.json();
    if (data.status !== 'ok') throw new Error(data.message || 'API error');
    
    moments = data.moments || [];
    // Newest first — the Sheet appends new rows to the bottom, so the raw
    // API order is oldest-first. Reverse so the most recent post shows at
    // the top of the feed instead of requiring a scroll to find it.
    moments.reverse();
    renderTimeline();
    try {
      localStorage.setItem(MOMENTS_CACHE_KEY, JSON.stringify({ moments: moments, cachedAt: Date.now() }));
    } catch (e) {
      console.warn('Failed to write moments feed cache:', e);
    }
  } catch (err) {
    console.error('Failed to fetch moments:', err);
    // Only show the error state if we have nothing already on screen —
    // a cached render that's merely a bit stale is better than replacing
    // it with an error message just because this background refresh failed.
    if (!hadCachedRender) {
      FEED.innerHTML = '<div style="padding: 16px; text-align: center; color: var(--text-tertiary);">Failed to load moments. Please try again later.</div>';
    }
  }
}

// ========== RENDER TIMELINE ==========
function renderTimeline() {
  FEED.innerHTML = '';
  
  if (moments.length === 0) {
    FEED.innerHTML = '<div style="padding: 16px; text-align: center; color: var(--text-tertiary);">No moments shared yet</div>';
    return;
  }

  let timelineItems = [];

  moments.forEach((moment) => {
    const type = String(moment.type || '').toLowerCase();
    const instagramLink = moment.instagramUrl || moment['Instagram URL'] || moment.instagram_url || moment.socialUrl || moment['Social URL'] || moment.social_url;

    if (type === 'google_review' || type === 'review') {
      timelineItems.push({
        type: 'google_review',
        data: moment
      });
      return;
    }

    if (type === 'instagram' || type === 'social_link' || type === 'link' || instagramLink) {
      timelineItems.push({
        type: 'instagram_embed',
        data: {
          ...moment,
          instagramUrl: instagramLink
        }
      });
      return;
    }

    if (moment.media && Array.isArray(moment.media) && moment.media.length > 0) {
      if (moment.media.length > 1) {
        timelineItems.push({
          type: 'carousel',
          data: moment
        });
      } else {
        const item = moment.media[0];
        const mimeType = item.mimeType || 'image/jpeg';
        const isVideo = mimeType.indexOf('video/') === 0;

        timelineItems.push({
          type: isVideo ? 'video' : 'photo',
          data: {
            ...moment,
            media: item
          }
        });
      }
    }
  });

  timelineItems.forEach((item, idx) => {
    const card = createTimelineCard(item, `card-${idx}`);
    if (card) FEED.appendChild(card);
  });

  MUTE_STATE.updateAllVideos();

  // Deep-link scroll-to-target (2026-08-17). Falls back to normal
  // top-of-feed behavior silently if the id is missing or no longer
  // matches any loaded moment — never throws, never blocks rendering.
  if (DEEP_LINK_MOMENT_ID) {
    const target = FEED.querySelector(`[data-moment-id="${CSS.escape(DEEP_LINK_MOMENT_ID)}"]`);
    if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  injectMomentsScrollCue();
}

// ========== ONE-TIME SCROLL CUE ==========
// 2026-08-17: text-free, shown only on a visitor's very first-ever visit
// to Moments. Module-level flag (not just the localStorage check) so it
// never re-injects across the cache-render + network-render that both
// happen during initial load, or after a later renderTimeline() call
// following an upload.
let scrollCueInjected = false;
function injectMomentsScrollCue() {
  if (scrollCueInjected) return;
  if (localStorage.getItem('tkg_moments_scroll_cue_seen') === 'true') return;
  // Modal awareness (2026-08-17): on a genuinely first-time visit,
  // openJourneyPrompt() fires before renderTimeline() ever runs (see
  // boot sequence near the bottom of this file), so the cue would
  // otherwise inject underneath the still-open Journey modal. Skip for
  // now WITHOUT setting scrollCueInjected — closeJourneyPrompt() retries
  // this same call once the modal is dismissed.
  if (journeyPromptModal && journeyPromptModal.classList.contains('open')) return;
  const firstCard = FEED.querySelector('.timeline-item');
  if (!firstCard) return;

  scrollCueInjected = true;

  const cue = document.createElement('div');
  cue.className = 'moments-scroll-cue';
  cue.setAttribute('aria-hidden', 'true');
  cue.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>';
  document.body.appendChild(cue);
  requestAnimationFrame(() => cue.classList.add('show'));

  let dismissed = false;
  function dismiss() {
    if (dismissed) return;
    dismissed = true;
    try { localStorage.setItem('tkg_moments_scroll_cue_seen', 'true'); } catch (e) {}
    cue.classList.remove('show');
    setTimeout(() => { if (cue.parentNode) cue.parentNode.removeChild(cue); }, 400);
    MOMENTS_CONTENT.removeEventListener('touchstart', dismiss);
    MOMENTS_CONTENT.removeEventListener('wheel', dismiss);
  }

  // Deep-link safe dismissal (2026-08-17): a shared-link boot fires a
  // programmatic scrollIntoView(), which emits a native 'scroll' event
  // with no preceding touchstart/wheel — listening on 'scroll' would
  // have auto-dismissed the cue before the visitor ever saw it. Genuine
  // swiping always starts with one of these two instead.
  MOMENTS_CONTENT.addEventListener('touchstart', dismiss, { passive: true });
  MOMENTS_CONTENT.addEventListener('wheel', dismiss, { passive: true });
  setTimeout(dismiss, 9000); // ~4 full 2.2s swipe cycles
}

// ========== CREATE TIMELINE CARD ==========
function createTimelineCard(item, cardId) {
  const container = document.createElement('div');
  container.className = 'timeline-item';
  // Deep-link target (2026-08-17): stable id from the Sheet (always
  // present — see appendMomentPhoto_/appendMomentLink_ in AppsScript.gs),
  // used to scroll a shared link straight to this card on page load.
  if (item.data && item.data.id) container.dataset.momentId = item.data.id;

  if (item.type === 'video') {
    const { caption, uploaderName, date, time, media } = item.data;
    const dateDisplay = formatDate(date, time);

    const mediaContainer = document.createElement('div');
    mediaContainer.className = 'timeline-item-media timeline-item-video-container';

    const fileId = extractGoogleDriveId(media.url);
    const streamUrl = fileId ? `/api/stream?id=${fileId}` : media.url;

    const video = document.createElement('video');
    video.className = 'timeline-item-video';
    // iOS WebKit ordering fix (2026-08-17): attributes/properties must be
    // set BEFORE src is assigned — iOS WebKit can start evaluating the
    // media element for inline-vs-fullscreen playback as soon as src is
    // present, so setting playsinline/muted afterward can be too late.
    video.setAttribute('playsinline', '');
    video.setAttribute('webkit-playsinline', '');
    video.setAttribute('muted', '');
    video.playsInline = true;
    video.muted = MUTE_STATE.muted;
    video.preload = 'metadata';
    video.src = streamUrl; // assigned last, after all hardening above

    const controlsOverlay = document.createElement('div');
    controlsOverlay.className = 'video-controls-overlay';
    controlsOverlay.style.display = 'none';
    controlsOverlay.innerHTML = `
      <button class="control-btn mute-btn" title="${MUTE_STATE.muted ? 'Unmute' : 'Mute'}">
        ${MUTE_STATE.muted ? ICON_MUTED : ICON_UNMUTED}
      </button>
    `;

    const engagementOverlay = document.createElement('div');
    engagementOverlay.className = 'engagement-overlay';
    engagementOverlay.innerHTML = `
      <button class="engagement-btn like-btn ${likedVideos.has(cardId) ? 'liked' : ''}" title="Like">
        ${ICON_HEART_OUTLINE}${ICON_HEART_FILLED}
      </button>
      <button class="engagement-btn share-btn" title="Share">
        ${ICON_SHARE}
      </button>
    `;

    const captionWrap = document.createElement('div');
    captionWrap.innerHTML = buildCaptionScrimHtml(caption, uploaderName, dateDisplay);

    mediaContainer.appendChild(video);
    mediaContainer.appendChild(captionWrap.firstElementChild);
    mediaContainer.appendChild(controlsOverlay);
    mediaContainer.appendChild(engagementOverlay);

    setupVideoObserver(video, mediaContainer);
    setupVideoTapHandler(video);
    setupDoubleTapLike(mediaContainer, cardId);

    const muteBtn = controlsOverlay.querySelector('.mute-btn');
    muteBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      MUTE_STATE.toggle();
    });

    const likeBtn = engagementOverlay.querySelector('.like-btn');
    likeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleLike(cardId, mediaContainer);
    });

    const shareBtn = engagementOverlay.querySelector('.share-btn');
    shareBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      shareTimelineMoment(item, e.currentTarget);
    });

    container.classList.add('media-item');
    container.appendChild(mediaContainer);
    return container;
  }

  if (item.type === 'photo') {
    const { caption, uploaderName, date, time, media } = item.data;
    const dateDisplay = formatDate(date, time);

    const mediaContainer = document.createElement('div');
    mediaContainer.className = 'timeline-item-media timeline-item-photo-container';

    const transformedUrl = transformDriveImageUrl(media.url, 800);

    const bgBlur = document.createElement('div');
    bgBlur.className = 'media-bg-blur';
    bgBlur.style.backgroundImage = `url("${transformDriveImageUrl(media.url, 40)}")`;

    const img = document.createElement('img');
    img.className = 'timeline-item-image';
    img.src = transformedUrl;
    img.alt = caption || 'Photo';
    img.loading = 'lazy';
    img.addEventListener('error', function onImgError() {
      img.removeEventListener('error', onImgError);
      const fileId = extractGoogleDriveId(media.url);
      if (fileId) {
        const fallbackUrl = `https://drive.google.com/uc?export=view&id=${fileId}`;
        img.src = fallbackUrl;
        bgBlur.style.backgroundImage = `url("${fallbackUrl}")`;
      }
    });

    const captionWrap = document.createElement('div');
    captionWrap.innerHTML = buildCaptionScrimHtml(caption, uploaderName, dateDisplay);

    const engagementOverlay = document.createElement('div');
    engagementOverlay.className = 'engagement-overlay';
    engagementOverlay.innerHTML = `
      <button class="engagement-btn like-btn ${likedVideos.has(cardId) ? 'liked' : ''}" title="Like">
        ${ICON_HEART_OUTLINE}${ICON_HEART_FILLED}
      </button>
      <button class="engagement-btn share-btn" title="Share">
        ${ICON_SHARE}
      </button>
    `;

    mediaContainer.appendChild(bgBlur);
    mediaContainer.appendChild(img);
    mediaContainer.appendChild(captionWrap.firstElementChild);
    mediaContainer.appendChild(engagementOverlay);

    setupDoubleTapLike(mediaContainer, cardId);

    const likeBtn = engagementOverlay.querySelector('.like-btn');
    likeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleLike(cardId, mediaContainer);
    });

    const shareBtn = engagementOverlay.querySelector('.share-btn');
    shareBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      shareTimelineMoment(item, e.currentTarget);
    });

    container.classList.add('media-item');
    container.appendChild(mediaContainer);
    return container;
  }

  if (item.type === 'instagram_embed') {
    const { uploaderName, instagramUrl, date, time } = item.data;
    const dateDisplay = formatDate(date, time);
    const shortcode = getInstagramShortcode(instagramUrl);
    const embedSrc = shortcode ? `https://www.instagram.com/p/${shortcode}/embed` : 'about:blank';

    const embedCard = document.createElement('div');
    embedCard.className = 'instagram-embed-wrapper';
    embedCard.innerHTML = `
      <div class="instagram-embed-header">
        <div class="instagram-embed-meta">
          <div class="creator-name">${escapeHtml(uploaderName || 'Community Member')}</div>
          <div class="instagram-embed-date">${escapeHtml(dateDisplay)}</div>
        </div>
        <a class="follow-btn" href="https://www.instagram.com/the.khichiyagravy" target="_blank" rel="noopener">Follow</a>
      </div>
      <div class="instagram-iframe-container">
        <iframe class="instagram-iframe" src="${escapeHtml(embedSrc)}" frameborder="0" scrolling="no" allowtransparency="true"></iframe>
      </div>
    `;

    container.classList.add('compact-item');
    container.appendChild(embedCard);

    if (shortcode) {
      const iframeEl = embedCard.querySelector('.instagram-iframe');
      setupEmbedObserver(iframeEl, container);
    }

    return container;
  }

  if (item.type === 'carousel') {
    const { caption, uploaderName, date, time, media } = item.data;
    const dateDisplay = formatDate(date, time);
    const mediaList = media;

    const mediaContainer = document.createElement('div');
    mediaContainer.className = 'timeline-item-media timeline-item-carousel-container';

    const track = document.createElement('div');
    track.className = 'carousel-track';

    let hasVideo = false;

    mediaList.forEach((mediaItem) => {
      const mimeType = mediaItem.mimeType || 'image/jpeg';
      const isVideo = mimeType.indexOf('video/') === 0;
      const slide = document.createElement('div');
      slide.className = 'carousel-slide';

      if (isVideo) {
        hasVideo = true;
        const fileId = extractGoogleDriveId(mediaItem.url);
        const streamUrl = fileId ? `/api/stream?id=${fileId}` : mediaItem.url;

        const video = document.createElement('video');
        video.className = 'timeline-item-video';
        // iOS WebKit ordering fix — see matching comment above.
        video.setAttribute('playsinline', '');
        video.setAttribute('webkit-playsinline', '');
        video.setAttribute('muted', '');
        video.playsInline = true;
        video.muted = MUTE_STATE.muted;
        video.preload = 'metadata';
        video.src = streamUrl; // assigned last
        slide.appendChild(video);

        setupVideoObserver(video, mediaContainer);
        setupVideoTapHandler(video);
      } else {
        const transformedUrl = transformDriveImageUrl(mediaItem.url, 800);

        const bgBlur = document.createElement('div');
        bgBlur.className = 'media-bg-blur';
        bgBlur.style.backgroundImage = `url("${transformDriveImageUrl(mediaItem.url, 40)}")`;

        const img = document.createElement('img');
        img.className = 'timeline-item-image';
        img.src = transformedUrl;
        img.alt = caption || 'Photo';
        img.loading = 'lazy';
        img.addEventListener('error', function onImgError() {
          img.removeEventListener('error', onImgError);
          const fileId = extractGoogleDriveId(mediaItem.url);
          if (fileId) {
            const fallbackUrl = `https://drive.google.com/uc?export=view&id=${fileId}`;
            img.src = fallbackUrl;
            bgBlur.style.backgroundImage = `url("${fallbackUrl}")`;
          }
        });

        slide.appendChild(bgBlur);
        slide.appendChild(img);
      }

      track.appendChild(slide);
    });

    const counter = document.createElement('div');
    counter.className = 'carousel-counter';
    counter.textContent = `1/${mediaList.length}`;
    track.addEventListener('scroll', () => {
      const rawIndex = Math.round(track.scrollLeft / track.clientWidth);
      const clamped = Math.min(Math.max(rawIndex, 0), mediaList.length - 1);
      counter.textContent = `${clamped + 1}/${mediaList.length}`;
    }, { passive: true });

    const captionWrap = document.createElement('div');
    captionWrap.innerHTML = buildCaptionScrimHtml(caption, uploaderName, dateDisplay);

    const engagementOverlay = document.createElement('div');
    engagementOverlay.className = 'engagement-overlay';
    engagementOverlay.innerHTML = `
      <button class="engagement-btn like-btn ${likedVideos.has(cardId) ? 'liked' : ''}" title="Like">
        ${ICON_HEART_OUTLINE}${ICON_HEART_FILLED}
      </button>
      <button class="engagement-btn share-btn" title="Share">
        ${ICON_SHARE}
      </button>
    `;

    mediaContainer.appendChild(track);
    mediaContainer.appendChild(counter);
    mediaContainer.appendChild(captionWrap.firstElementChild);
    mediaContainer.appendChild(engagementOverlay);

    setupDoubleTapLike(mediaContainer, cardId);

    const likeBtn = engagementOverlay.querySelector('.like-btn');
    likeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleLike(cardId, mediaContainer);
    });

    const shareBtn = engagementOverlay.querySelector('.share-btn');
    shareBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      shareTimelineMoment(item, e.currentTarget);
    });

    if (hasVideo) {
      const controlsOverlay = document.createElement('div');
      controlsOverlay.className = 'video-controls-overlay';
      controlsOverlay.style.display = 'none';
      controlsOverlay.innerHTML = `
        <button class="control-btn mute-btn" title="${MUTE_STATE.muted ? 'Unmute' : 'Mute'}">
          ${MUTE_STATE.muted ? ICON_MUTED : ICON_UNMUTED}
        </button>
      `;
      mediaContainer.appendChild(controlsOverlay);

      const muteBtn = controlsOverlay.querySelector('.mute-btn');
      muteBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        MUTE_STATE.toggle();
      });
    }

    container.classList.add('media-item');
    container.appendChild(mediaContainer);
    return container;
  }

  if (item.type === 'google_review') {
    const { reviewer, rating, text } = item.data;
    const reviewCard = document.createElement('div');
    reviewCard.className = 'timeline-item-review';

    const stars = '★'.repeat(rating || 0) + '☆'.repeat(5 - (rating || 0));
    reviewCard.innerHTML = `
      <div class="timeline-item-review-rating">${stars}</div>
      <div class="timeline-item-review-text">"${escapeHtml(text)}"</div>
      <div class="timeline-item-review-author">— ${escapeHtml(reviewer)}</div>
    `;

    container.classList.add('compact-item');
    container.appendChild(reviewCard);
    return container;
  }

  return container;
}

// ========== FORMAT DATE ==========
function formatDate(date, time) {
  const dayNames = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  let dateObj;
  
  try {
    dateObj = new Date(date);
  } catch (e) {
    return 'Recently';
  }
  
  if (isNaN(dateObj)) return 'Recently';
  
  const day = dayNames[dateObj.getDay()];
  const timeStr = time ? String(time).slice(0, 5) : '';
  
  return timeStr ? `${day} ${timeStr}` : day;
}

// ========== EXTRACT GOOGLE DRIVE ID ==========
function extractGoogleDriveId(rawUrl) {
  if (!rawUrl) return null;
  
  let match = rawUrl.match(/\/file\/d\/([^\/]+)/);
  if (match && match[1]) return match[1];

  match = rawUrl.match(/id=([^&]+)/);
  if (match && match[1]) return match[1];

  match = rawUrl.match(/\/d\/([a-zA-Z0-9_-]+)/);
  if (match && match[1]) return match[1];

  return null;
}

// ========== TRANSFORM DRIVE URL FOR <img> TAGS ==========
// width param appended as Google's own '=w{n}' size suffix — lh3.googleusercontent.com
// serves a resized/compressed variant server-side instead of the original
// upload. Defaults to 800 (feed display size); callers needing a smaller
// variant (e.g. the blurred background layer) pass a lower value.
function transformDriveImageUrl(rawUrl, width){
  if (!rawUrl) return rawUrl;
  const fileId = extractGoogleDriveId(rawUrl);
  if (!fileId) return rawUrl;
  const w = width || 800;
  return `https://lh3.googleusercontent.com/d/${fileId}=w${w}`;
}

    UPLOAD_MOBILE.value = savedIdentity.mobile;
    UPLOAD_NAME_FIELD.style.display = 'none';
    UPLOAD_MOBILE_FIELD.style.display = 'none';
    UPLOAD_KNOWN_IDENTITY_LINE.textContent = 'Posting as ' + savedIdentity.name.split(' ')[0];
    UPLOAD_KNOWN_IDENTITY_LINE.style.display = '';
  } else {
    UPLOAD_NAME.value = '';
    UPLOAD_MOBILE.value = '';
    UPLOAD_NAME_FIELD.style.display = '';
    UPLOAD_MOBILE_FIELD.style.display = '';
    UPLOAD_KNOWN_IDENTITY_LINE.style.display = 'none';
  }
  UPLOAD_MODAL.classList.add('open');
  if (knownIdentity) {
    UPLOAD_CAPTION.focus();
  } else {
    UPLOAD_NAME.focus();
  }
});

UPLOAD_CANCEL.addEventListener('click', () => {
  closeUploadModal();
});

UPLOAD_TABS.querySelectorAll('.upload-modal-tab').forEach((tabBtn) => {
  tabBtn.addEventListener('click', () => {
    currentUploadTab = tabBtn.dataset.tab;

    UPLOAD_TABS.querySelectorAll('.upload-modal-tab').forEach((btn) => {
      btn.classList.toggle('active', btn === tabBtn);
    });

    if (currentUploadTab === 'link') {
      UPLOAD_MEDIA_PANEL.style.display = 'none';
      UPLOAD_LINK_PANEL.style.display = '';
      UPLOAD_SUBTITLE.textContent = 'Share an Instagram Reel or post link';
    } else {
      UPLOAD_MEDIA_PANEL.style.display = '';
      UPLOAD_LINK_PANEL.style.display = 'none';
      UPLOAD_SUBTITLE.textContent = 'Upload up to 10 photos or videos';
    }
  });
});

UPLOAD_FILE.addEventListener('change', (e) => {
  selectedFiles = Array.from(e.target.files || []);
  
  if (selectedFiles.length > MAX_FILES) {
    alert(`Maximum ${MAX_FILES} files allowed. ${selectedFiles.length} selected.`);
    selectedFiles = selectedFiles.slice(0, MAX_FILES);
    e.target.value = '';
  }
  
  updateFilePreview();
});

function updateFilePreview() {
  FILE_LIST.innerHTML = '';
  FILE_COUNTER.textContent = `${selectedFiles.length}/${MAX_FILES} files selected`;
  
  if (selectedFiles.length === MAX_FILES) {
    FILE_COUNTER.classList.add('warning');
    FILE_COUNTER.textContent += ' (max reached)';
  } else {
    FILE_COUNTER.classList.remove('warning');
  }
  
  selectedFiles.forEach((file, idx) => {
    const chip = document.createElement('div');
    chip.className = 'file-chip';
    chip.innerHTML = `
      ${file.name.substring(0, 20)}
      <span class="file-chip-remove" data-idx="${idx}">×</span>
    `;
    chip.querySelector('.file-chip-remove').addEventListener('click', () => {
      selectedFiles.splice(idx, 1);
      updateFilePreview();
    });
    FILE_LIST.appendChild(chip);
  });
  
  if (selectedFiles.length > 0) {
    const file = selectedFiles[0];
    if (file.type.startsWith('image/')) {
      const reader = new FileReader();
      reader.onload = (e) => {
        UPLOAD_PREVIEW.src = e.target.result;
        UPLOAD_PREVIEW.classList.add('show');
      };
      reader.readAsDataURL(file);
    } else {
      UPLOAD_PREVIEW.classList.remove('show');
    }
  }
}

UPLOAD_SUBMIT.addEventListener('click', async () => {
  if (currentUploadTab === 'link') {
    await handleSocialLinkSubmit();
  } else {
    await handleMediaUpload();
  }
});

async function handleMediaUpload() {
  const name = UPLOAD_NAME.value.trim();
  const mobile = UPLOAD_MOBILE.value.trim();
  const caption = UPLOAD_CAPTION.value.trim();

  const identityResult = window.TKGShared.setCustomerIdentity(name, mobile);
  if (!identityResult.success) {
    alert(identityResult.error.message);
    return;
  }

  if (selectedFiles.length === 0) {
    alert('Please select at least one file');
    return;
  }

  UPLOAD_SUBMIT.disabled = true;
  UPLOAD_PROGRESS.classList.add('show');
  UPLOAD_PROGRESS_BAR.style.width = '0%';
  let uploadedCount = 0;

  try {
    const uploadedMediaArray = [];

    for (const file of selectedFiles) {
      if (file.size > MAX_FILE_SIZE && !file.type.startsWith('image/')) {
        throw new Error(`"${file.name}" is larger than ${Math.round(MAX_FILE_SIZE / (1024 * 1024))}MB.`);
      }

      const compressed = await compressImage(file);
      const base64 = await fileToBase64(compressed);

      const filePayload = {
        action: 'uploadMomentFile',
        base64Data: base64,
        mimeType: compressed.type
      };

      const fileResponse = await fetch(APP_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(filePayload)
      });

      if (!fileResponse.ok) {
        throw new Error(`Server error uploading file: ${fileResponse.statusText}`);
      }

      const fileResult = await fileResponse.json();
      if (fileResult.status !== 'ok' || !fileResult.url) {
        throw new Error(fileResult.message || 'Could not upload file to Google Drive');
      }

      uploadedMediaArray.push({
        url: fileResult.url,
        thumbnailUrl: fileResult.thumbnailUrl,
        mimeType: fileResult.mimeType
      });

      uploadedCount++;
      UPLOAD_PROGRESS_BAR.style.width = Math.round((uploadedCount / selectedFiles.length) * 80) + '%';
    }

    const sheetResult = await window.TKGShared.submitToAppsScript('uploadMoment', {
      uploaderName: name,
      caption: caption,
      media: uploadedMediaArray
    });

    if (!sheetResult.success) {
      throw new Error(sheetResult.error.message || 'Failed to save moment to Google Sheet');
    }

    UPLOAD_PROGRESS_BAR.style.width = '100%';
    closeUploadModal();
    fetchMoments();
  } catch (err) {
    console.error('Upload error:', err);
    alert(`Upload failed: ${err.message}`);
  } finally {
    UPLOAD_SUBMIT.disabled = false;
    UPLOAD_PROGRESS.classList.remove('show');
    UPLOAD_PROGRESS_BAR.style.width = '0%';
  }
}

async function handleSocialLinkSubmit() {
  const name = UPLOAD_NAME.value.trim();
  const mobile = UPLOAD_MOBILE.value.trim();
  const link = SOCIAL_LINK_INPUT.value.trim();

  const identityResult = window.TKGShared.setCustomerIdentity(name, mobile);
  if (!identityResult.success) {
    alert(identityResult.error.message);
    return;
  }

  if (!link) {
    alert('Please paste an Instagram link');
    return;
  }

  const validDomains = ['instagram.com'];
  const isRecognized = validDomains.some((domain) => link.includes(domain));
  if (!isRecognized) {
    const proceed = confirm('This doesn\'t look like an Instagram link. Share it anyway?');
    if (!proceed) return;
  }

  if (link.includes('/stories/')) {
    alert('Instagram Stories expire after 24 hours and cannot be embedded. Please upload your video/photo directly under \'Upload Media\', or share a permanent Reel/Post link.');
    UPLOAD_SUBMIT.disabled = false;
    return;
  }

  UPLOAD_SUBMIT.disabled = true;

  try {
    const result = await window.TKGShared.submitToAppsScript('submitMomentLink', {
      instagramUrl: link
    });

    if (!result.success) {
      throw new Error(result.error.message || 'Submission failed');
    }

    closeUploadModal();
    fetchMoments();
  } catch (err) {
    console.error('Social link submission error:', err);
    alert('Submission failed: ' + err.message);
  } finally {
    UPLOAD_SUBMIT.disabled = false;
  }
}

function closeUploadModal() {
  UPLOAD_MODAL.classList.remove('open');
  UPLOAD_NAME.value = '';
  UPLOAD_MOBILE.value = '';
  UPLOAD_CAPTION.value = '';
  UPLOAD_FILE.value = '';
  UPLOAD_PREVIEW.classList.remove('show');
  FILE_LIST.innerHTML = '';
  FILE_COUNTER.textContent = '';
  selectedFiles = [];

  SOCIAL_LINK_INPUT.value = '';
  currentUploadTab = 'media';
  UPLOAD_TABS.querySelectorAll('.upload-modal-tab').forEach((btn) => {
    btn.classList.toggle('active', btn.dataset.tab === 'media');
  });
  UPLOAD_MEDIA_PANEL.style.display = '';
  UPLOAD_LINK_PANEL.style.display = 'none';
  UPLOAD_SUBTITLE.textContent = 'Upload up to 10 photos or videos';
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && UPLOAD_MODAL.classList.contains('open')) {
    closeUploadModal();
  }
});

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// tkg-global-nav keeps its capsule geometry invariant at all times — this
// listener only toggles opacity/scale via .scrolled, never width/height/
// border-radius. Direction-based, same pattern verified on moments_hub.html.
// Attached to #momentsContent (not window) because that's the actual
// scrolling element on this page — html/body don't scroll here,
// .moments-content is the overflow-y:scroll container.
(function initDirectionalPillScroll() {
  const nav = document.getElementById('globalNav');
  const scrollEl = document.getElementById('momentsContent');
  if (!nav || !scrollEl) return;

  let lastScrollTop = scrollEl.scrollTop;
  const DELTA_THRESHOLD = 6;
  const TOP_ZONE = 4;

  function compact() { nav.classList.add('scrolled'); }
  function normal() { nav.classList.remove('scrolled'); }

  scrollEl.addEventListener('scroll', () => {
    const current = scrollEl.scrollTop;
    const delta = current - lastScrollTop;

    if (current <= TOP_ZONE) {
      normal();
    } else if (Math.abs(delta) > DELTA_THRESHOLD) {
      if (delta > 0) compact();
      else normal();
    }
    lastScrollTop = current;
  }, { passive: true });
})();

// Moments nav icon — camera/recorder identity crossfade, ~10s on load then
// freezes on whichever icon is showing. One-shot per page load, not
// continuous. Sprint: Global Nav icon language, 2026-08-13.
(function animateMomentsNavIcon(){
  const el = document.querySelector('.tkg-nav-moments');
  if(!el) return;
  let toggles = 0;
  const MAX_TOGGLES = 4;
  const iv = setInterval(() => {
    el.classList.toggle('tkg-swap');
    toggles++;
    if(toggles >= MAX_TOGGLES) clearInterval(iv);
  }, 2500);
})();

// ========== JOURNEY PROMPT — cross-surface Journey correction (2026-08-13) ==========
// Shown only when this surface has no valid Journey context yet. Uses the
// existing TKGShared.setJourneyContext()/getJourneyContext() — no new
// storage key. Global Nav is hidden only for this first-run case and
// restored the instant a choice is made; never blocks normal navigation
// once a Journey exists.
const journeyPromptModal = document.getElementById('journeyPromptModal');
const momentsGlobalNav = document.getElementById('globalNav');

function openJourneyPrompt(){
  if(momentsGlobalNav) momentsGlobalNav.style.display = 'none';
  journeyPromptModal.classList.add('open');
}

function closeJourneyPrompt(){
  journeyPromptModal.classList.remove('open');
  if(momentsGlobalNav) momentsGlobalNav.style.display = '';
  // Scroll cue was deferred if it tried to inject while this modal was
  // still open (2026-08-17) — retry now; injectMomentsScrollCue() is
  // fully idempotent/guarded, so this is a harmless no-op if the cue
  // already showed, was already dismissed, or isn't eligible.
  injectMomentsScrollCue();
}

document.querySelectorAll('.journey-prompt-choice').forEach(btn => {
  btn.addEventListener('click', () => {
    const choice = btn.dataset.journeyChoice;
    if(window.TKGShared) TKGShared.setJourneyContext(choice);
    if(window.TKGShared) TKGShared.setJourneyOriginIfUnset('Moments'); // write-once — first surface a Journey was picked on
    if(window.TKGShared) TKGShared.recordJourneyEvent(choice, 'Moments'); // same Journey Analytics + location flow Menu uses
    tkgActiveJourney = window.TKGShared ? TKGShared.getJourneyContext() : null;
    closeJourneyPrompt();
  });
});

if(!tkgActiveJourney) openJourneyPrompt();

loadMomentsFromCache();
fetchMoments();
</script>
