<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>TKG Moments</title>
<meta name="theme-color" content="#0B0B0C">
<meta name="apple-mobile-web-app-capable" content="yes">

<script>
(function(){
  try{
    var theme = localStorage.getItem('tkg_theme');
    document.documentElement.setAttribute('data-tkg-theme', theme === 'dark' ? 'dark' : 'light');
  }catch(e){
    document.documentElement.setAttribute('data-tkg-theme', 'light');
  }
})();
</script>

<style>
:root{
  --charcoal:       #160F0C;
  --charcoal-soft:  #221813;
  --marble:         #FAF7F2;
  --stone-base:      #F6F6F5;
  --tkg-page-bg:     #FFFFFF;
  --tkg-plain-border: #E6E3DD;
  --tkg-plain-opaque-bg: #1A1815;
  --tkg-plain-opaque-fg: #FFFFFF;
  --tkg-marble-bg-color: #0F0E0C;
  --tkg-marble-image: url('tkg-marble-black.jpg');
  --tkg-marble-overlay: rgba(0,0,0,0.42);
  --tkg-marble-border: rgba(0,0,0,0.06);
  --tkg-marble-ink: #F2EFEA;
  --tkg-marble-ink-soft: rgba(242,239,234,0.72);
  --tkg-marble-ink-faint: rgba(242,239,234,0.55);
  --tkg-ctrl-bg: #1A1815;
  --tkg-ctrl-fg: #FFFFFF;
  --stone-line:      rgba(255,255,255,0.65);
  --ink:             #1C1815;
  --ink-soft:        #6B6256;
  --ink-faint:       #9C9286;
  --ember:          #E85D2C;
  --ember-bright:   #FF7A45;
  --ember-deep:     #B8431D;
  --radius-lg: 18px;
  --radius-md: 12px;
  --max-w: 430px;
  --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
}

html[data-tkg-theme="dark"]{
  --tkg-page-bg:     #0B0B0C;
  --tkg-plain-border: #2A2420;
  --tkg-plain-opaque-bg: #FAF7F2;
  --tkg-plain-opaque-fg: #160F0C;
  --tkg-marble-bg-color: #FAF7F2;
  --tkg-marble-overlay: rgba(255,255,255,0.06);
  --tkg-marble-border: rgba(255,255,255,0.12);
  --tkg-marble-ink: #160F0C;
  --tkg-marble-ink-soft: rgba(22,15,12,0.64);
  --tkg-marble-ink-faint: rgba(22,15,12,0.48);
  --tkg-ctrl-bg: #FAF7F2;
  --tkg-ctrl-fg: #160F0C;
  --ink:             #F2EFEA;
  --ink-soft:        #A89878;
  --ink-faint:       #6B6256;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { 
  height: 100dvh; 
  width: 100%; 
  background: var(--tkg-page-bg); 
  color: var(--ink); 
  font-family: var(--font-body);
}
body { 
  display: flex; 
  justify-content: center;
  overflow: hidden;
}

.moments-app {
  width: 100%;
  max-width: var(--max-w);
  display: flex;
  flex-direction: column;
  height: 100dvh;
  position: relative;
}

.moments-header {
  background: var(--tkg-page-bg);
  border-bottom: 0.5px solid var(--tkg-plain-border);
  padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 12px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}

.moments-header h1 {
  font-size: 20px;
  font-weight: 600;
  letter-spacing: -0.25px;
  flex: 1;
}

.moments-header-btn {
  background: none;
  border: none;
  padding: 8px;
  cursor: pointer;
  font-size: 20px;
  color: var(--ink);
}

.moments-content {
  flex: 1;
  overflow-y: scroll;
  scroll-behavior: smooth;
  scrollbar-width: none;
}

.moments-content::-webkit-scrollbar {
  display: none;
}

#momentsFeed {
  display: flex;
  flex-direction: column;
  gap: 24px;
  padding: 16px;
  scroll-snap-type: y mandatory;
}

.timeline-item {
  display: flex;
  flex-direction: column;
  gap: 8px;
  scroll-snap-align: start;
}

.timeline-item-media {
  width: 100%;
  height: auto;
  border-radius: var(--radius-md);
  overflow: hidden;
  background: #000;
  display: block;
}

.timeline-item-image {
  width: 100%;
  height: auto;
  display: block;
}

.timeline-item-video-container {
  position: relative;
  width: 100%;
  background: #000;
  display: flex;
  align-items: center;
  justify-content: center;
  aspect-ratio: 9 / 16;
  overflow: hidden;
}

.timeline-item-video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  background: #000;
  cursor: pointer;
}

/* Video controls overlay */
.video-controls-overlay {
  position: absolute;
  bottom: 16px;
  left: 16px;
  display: flex;
  gap: 12px;
  z-index: 10;
  opacity: 0.9;
  transition: opacity 0.3s ease;
}

.video-controls-overlay:hover {
  opacity: 1;
}

.control-btn {
  background: rgba(255, 255, 255, 0.2);
  border: 1px solid rgba(255, 255, 255, 0.4);
  border-radius: 50%;
  width: 48px;
  height: 48px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: white;
  transition: all 0.2s ease;
  backdrop-filter: blur(4px);
  padding: 0;
  font-size: 0;
}

.control-btn:active {
  background: rgba(255, 255, 255, 0.4);
  transform: scale(0.95);
}

.control-btn svg {
  width: 24px;
  height: 24px;
  fill: currentColor;
}

/* Mute button state */
.control-btn.muted {
  opacity: 0.6;
}

.timeline-item-info {
  padding: 0 4px;
}

.timeline-item-caption {
  font-size: 14px;
  line-height: 1.4;
  color: var(--ink);
  margin-bottom: 4px;
  word-wrap: break-word;
}

.timeline-item-meta {
  font-size: 12px;
  color: var(--ink-soft);
  letter-spacing: -0.2px;
}

.timeline-item-review {
  background: linear-gradient(135deg, var(--tkg-marble-bg-color), var(--charcoal-soft));
  border-radius: var(--radius-md);
  padding: 16px;
  border-left: 4px solid var(--ember);
}

.timeline-item-review-rating {
  display: flex;
  gap: 4px;
  margin-bottom: 8px;
  font-size: 16px;
}

.timeline-item-review-text {
  font-size: 13px;
  line-height: 1.5;
  color: var(--tkg-marble-ink-soft);
  margin-bottom: 8px;
  font-style: italic;
}

.timeline-item-review-author {
  font-size: 12px;
  color: var(--tkg-marble-ink-faint);
  font-weight: 500;
}

.moments-nav {
  background: var(--tkg-page-bg);
  border-top: 0.5px solid var(--tkg-plain-border);
  display: flex;
  justify-content: space-around;
  padding: env(safe-area-inset-bottom, 0px) 0 0 0;
  flex-shrink: 0;
}

.moments-nav-btn {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 12px 8px;
  background: none;
  border: none;
  color: var(--ink-faint);
  cursor: pointer;
  text-decoration: none;
  font-size: 10px;
  transition: color 0.2s ease;
  gap: 4px;
}

.moments-nav-btn:active {
  opacity: 0.7;
}

.moments-nav-btn.active {
  color: var(--ink);
}

.moments-nav-btn svg {
  width: 20px;
  height: 20px;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.5;
}

.moments-nav-btn.active svg {
  stroke: var(--ember);
}

.moments-nav-btn.instagram-btn {
  color: #E1306C;
}

.moments-nav-btn.instagram-btn svg {
  stroke: #E1306C;
}

/* Upload Modal */
.upload-modal {
  display: none;
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 100;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 16px;
}

.upload-modal.open {
  display: flex;
}

.upload-modal-content {
  background: var(--tkg-page-bg);
  border-radius: var(--radius-lg);
  padding: 24px;
  width: 100%;
  max-width: 360px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}

.upload-modal-title {
  font-size: 18px;
  font-weight: 600;
  margin-bottom: 16px;
  text-align: center;
}

.upload-modal-field {
  margin-bottom: 16px;
}

.upload-modal-label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--ink-soft);
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.upload-modal-input {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--tkg-plain-border);
  border-radius: 8px;
  background: var(--tkg-page-bg);
  color: var(--ink);
  font-family: inherit;
  font-size: 14px;
  transition: border-color 0.2s ease;
}

.upload-modal-input:focus {
  outline: none;
  border-color: var(--ember);
}

.upload-modal-file {
  display: none;
}

.upload-modal-file-btn {
  display: block;
  width: 100%;
  padding: 12px;
  border: 2px dashed var(--tkg-plain-border);
  border-radius: 8px;
  background: transparent;
  color: var(--ink-soft);
  cursor: pointer;
  font-size: 14px;
  text-align: center;
  transition: border-color 0.2s ease;
  font-weight: 500;
}

.upload-modal-file-btn:active {
  border-color: var(--ember);
  color: var(--ember);
}

#uploadPreview {
  width: 100%;
  max-height: 200px;
  object-fit: cover;
  border-radius: 8px;
  margin: 12px 0;
  display: none;
}

#uploadPreview.show {
  display: block;
}

.upload-modal-actions {
  display: flex;
  gap: 12px;
  margin-top: 20px;
}

.upload-modal-btn {
  flex: 1;
  padding: 12px;
  border: none;
  border-radius: 8px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
  font-size: 14px;
}

.upload-modal-btn.submit {
  background: var(--ember);
  color: white;
}

.upload-modal-btn.submit:active {
  background: var(--ember-deep);
  transform: scale(0.98);
}

.upload-modal-btn.cancel {
  background: var(--tkg-plain-border);
  color: var(--ink);
}

.upload-modal-btn.cancel:active {
  opacity: 0.7;
}

#shareBtn {
  position: absolute;
  top: 12px;
  right: 16px;
  background: var(--ember);
  color: white;
  border: none;
  border-radius: 20px;
  padding: 8px 16px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  z-index: 10;
}

#shareBtn:active {
  background: var(--ember-deep);
}
</style>
</head>
<body>

<script>
const APP_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxyftcQEeDkU1sf2MJy4Zwj12C9J8z4UVWTY1-ny5HM9HhJ0azlkMt5Gvp-nJXDgtLnLA/exec';

const FEED = document.getElementById('momentsFeed');
const SHARE_BTN = document.getElementById('shareBtn');
const UPLOAD_MODAL = document.getElementById('uploadModal');
const UPLOAD_NAME = document.getElementById('uploadName');
const UPLOAD_FILE = document.getElementById('uploadFile');
const UPLOAD_CAPTION = document.getElementById('uploadCaption');
const UPLOAD_PREVIEW = document.getElementById('uploadPreview');
const UPLOAD_SUBMIT = document.getElementById('uploadSubmitBtn');
const UPLOAD_CANCEL = document.getElementById('uploadCancelBtn');

let moments = [];
let selectedFiles = [];

// ========== GLOBAL MUTE STATE MANAGER ==========
const MUTE_STATE = {
  muted: localStorage.getItem('tkg_muted') === 'false' ? false : true,
  
  setMuted: function(isMuted) {
    this.muted = isMuted;
    localStorage.setItem('tkg_muted', String(isMuted));
    this.updateAllVideos();
  },
  
  toggle: function() {
    this.setMuted(!this.muted);
  },
  
  updateAllVideos: function() {
    const videos = document.querySelectorAll('.timeline-item-video');
    videos.forEach(video => {
      video.muted = this.muted;
    });
    
    // Update mute button UI on active video
    const muteBtn = document.querySelector('.control-btn.mute-btn');
    if (muteBtn) {
      if (this.muted) {
        muteBtn.classList.add('muted');
        muteBtn.title = 'Unmute';
      } else {
        muteBtn.classList.remove('muted');
        muteBtn.title = 'Mute';
      }
    }
  }
};

// Global active video tracker
let activeVideo = null;
const videoObservers = new Map();

// ========== INTERSECTION OBSERVER ==========
function setupVideoObserver(videoElement, container) {
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting && entry.intersectionRatio >= 0.75) {
        // Video is >75% visible
        if (activeVideo && activeVideo !== videoElement) {
          activeVideo.pause();
        }
        activeVideo = videoElement;
        videoElement.play().catch(err => {
          console.warn("Autoplay blocked:", err);
        });
        
        // Show controls overlay
        const overlay = container.querySelector('.video-controls-overlay');
        if (overlay) overlay.style.display = 'flex';
      } else {
        // Video is <75% visible
        if (activeVideo === videoElement) {
          videoElement.pause();
          activeVideo = null;
        }
        
        // Hide controls overlay
        const overlay = container.querySelector('.video-controls-overlay');
        if (overlay) overlay.style.display = 'none';
      }
    });
  }, { threshold: 0.75 });
  
  observer.observe(videoElement);
  videoObservers.set(videoElement, observer);
}

// ========== TAP TO PAUSE/PLAY ==========
function setupVideoTapHandler(videoElement) {
  videoElement.addEventListener('click', (e) => {
    e.stopPropagation();
    if (videoElement.paused) {
      videoElement.play();
    } else {
      videoElement.pause();
    }
  });
}

// ========== FETCH MOMENTS ==========
async function fetchMoments() {
  try {
    const response = await fetch(APP_SCRIPT_URL + '?action=moments');
    if (!response.ok) throw new Error('Network error');
    
    const data = await response.json();
    if (data.status !== 'ok') throw new Error(data.message || 'API error');
    
    moments = data.moments || [];
    renderTimeline();
  } catch (err) {
    console.error('Failed to fetch moments:', err);
    FEED.innerHTML = '<div style="padding: 16px; text-align: center; color: var(--ink-soft);">Failed to load moments. Please try again later.</div>';
  }
}

// ========== RENDER TIMELINE ==========
function renderTimeline() {
  FEED.innerHTML = '';
  
  if (moments.length === 0) {
    FEED.innerHTML = '<div style="padding: 16px; text-align: center; color: var(--ink-soft);">No moments shared yet</div>';
    return;
  }

  let timelineItems = [];

  moments.forEach((moment) => {
    const type = String(moment.type || 'customer_photo').toLowerCase();
    
    if (type === 'google_review' || type === 'review') {
      timelineItems.push({
        type: 'google_review',
        data: moment
      });
      return;
    }

    if (moment.media && Array.isArray(moment.media)) {
      moment.media.forEach((item) => {
        const mimeType = item.mimeType || 'image/jpeg';
        const isVideo = mimeType.indexOf('video/') === 0;
        
        timelineItems.push({
          type: isVideo ? 'video' : 'photo',
          data: {
            ...moment,
            media: item
          }
        });
      });
    }
  });

  timelineItems.forEach(item => {
    const card = createTimelineCard(item);
    if (card) FEED.appendChild(card);
  });

  // Initialize mute state for all videos
  MUTE_STATE.updateAllVideos();
}

// ========== CREATE TIMELINE CARD ==========
function createTimelineCard(item) {
  const container = document.createElement('div');
  container.className = 'timeline-item';

  if (item.type === 'video') {
    const { caption, uploaderName, date, time, media } = item.data;
    const dateDisplay = formatDate(date, time);
    
    const mediaContainer = document.createElement('div');
    mediaContainer.className = 'timeline-item-media timeline-item-video-container';
    
    const fileId = extractGoogleDriveId(media.url);
    const streamUrl = fileId ? `/api/stream?id=${fileId}` : media.url;
    
    const video = document.createElement('video');
    video.className = 'timeline-item-video';
    video.src = streamUrl;
    video.playsinline = true;
    video.muted = MUTE_STATE.muted;
    
    // Video controls overlay
    const controlsOverlay = document.createElement('div');
    controlsOverlay.className = 'video-controls-overlay';
    controlsOverlay.style.display = 'none';
    controlsOverlay.innerHTML = `
      <button class="control-btn mute-btn" title="${MUTE_STATE.muted ? 'Unmute' : 'Mute'}">
        ${MUTE_STATE.muted ? 
          '<svg viewBox="0 0 24 24"><path d="M6.3 7c0-1 .8-1.8 1.8-1.8h.5l6-5.5c.6-.5 1.5-.2 1.5.7v16c0 .9-.9 1.2-1.5.7l-6-5.5h-.5c-1 0-1.8-.8-1.8-1.8V7zm12 0c0 3.5-1.8 6.5-4.5 8.3m0-16.6c2.7 1.8 4.5 4.8 4.5 8.3M18 2l3 3m0 6l3-3"/></svg>' :
          '<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.26 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>'
        }
      </button>
    `;
    
    mediaContainer.appendChild(video);
    mediaContainer.appendChild(controlsOverlay);
    
    // Setup observers and handlers
    setupVideoObserver(video, mediaContainer);
    setupVideoTapHandler(video);
    
    // Mute button handler
    const muteBtn = controlsOverlay.querySelector('.mute-btn');
    muteBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      MUTE_STATE.toggle();
    });
    
    const info = document.createElement('div');
    info.className = 'timeline-item-info';
    info.innerHTML = `
      ${caption ? `<div class="timeline-item-caption">${escapeHtml(caption)}</div>` : ''}
      <div class="timeline-item-meta">${escapeHtml(uploaderName || 'Community Member')} • ${dateDisplay}</div>
    `;
    
    container.appendChild(mediaContainer);
    container.appendChild(info);
    return container;
  }

  if (item.type === 'photo') {
    const { caption, uploaderName, date, time, media } = item.data;
    const dateDisplay = formatDate(date, time);
    
    const mediaContainer = document.createElement('div');
    mediaContainer.className = 'timeline-item-media';
    const img = document.createElement('img');
    img.className = 'timeline-item-image';
    img.src = media.url;
    img.alt = caption || 'Photo';
    img.loading = 'lazy';
    mediaContainer.appendChild(img);
    
    const info = document.createElement('div');
    info.className = 'timeline-item-info';
    info.innerHTML = `
      ${caption ? `<div class="timeline-item-caption">${escapeHtml(caption)}</div>` : ''}
      <div class="timeline-item-meta">${escapeHtml(uploaderName || 'Community Member')} • ${dateDisplay}</div>
    `;
    
    container.appendChild(mediaContainer);
    container.appendChild(info);
    return container;
  }

  if (item.type === 'google_review') {
    const { reviewer, rating, text } = item.data;
    const container = document.createElement('div');
    container.className = 'timeline-item';
    const reviewCard = document.createElement('div');
    reviewCard.className = 'timeline-item-review';
    
    const stars = '★'.repeat(rating || 0) + '☆'.repeat(5 - (rating || 0));
    reviewCard.innerHTML = `
      <div class="timeline-item-review-rating">${stars}</div>
      <div class="timeline-item-review-text">"${escapeHtml(text)}"</div>
      <div class="timeline-item-review-author">— ${escapeHtml(reviewer)}</div>
    `;
    
    container.appendChild(reviewCard);
    return container;
  }

  return container;
}

// ========== FORMAT DATE ==========
function formatDate(date, time) {
  const dayNames = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  let dateObj;
  
  try {
    dateObj = new Date(date);
  } catch (e) {
    return 'Recently';
  }
  
  if (isNaN(dateObj)) return 'Recently';
  
  const day = dayNames[dateObj.getDay()];
  const timeStr = time ? String(time).slice(0, 5) : '';
  
  return timeStr ? `${day} ${timeStr}` : day;
}

// ========== EXTRACT GOOGLE DRIVE ID ==========
function extractGoogleDriveId(rawUrl) {
  if (!rawUrl) return null;
  
  let match = rawUrl.match(/\/file\/d\/([^\/]+)/);
  if (match && match[1]) return match[1];

  match = rawUrl.match(/id=([^&]+)/);
  if (match && match[1]) return match[1];

  match = rawUrl.match(/\/d\/([a-zA-Z0-9_-]+)/);
  if (match && match[1]) return match[1];

  return null;
}

// ========== UPLOAD EXPERIENCE ==========
SHARE_BTN.addEventListener('click', () => {
  UPLOAD_MODAL.classList.add('open');
  UPLOAD_NAME.focus();
});

UPLOAD_CANCEL.addEventListener('click', () => {
  closeUploadModal();
});

UPLOAD_FILE.addEventListener('change', (e) => {
  selectedFiles = Array.from(e.target.files || []);
  updateFilePreview();
});

function updateFilePreview() {
  if (selectedFiles.length > 0) {
    const file = selectedFiles[0];
    if (file.type.startsWith('image/')) {
      const reader = new FileReader();
      reader.onload = (e) => {
        UPLOAD_PREVIEW.src = e.target.result;
        UPLOAD_PREVIEW.classList.add('show');
      };
      reader.readAsDataURL(file);
    } else {
      UPLOAD_PREVIEW.classList.remove('show');
    }
  }
}

UPLOAD_SUBMIT.addEventListener('click', async () => {
  const name = UPLOAD_NAME.value.trim();
  const caption = UPLOAD_CAPTION.value.trim();
  
  if (!name) {
    alert('Please enter your name');
    return;
  }
  
  if (selectedFiles.length === 0) {
    alert('Please select a file');
    return;
  }
  
  const file = selectedFiles[0];
  const formData = new FormData();
  formData.append('action', 'upload');
  formData.append('uploaderName', name);
  formData.append('caption', caption);
  formData.append('file', file);
  
  try {
    UPLOAD_SUBMIT.disabled = true;
    UPLOAD_SUBMIT.textContent = 'Uploading...';
    
    const response = await fetch(APP_SCRIPT_URL, {
      method: 'POST',
      body: formData
    });
    
    const data = await response.json();
    
    if (data.status === 'ok') {
      closeUploadModal();
      fetchMoments();
    } else {
      alert('Upload failed: ' + (data.message || 'Unknown error'));
    }
  } catch (err) {
    console.error('Upload error:', err);
    alert('Upload failed. Please try again.');
  } finally {
    UPLOAD_SUBMIT.disabled = false;
    UPLOAD_SUBMIT.textContent = 'Share';
  }
});

function closeUploadModal() {
  UPLOAD_MODAL.classList.remove('open');
  UPLOAD_NAME.value = '';
  UPLOAD_CAPTION.value = '';
  UPLOAD_FILE.value = '';
  UPLOAD_PREVIEW.classList.remove('show');
  selectedFiles = [];
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && UPLOAD_MODAL.classList.contains('open')) {
    closeUploadModal();
  }
});

// ========== ESCAPE HTML ==========
function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// ========== INIT ==========
fetchMoments();
</script>
