<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>TKG Moments</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">

<script>
(function(){
  try{
    var theme = localStorage.getItem('tkg_theme');
    document.documentElement.setAttribute('data-tkg-theme', theme === 'dark' ? 'dark' : 'light');
  }catch(e){
    document.documentElement.setAttribute('data-tkg-theme', 'light');
  }
})();
</script>

<script>
  if ('serviceWorker' in navigator) {
    let refreshing = false;

    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!refreshing) {
        refreshing = true;
        window.location.reload();
      }
    });

    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' })
        .then((reg) => {
          reg.update();
        })
        .catch((err) => {
          console.error('[SW] Registration failed:', err);
        });
    });
  }
</script>

<style>
:root{
  /* PURE B&W PREMIUM AESTHETIC */
  --page-bg:     #FFFFFF;
  --page-border: #E0E0E0;
  --text-primary: #000000;
  --text-secondary: #666666;
  --text-tertiary: #999999;
  --card-bg: #000000;
  --card-text: #FFFFFF;
  --card-text-soft: rgba(255,255,255,0.8);
  --accent-bg: #1A1A1A;
  --accent-fg: #FFFFFF;
  --ctrl-bg: #000000;
  --ctrl-fg: #FFFFFF;
  --overlay-dark: rgba(0,0,0,0.5);
  --overlay-light: rgba(255,255,255,0.1);
  --border-crisp: rgba(0,0,0,0.12);
  --border-light: rgba(0,0,0,0.06);
  --radius-lg: 16px;
  --radius-md: 8px;
  --max-w: 430px;
  --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
}

html[data-tkg-theme="dark"]{
  --page-bg:     #000000;
  --page-border: #2A2A2A;
  --text-primary: #FFFFFF;
  --text-secondary: #CCCCCC;
  --text-tertiary: #888888;
  --card-bg: #1A1A1A;
  --card-text: #FFFFFF;
  --card-text-soft: rgba(255,255,255,0.7);
  --accent-bg: #2A2A2A;
  --accent-fg: #FFFFFF;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { 
  height: 100dvh; 
  width: 100%; 
  background: var(--page-bg); 
  color: var(--text-primary); 
  font-family: var(--font-body);
}
body { 
  display: flex; 
  justify-content: center;
  overflow: hidden;
}

.moments-app {
  width: 100%;
  max-width: var(--max-w);
  display: flex;
  flex-direction: column;
  height: 100dvh;
  position: relative;
}

.moments-header {
  background: var(--page-bg);
  border-bottom: 1px solid var(--page-border);
  padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 12px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}

.moments-header h1 {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -0.3px;
  flex: 1;
}

.moments-header-btn {
  background: none;
  border: none;
  padding: 8px;
  cursor: pointer;
  font-size: 20px;
  color: var(--text-primary);
}

.moments-content {
  flex: 1;
  overflow-y: scroll;
  scroll-behavior: smooth;
  scrollbar-width: none;
}

.moments-content::-webkit-scrollbar {
  display: none;
}

#momentsFeed {
  display: flex;
  flex-direction: column;
  gap: 24px;
  padding: 16px;
  scroll-snap-type: y mandatory;
}

.timeline-item {
  display: flex;
  flex-direction: column;
  gap: 8px;
  scroll-snap-align: start;
}

.timeline-item-media {
  width: 100%;
  height: auto;
  border-radius: var(--radius-md);
  overflow: hidden;
  background: var(--card-bg);
  display: block;
  border: 1px solid var(--border-crisp);
}

.timeline-item-image {
  width: 100%;
  height: auto;
  display: block;
}

.timeline-item-video-container {
  position: relative;
  width: 100%;
  background: var(--card-bg);
  display: flex;
  align-items: center;
  justify-content: center;
  aspect-ratio: 9 / 16;
  overflow: hidden;
  border: 1px solid var(--border-crisp);
}

.timeline-item-video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  background: var(--card-bg);
  cursor: pointer;
}

.timeline-item-social-embed {
  width: 100%;
  border-radius: var(--radius-md);
  overflow: hidden;
  background: var(--card-bg);
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 400px;
  border: 1px solid var(--border-crisp);
}

.timeline-item-social-embed iframe {
  width: 100%;
  height: 100%;
  border: none;
}

.social-link-card {
  background: var(--card-bg);
  border: 1px solid var(--border-crisp);
  border-radius: var(--radius-md);
  padding: 20px;
  text-align: center;
  color: var(--card-text);
}

.social-link-icon {
  font-size: 32px;
  margin-bottom: 12px;
}

.social-link-title {
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 8px;
}

.social-link-btn {
  display: inline-block;
  background: var(--card-text);
  color: var(--card-bg);
  padding: 8px 16px;
  border-radius: var(--radius-md);
  text-decoration: none;
  font-size: 12px;
  font-weight: 600;
  margin-top: 8px;
}

.engagement-overlay {
  position: absolute;
  right: 12px;
  bottom: 16px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  z-index: 10;
}

.engagement-btn {
  width: 44px;
  height: 44px;
  background: none;
  border: none;
  color: white;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  transition: transform 0.2s ease, opacity 0.2s ease;
  position: relative;
}

.engagement-btn svg {
  width: 28px;
  height: 28px;
  stroke: currentColor;
  stroke-width: 2;
  fill: none;
  filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.3));
  transition: fill 0.2s ease;
}

.engagement-btn:active {
  transform: scale(0.88);
}

.engagement-btn.liked svg {
  fill: currentColor;
  color: #FF1744;
  animation: heartPulse 0.6s ease-out;
}

@keyframes heartPulse {
  0% {
    transform: scale(0.8);
    opacity: 1;
  }
  100% {
    transform: scale(1.4);
    opacity: 0;
  }
}

.video-controls-overlay {
  position: absolute;
  bottom: 16px;
  left: 16px;
  display: flex;
  gap: 12px;
  z-index: 10;
  opacity: 0.9;
  transition: opacity 0.3s ease;
}

.video-controls-overlay:hover {
  opacity: 1;
}

.control-btn {
  background: rgba(0, 0, 0, 0.4);
  border: 1px solid rgba(255, 255, 255, 0.3);
  border-radius: 50%;
  width: 48px;
  height: 48px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: white;
  transition: all 0.2s ease;
  backdrop-filter: blur(8px);
  padding: 0;
  font-size: 0;
}

.control-btn:active {
  background: rgba(0, 0, 0, 0.6);
  transform: scale(0.95);
}

.control-btn svg {
  width: 24px;
  height: 24px;
  fill: currentColor;
}

.control-btn.muted {
  opacity: 0.7;
}

.timeline-item-info {
  padding: 0 4px;
}

.timeline-item-caption {
  font-size: 14px;
  line-height: 1.4;
  color: var(--text-primary);
  margin-bottom: 4px;
  word-wrap: break-word;
}

.timeline-item-meta {
  font-size: 12px;
  color: var(--text-tertiary);
  letter-spacing: -0.2px;
  white-space: normal;
  word-break: break-word;
}

.timeline-item-review {
  background: var(--card-bg);
  border-radius: var(--radius-md);
  padding: 16px;
  border: 1px solid var(--border-crisp);
  border-left: 4px solid #FFFFFF;
}

.timeline-item-review-rating {
  display: flex;
  gap: 4px;
  margin-bottom: 8px;
  font-size: 16px;
}

.timeline-item-review-text {
  font-size: 13px;
  line-height: 1.5;
  color: var(--card-text-soft);
  margin-bottom: 8px;
  font-style: italic;
}

.timeline-item-review-author {
  font-size: 12px;
  color: var(--card-text-soft);
  opacity: 0.8;
}

.upload-modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.5);
  backdrop-filter: blur(4px);
  z-index: 100;
  justify-content: center;
  align-items: flex-end;
}

.upload-modal.open {
  display: flex;
}

.upload-modal-content {
  width: 100%;
  max-width: var(--max-w);
  background: var(--page-bg);
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  padding: 24px 16px;
  max-height: 90dvh;
  overflow-y: auto;
  padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
}

.upload-modal-title {
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 4px;
}

.upload-modal-subtitle {
  font-size: 12px;
  color: var(--text-secondary);
  margin-bottom: 20px;
}

.upload-modal-tabs {
  display: flex;
  gap: 12px;
  margin-bottom: 20px;
  border-bottom: 1px solid var(--page-border);
}

.upload-modal-tab {
  padding: 12px 16px;
  background: none;
  border: none;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-secondary);
  cursor: pointer;
  border-bottom: 3px solid transparent;
  transition: all 0.2s ease;
}

.upload-modal-tab.active {
  color: var(--text-primary);
  border-bottom-color: var(--text-primary);
}

.upload-modal-field {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 16px;
}

.upload-modal-label {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-secondary);
}

.upload-modal-input {
  padding: 12px;
  border: 1px solid var(--page-border);
  border-radius: var(--radius-md);
  background: var(--page-bg);
  color: var(--text-primary);
  font-family: var(--font-body);
  font-size: 14px;
}

.upload-modal-input::placeholder {
  color: var(--text-tertiary);
}

.upload-modal-file {
  display: none;
}

.upload-modal-file-btn {
  display: block;
  width: 100%;
  padding: 12px;
  background: var(--accent-bg);
  color: var(--accent-fg);
  border: none;
  border-radius: var(--radius-md);
  font-weight: 600;
  cursor: pointer;
  font-size: 14px;
}

.upload-modal-file-btn:active {
  opacity: 0.8;
}

.upload-modal-file-list {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 12px;
}

.file-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--accent-bg);
  color: var(--accent-fg);
  padding: 6px 12px;
  border-radius: 16px;
  font-size: 12px;
}

.file-chip-remove {
  cursor: pointer;
  font-weight: bold;
  opacity: 0.8;
}

.file-chip-remove:active {
  opacity: 0.6;
}

.file-counter {
  font-size: 12px;
  color: var(--text-secondary);
  margin-top: 8px;
}

.file-counter.warning {
  color: #FF6B6B;
}

.upload-preview {
  display: none;
  width: 100%;
  max-height: 200px;
  object-fit: cover;
  border-radius: var(--radius-md);
  margin-top: 12px;
}

.upload-preview.show {
  display: block;
}

.upload-progress {
  display: none;
  width: 100%;
  height: 4px;
  background: var(--page-border);
  border-radius: 2px;
  overflow: hidden;
  margin-top: 12px;
}

.upload-progress.show {
  display: block;
}

.upload-progress-bar {
  height: 100%;
  background: var(--text-primary);
  width: 0%;
  transition: width 0.3s ease;
}

.upload-modal-actions {
  display: flex;
  gap: 12px;
  margin-top: 20px;
}

.upload-modal-btn {
  flex: 1;
  padding: 12px;
  border: none;
  border-radius: var(--radius-md);
  font-weight: 600;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.2s ease;
}

.upload-modal-btn.cancel {
  background: var(--page-border);
  color: var(--text-primary);
}

.upload-modal-btn.submit {
  background: var(--accent-bg);
  color: var(--accent-fg);
}

.upload-modal-btn:active {
  transform: scale(0.95);
}

.upload-modal-btn:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.moments-footer {
  background: var(--page-bg);
  border-top: 1px solid var(--page-border);
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
  display: flex;
  justify-content: center;
  gap: 12px;
  flex-shrink: 0;
}

.moments-footer-btn {
  flex: 1;
  padding: 12px;
  background: var(--accent-bg);
  color: var(--accent-fg);
  border: none;
  border-radius: var(--radius-md);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
}

.moments-footer-btn:active {
  transform: scale(0.95);
  opacity: 0.8;
}

.moments-nav {
  display: flex;
  justify-content: space-around;
  align-items: center;
  background: var(--page-bg);
  border-top: 1px solid var(--page-border);
  padding: 8px 0 calc(8px + env(safe-area-inset-bottom, 0px));
  flex-shrink: 0;
}

.moments-nav-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  background: none;
  border: none;
  color: var(--text-secondary);
  font-size: 10px;
  font-weight: 600;
  cursor: pointer;
  padding: 8px 12px;
  text-decoration: none;
  transition: color 0.2s ease;
}

.moments-nav-btn:active {
  transform: scale(0.95);
}

.moments-nav-btn.active {
  color: var(--text-primary);
}

.moments-nav-btn svg {
  width: 24px;
  height: 24px;
  stroke: currentColor;
  stroke-width: 2;
  fill: none;
}

.moments-nav-btn.active svg {
  fill: currentColor;
}

.moments-nav-btn.instagram-btn svg {
  fill: currentColor;
}

</style>
</head>
<body>

<div class="moments-app">

      <span>TKR</span>

    <a href="https://www.instagram.com/the.khichiyagravy" target="_blank" class="moments-nav-btn instagram-btn" title="Instagram">
      <svg viewBox="0 0 24 24"><path d="M7.8 2h8.4C19.4 2 22 4.6 22 7.8v8.4c0 3.2-2.6 5.8-5.8 5.8H7.8C4.6 22 2 19.4 2 16.2V7.8C2 4.6 4.6 2 7.8 2m-.6 2c-2 0-3.6 1.6-3.6 3.6v8.5c0 2 1.6 3.6 3.6 3.6h9.6c2 0 3.6-1.6 3.6-3.6V7.6c0-2-1.6-3.6-3.6-3.6H7.2m9.65 1.5a1.25 1.25 0 0 1 1.25 1.25A1.25 1.25 0 0 1 16.9 6a1.25 1.25 0 0 1-1.25-1.25 1.25 1.25 0 0 1 1.25-1.25M12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10m0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/></svg>
      <span>Instagram</span>

</div>

<script>
// ========== CONFIG ==========
const APP_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxyftcQEeDkU1sf2MJy4Zwj12C9J8z4UVWTY1-ny5HM9HhJ0azlkMt5Gvp-nJXDgtLnLA/exec';
const CACHE_KEY = 'tkg_moments_cache';
const CACHE_DURATION = 5 * 60 * 1000; // 5 minutes
const MAX_FILES = 10;
const MAX_FILE_SIZE = 10 * 1024 * 1024; // 10 MB

// ========== DOM ELEMENTS ==========
const FEED = document.getElementById('momentsFeed');
const SHARE_BTN = document.getElementById('shareBtn');
const UPLOAD_MODAL = document.getElementById('uploadModal');
const UPLOAD_NAME = document.getElementById('uploadName');
const UPLOAD_CAPTION = document.getElementById('uploadCaption');
const UPLOAD_FILE = document.getElementById('uploadFile');
const UPLOAD_CANCEL = document.getElementById('uploadCancelBtn');
const UPLOAD_SUBMIT = document.getElementById('uploadSubmitBtn');
const UPLOAD_PROGRESS = document.getElementById('uploadProgress');
const UPLOAD_PROGRESS_BAR = document.getElementById('uploadProgressBar');
const FILE_LIST = document.getElementById('fileList');
const FILE_COUNTER = document.getElementById('fileCounter');
const UPLOAD_PREVIEW = document.getElementById('uploadPreview');
const SOCIAL_LINK = document.getElementById('socialLink');
const TAB_UPLOAD = document.getElementById('tabUpload');
const TAB_SOCIAL = document.getElementById('tabSocial');
const UPLOAD_PANEL = document.getElementById('uploadPanel');
const SOCIAL_PANEL = document.getElementById('socialPanel');
const BACK_BTN = document.getElementById('backBtn');

// ========== STATE ==========
let selectedFiles = [];
let currentTab = 'upload'; // 'upload' or 'social'
const likedVideos = new Set(JSON.parse(localStorage.getItem('tkg_liked_moments') || '[]'));

const MUTE_STATE = {
  muted: localStorage.getItem('tkg_muted') === 'true',
  listeners: [],
  
  toggle() {
    this.muted = !this.muted;
    localStorage.setItem('tkg_muted', String(this.muted));
    this.notifyListeners();
  },
  
  subscribe(fn) {
    this.listeners.push(fn);
  },
  
  notifyListeners() {
    this.listeners.forEach(fn => fn(this.muted));
  },
  
  updateAllVideos() {
    document.querySelectorAll('.timeline-item-video').forEach(video => {
      video.muted = this.muted;
    });
  }
};

console.log('[Moments] MUTE_STATE initialized:', MUTE_STATE.muted);

// ========== BACK NAVIGATION ==========
BACK_BTN.addEventListener('click', () => {
  window.location.href = './moments_hub.html';
});

// ========== TAB SWITCHING ==========
TAB_UPLOAD.addEventListener('click', () => {
  currentTab = 'upload';
  TAB_UPLOAD.classList.add('active');
  TAB_SOCIAL.classList.remove('active');

// ========== FILE SELECTION ==========
UPLOAD_FILE.addEventListener('change', (e) => {
  selectedFiles = Array.from(e.target.files || []);
  
  if (selectedFiles.length > MAX_FILES) {
    alert(`Maximum ${MAX_FILES} files allowed. ${selectedFiles.length} selected.`);
    selectedFiles = selectedFiles.slice(0, MAX_FILES);
    e.target.value = '';
  }
  
  updateFilePreview();
});

function updateFilePreview() {
  FILE_LIST.innerHTML = '';
  FILE_COUNTER.textContent = `${selectedFiles.length}/${MAX_FILES} files selected`;
  
  if (selectedFiles.length === MAX_FILES) {
    FILE_COUNTER.classList.add('warning');
    FILE_COUNTER.textContent += ' (max reached)';
  } else {
    FILE_COUNTER.classList.remove('warning');
  }
  
  selectedFiles.forEach((file, idx) => {
    const chip = document.createElement('div');
    chip.className = 'file-chip';
    chip.innerHTML = `
      ${file.name.substring(0, 20)}
      <span class="file-chip-remove" data-idx="${idx}">×</span>
    `;
    chip.querySelector('.file-chip-remove').addEventListener('click', () => {
      selectedFiles.splice(idx, 1);
      updateFilePreview();
    });
    FILE_LIST.appendChild(chip);
  });
  
  if (selectedFiles.length > 0) {
    const file = selectedFiles[0];
    if (file.type.startsWith('image/')) {
      const reader = new FileReader();
      reader.onload = (e) => {
        UPLOAD_PREVIEW.src = e.target.result;
        UPLOAD_PREVIEW.classList.add('show');
      };
      reader.readAsDataURL(file);
    } else {
      UPLOAD_PREVIEW.classList.remove('show');
    }
  }
}

// ========== FILE COMPRESSION ==========
async function compressImage(file) {
  if (!file.type.startsWith('image/')) return file;
  
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let width = img.width;
        let height = img.height;
        
        const maxSize = 1200;
        if (width > height) {
          if (width > maxSize) {
            height = (height * maxSize) / width;
            width = maxSize;
          }
        } else {
          if (height > maxSize) {
            width = (width * maxSize) / height;
            height = maxSize;
          }
        }
        
        canvas.width = width;
        canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        
        canvas.toBlob((blob) => {
          resolve(new File([blob], file.name, { type: 'image/jpeg' }));
        }, 'image/jpeg', 0.8);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

// ========== FILE TO BASE64 ==========
function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const base64 = reader.result.split(',')[1];
      resolve(base64);
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// ========== UPLOAD SUBMISSION ==========
UPLOAD_SUBMIT.addEventListener('click', async () => {
  if (currentTab === 'upload') {
    await handleMediaUpload();
  } else {
    await handleSocialLinkSubmit();
  }
});

async function handleMediaUpload() {
  const name = UPLOAD_NAME.value.trim();
  const caption = UPLOAD_CAPTION.value.trim();
  
  if (!name) {
    alert('Please enter your name');
    return;
  }
  
  if (selectedFiles.length === 0) {
    alert('Please select at least one file');
    return;
  }
  
  UPLOAD_SUBMIT.disabled = true;
  UPLOAD_PROGRESS.classList.add('show');
  let uploaded = 0;
  
  try {
    const mediaArray = [];
    
    for (const file of selectedFiles) {
      const compressed = await compressImage(file);
      const base64 = await fileToBase64(compressed);
      
      mediaArray.push({
        fileName: file.name,
        fileType: compressed.type,
        fileData: base64
      });
    }
    
    // Send all files as one JSON payload to Google Apps Script
    const payload = {
      action: 'uploadMoment',
      uploaderName: name,
      caption: caption,
      media: mediaArray
    };
    
    const response = await fetch(APP_SCRIPT_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(payload)
    });
    
    const result = await response.json();
    
    if (result.status !== 'ok') {
      throw new Error(result.message || 'Upload failed');
    }
    
    closeUploadModal();
    localStorage.removeItem(CACHE_KEY);
    fetchMoments();
  } catch (err) {
    console.error('Upload error:', err);
    alert('Upload failed. Please try again.');
  } finally {
    UPLOAD_SUBMIT.disabled = false;
    UPLOAD_PROGRESS.classList.remove('show');
    UPLOAD_PROGRESS_BAR.style.width = '0%';
  }
}

async function handleSocialLinkSubmit() {
  const link = SOCIAL_LINK.value.trim();
  
  if (!link) {
    alert('Please enter a social media link');
    return;
  }
  
  // Validate social link
  const validDomains = ['instagram.com', 'facebook.com', 'youtube.com', 'tiktok.com'];
  const isValidLink = validDomains.some(domain => link.includes(domain));
  
  if (!isValidLink) {
    alert('Please enter a valid Instagram, Facebook, YouTube, or TikTok link');
    return;
  }
  
  UPLOAD_SUBMIT.disabled = true;
  
  try {
    const payload = {
      action: 'submitMomentLink',
      instagramUrl: link // Backend will handle any social link
    };
    
    const response = await fetch(APP_SCRIPT_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(payload)
    });
    
    const result = await response.json();
    
    if (result.status !== 'ok') {
      throw new Error(result.message || 'Submission failed');
    }
    
    closeUploadModal();
    localStorage.removeItem(CACHE_KEY);
    fetchMoments();
  } catch (err) {
    console.error('Social link submit error:', err);
    alert('Submission failed. Please try again.');
  } finally {
    UPLOAD_SUBMIT.disabled = false;
  }
}

  UPLOAD_MODAL.classList.remove('open');
  UPLOAD_NAME.value = '';
  UPLOAD_CAPTION.value = '';
  SOCIAL_LINK.value = '';

// ========== FETCH MOMENTS ==========
async function fetchMoments() {
  try {
    console.log('[Moments] Starting fetch...');
    
    // Check cache first
    const cached = localStorage.getItem(CACHE_KEY);
    if (cached) {
      try {
        const { data, timestamp } = JSON.parse(cached);
        if (Date.now() - timestamp < CACHE_DURATION) {
          console.log('[Moments] Using cached data');
          renderMoments(data);
          return;
        }
      } catch (cacheErr) {
        console.warn('[Moments] Cache parse error, fetching fresh:', cacheErr);
      }
    }

    console.log('[Moments] Fetching from Apps Script...');
    const response = await fetch(`${APP_SCRIPT_URL}?action=moments`);
    
    if (!response.ok) {
      throw new Error(`HTTP ${response.status}: ${response.statusText}`);
    }
    
    const data = await response.json();
    console.log('[Moments] Fetch successful, got', data.moments?.length || 0, 'items');
    
    // Store in cache
    try {
      localStorage.setItem(CACHE_KEY, JSON.stringify({
        data: data.moments || [],
        timestamp: Date.now()
      }));
    } catch (cacheStoreErr) {
      console.warn('[Moments] Failed to cache:', cacheStoreErr);
    }

    renderMoments(data.moments || []);
  } catch (err) {
    console.error('[Moments] Fetch failed:', err);
    
    // Try fallback cache even if expired
    const cached = localStorage.getItem(CACHE_KEY);
    if (cached) {
      try {
        const { data } = JSON.parse(cached);
        console.log('[Moments] Using stale cache as fallback');
        renderMoments(data);
        return;
      } catch (e) {
        console.warn('[Moments] Stale cache also failed');
      }
    }
    
    FEED.innerHTML = '<div style="text-align: center; padding: 40px; color: var(--text-tertiary);">Unable to load moments. Please check your connection and refresh.</div>';
  }
}

// ========== RENDER MOMENTS ==========
function renderMoments(timelineItems) {
  FEED.innerHTML = '';

  if (!timelineItems || timelineItems.length === 0) {
    FEED.innerHTML = '<div style="text-align: center; padding: 40px; color: var(--text-tertiary);">No moments yet. Be the first to share!</div>';
    return;
  }

  MUTE_STATE.subscribe((muted) => {
    document.querySelectorAll('.timeline-item-video').forEach(video => {
      video.muted = muted;
    });
  });

  function setupVideoObserver(video, container) {
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          video.play().catch(() => {});
        } else {
          video.pause();
        }
      });
    }, { threshold: 0.5 });
    
    observer.observe(container);
  }

  function setupVideoTapHandler(video) {
    video.addEventListener('click', (e) => {
      e.stopPropagation();
      if (video.paused) {
        video.play();
      } else {
        video.pause();
      }
    });
  }

  function setupDoubleTapLike(container, cardId) {
    let lastTap = 0;
    container.addEventListener('click', (e) => {
      const now = Date.now();
      if (now - lastTap < 300) {
        e.stopPropagation();
        const likeBtn = container.querySelector('.like-btn');
        if (likeBtn) likeBtn.click();
      }
      lastTap = now;
    });
  }

  function toggleLike(cardId, container) {
    if (likedVideos.has(cardId)) {
      likedVideos.delete(cardId);
    } else {
      likedVideos.add(cardId);
    }
    localStorage.setItem('tkg_liked_moments', JSON.stringify(Array.from(likedVideos)));
    
    const likeBtn = container.querySelector('.like-btn');
    if (likeBtn) {
      likeBtn.classList.toggle('liked');
    }
  }

  timelineItems.forEach((item, idx) => {
    const card = createTimelineCard(item, `card-${idx}`);
    if (card) FEED.appendChild(card);
  });

  MUTE_STATE.updateAllVideos();
}

// ========== CREATE TIMELINE CARD ==========
function createTimelineCard(item, cardId) {
  const container = document.createElement('div');
  container.className = 'timeline-item';

  // Handle social link items (Instagram, Facebook, YouTube, TikTok)
  if (item.type === 'social' || (item.instagramUrl && !item.imageUrl && !item.media)) {
    const url = item.instagramUrl || item.url || '';
    if (!url) return null;
    
    const mediaContainer = document.createElement('div');
    mediaContainer.className = 'timeline-item-media timeline-item-social-embed';
    
    // Detect social platform and create appropriate embed
    let embedHTML = '';
    if (url.includes('instagram.com')) {
      embedHTML = `<div style="padding: 20px; text-align: center;"><div class="social-link-icon">📱</div><div class="social-link-title">Instagram Post</div><a href="${escapeHtml(url)}" target="_blank" class="social-link-btn">View on Instagram →</a></div>`;
    } else if (url.includes('facebook.com')) {
      embedHTML = `<div style="padding: 20px; text-align: center;"><div class="social-link-icon">👍</div><div class="social-link-title">Facebook Post</div><a href="${escapeHtml(url)}" target="_blank" class="social-link-btn">View on Facebook →</a></div>`;
    } else if (url.includes('youtube.com') || url.includes('youtu.be')) {
      embedHTML = `<div style="padding: 20px; text-align: center;"><div class="social-link-icon">▶️</div><div class="social-link-title">YouTube Video</div><a href="${escapeHtml(url)}" target="_blank" class="social-link-btn">Watch on YouTube →</a></div>`;
    } else if (url.includes('tiktok.com')) {
      embedHTML = `<div style="padding: 20px; text-align: center;"><div class="social-link-icon">🎵</div><div class="social-link-title">TikTok Video</div><a href="${escapeHtml(url)}" target="_blank" class="social-link-btn">Watch on TikTok →</a></div>`;
    }
    
    mediaContainer.innerHTML = embedHTML;
    container.appendChild(mediaContainer);
    return container;
  }

  // Handle video items
  if (item.type === 'video' || (item.media && Array.isArray(item.media) && item.media.length > 0 && item.media[0].fileType?.startsWith('video/'))) {
    const caption = item.caption || '';
    const uploaderName = item.uploaderName || 'Community Member';
    const date = item.date || '';
    const time = item.time || '';
    const dateDisplay = formatDate(date, time);
    
    const media = Array.isArray(item.media) ? item.media[0] : (item.media || {});
    const streamUrl = media.url || (media.fileData ? `data:${media.fileType};base64,${media.fileData}` : '');
    
    if (!streamUrl) return null;
    
    const mediaContainer = document.createElement('div');
    mediaContainer.className = 'timeline-item-media timeline-item-video-container';
    
    const video = document.createElement('video');
    video.className = 'timeline-item-video';
    video.src = streamUrl;
    video.playsinline = true;
    video.muted = MUTE_STATE.muted;
    
    const controlsOverlay = document.createElement('div');
    controlsOverlay.className = 'video-controls-overlay';
    controlsOverlay.innerHTML = `
      <button class="control-btn mute-btn" title="${MUTE_STATE.muted ? 'Unmute' : 'Mute'}">
        ${MUTE_STATE.muted ? 
          '<svg viewBox="0 0 24 24"><path d="M6.3 7c0-1 .8-1.8 1.8-1.8h.5l6-5.5c.6-.5 1.5-.2 1.5.7v16c0 .9-.9 1.2-1.5.7l-6-5.5h-.5c-1 0-1.8-.8-1.8-1.8V7zm12 0c0 3.5-1.8 6.5-4.5 8.3m0-16.6c2.7 1.8 4.5 4.8 4.5 8.3M18 2l3 3m0 6l3-3"/></svg>' :
          '<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.26 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>'
        }
      </button>
    `;
    
    const engagementOverlay = document.createElement('div');
    engagementOverlay.className = 'engagement-overlay';
    engagementOverlay.innerHTML = `
      <button class="engagement-btn like-btn ${likedVideos.has(cardId) ? 'liked' : ''}" title="Like">
        <svg viewBox="0 0 24 24">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
        </svg>
      </button>
      <button class="engagement-btn comment-btn" title="Comment">
        <svg viewBox="0 0 24 24">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
      </button>
      <button class="engagement-btn share-btn" title="Share">
        <svg viewBox="0 0 24 24">
          <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8m-4-6l-4-4m0 0L8 6m0 0v6"/>
        </svg>
      </button>
    `;
    
    mediaContainer.appendChild(video);
    mediaContainer.appendChild(controlsOverlay);
    mediaContainer.appendChild(engagementOverlay);
    
    setupVideoObserver(video, mediaContainer);
    setupVideoTapHandler(video);
    setupDoubleTapLike(mediaContainer, cardId);
    
    const muteBtn = controlsOverlay.querySelector('.mute-btn');
    muteBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      MUTE_STATE.toggle();
    });
    
    const likeBtn = engagementOverlay.querySelector('.like-btn');
    likeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleLike(cardId, mediaContainer);
    });
    
    const shareBtn = engagementOverlay.querySelector('.share-btn');
    shareBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      alert('Share feature coming soon');
    });
    
    const info = document.createElement('div');
    info.className = 'timeline-item-info';
    info.innerHTML = `
      ${caption ? `<div class="timeline-item-caption">${escapeHtml(caption)}</div>` : ''}
      <div class="timeline-item-meta">${escapeHtml(uploaderName)} • ${dateDisplay}</div>
    `;
    
    container.appendChild(mediaContainer);
    container.appendChild(info);
    return container;
  }

  // Handle photo items
  if (item.type === 'photo' || (item.media && Array.isArray(item.media) && item.media.length > 0 && item.media[0].fileType?.startsWith('image/'))) {
    const caption = item.caption || '';
    const uploaderName = item.uploaderName || 'Community Member';
    const date = item.date || '';
    const time = item.time || '';
    const dateDisplay = formatDate(date, time);
    
    const media = Array.isArray(item.media) ? item.media[0] : (item.media || {});
    const imgUrl = media.url || (media.fileData ? `data:${media.fileType};base64,${media.fileData}` : '');
    
    if (!imgUrl) return null;
    
    const mediaContainer = document.createElement('div');
    mediaContainer.className = 'timeline-item-media';
    const img = document.createElement('img');
    img.className = 'timeline-item-image';
    img.src = imgUrl;
    img.alt = caption || 'Photo';
    img.loading = 'lazy';
    mediaContainer.appendChild(img);
    
    const info = document.createElement('div');
    info.className = 'timeline-item-info';
    info.innerHTML = `
      ${caption ? `<div class="timeline-item-caption">${escapeHtml(caption)}</div>` : ''}
      <div class="timeline-item-meta">${escapeHtml(uploaderName)} • ${dateDisplay}</div>
    `;
    
    container.appendChild(mediaContainer);
    container.appendChild(info);
    return container;
  }

  return null;
}

// ========== FORMAT DATE ==========
function formatDate(date, time) {
  const dayNames = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  let dateObj;
  
  try {
    dateObj = new Date(date);
  } catch (e) {
    return 'Recently';
  }
  
  if (isNaN(dateObj)) return 'Recently';
  
  const day = dayNames[dateObj.getDay()];
  const timeStr = time ? String(time).slice(0, 5) : '';
  
  return timeStr ? `${day} ${timeStr}` : day;
}

// ========== ESCAPE HTML ==========
function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// ========== INIT ==========
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', () => {
    setTimeout(() => {
      fetchMoments();
    }, 100);
  });
} else {
  setTimeout(() => {
    fetchMoments();
  }, 100);
}
