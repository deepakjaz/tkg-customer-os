<script>
(function(){
  try{
    var theme = localStorage.getItem('tkg_theme');
    document.documentElement.setAttribute('data-tkg-theme', theme === 'dark' ? 'dark' : 'light');
  }catch(e){
    document.documentElement.setAttribute('data-tkg-theme', 'light');
  }

<script>
const APP_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxyftcQEeDkU1sf2MJy4Zwj12C9J8z4UVWTY1-ny5HM9HhJ0azlkMt5Gvp-nJXDgtLnLA/exec';

const FEED = document.getElementById('momentsFeed');
const SHARE_BTN = document.getElementById('shareBtn');
const UPLOAD_MODAL = document.getElementById('uploadModal');
const UPLOAD_NAME = document.getElementById('uploadName');
const UPLOAD_FILE = document.getElementById('uploadFile');
const UPLOAD_CAPTION = document.getElementById('uploadCaption');
const UPLOAD_PREVIEW = document.getElementById('uploadPreview');
const UPLOAD_SUBMIT = document.getElementById('uploadSubmitBtn');
const UPLOAD_CANCEL = document.getElementById('uploadCancelBtn');
const PLAYER = document.getElementById('videoplayer');
const PLAYER_IFRAME = document.getElementById('playerIframe');
const PLAYER_CLOSE = document.getElementById('playerClose');

let moments = [];
let selectedFiles = [];

// ========== HELPER: DYNAMIC DRIVE URL RESOLVER ==========
function getStreamableVideoUrl(rawUrl) {
  if (!rawUrl) return '';
  
  // Convert legacy Google Drive /preview or /view URLs to direct lh3 stream URLs
  const driveIdMatch = rawUrl.match(/\/file\/d\/([^\/]+)/) || rawUrl.match(/id=([^&]+)/);
  if (driveIdMatch && driveIdMatch[1]) {
    return `https://lh3.googleusercontent.com/d/${driveIdMatch[1]}`;
  }
  
  return rawUrl;
}

// ========== FETCH MOMENTS ==========
async function fetchMoments() {
  try {
    const response = await fetch(APP_SCRIPT_URL + '?action=moments');
    if (!response.ok) throw new Error('Network error');
    
    const data = await response.json();
    if (data.status !== 'ok') throw new Error(data.message || 'API error');
    
    moments = data.moments || [];
    renderTimeline();
  } catch (err) {
    console.error('Failed to fetch moments:', err);
    FEED.innerHTML = '<div class="moments-error">Failed to load moments. Please try again later.</div>';
  }
}

// ========== RENDER TIMELINE (CONTENT-TYPE AGNOSTIC) ==========
function renderTimeline() {
  FEED.innerHTML = '';
  
  if (moments.length === 0) {
    FEED.innerHTML = '<div class="moments-empty">No moments shared yet</div>';
    return;
  }

  // Flatten all content into one timeline
  let timelineItems = [];

  moments.forEach((moment) => {
    const type = String(moment.type || 'customer_photo').toLowerCase();
    
    // Handle Google Reviews separately
    if (type === 'google_review' || type === 'review') {
      timelineItems.push({
        type: 'google_review',
        data: moment
      });
      return;
    }

    // Handle customer photos/videos from media array
    if (moment.media && Array.isArray(moment.media)) {
      moment.media.forEach((item) => {
        const mimeType = item.mimeType || 'image/jpeg';
        const isVideo = mimeType.indexOf('video/') === 0;
        
        timelineItems.push({
          type: isVideo ? 'customer_video' : 'customer_photo',
          data: {
            id: moment.id,
            caption: moment.caption || '',
            uploaderName: moment.uploaderName || 'Community Member',
            date: moment.date,
            time: moment.time,
            media: item
          }
        });
      });
      return;
    }

    // Fallback: single imageUrl
    if (moment.imageUrl) {
      timelineItems.push({
        type: 'customer_photo',
        data: {
          id: moment.id,
          caption: moment.caption || '',
          uploaderName: moment.uploaderName || 'Community Member',
          date: moment.date,
          time: moment.time,
          media: { url: moment.imageUrl, mimeType: 'image/jpeg' }
        }
      });
    }
  });

  // Render each timeline item
  timelineItems.forEach((item) => {
    const element = renderTimelineItem(item);
    FEED.appendChild(element);
  });
}

// ========== RENDER SINGLE TIMELINE ITEM (EXTENSIBLE) ==========
function renderTimelineItem(item) {
  const container = document.createElement('div');
  container.className = 'timeline-item';

  if (item.type === 'google_review') {
    // Reuse exact Google Review card from index.html
    const review = item.data;
    const initials = (review.authorName || '?').split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);
    
    container.innerHTML = `
      <div class="cs-review-card">
        <div class="cs-review-top">
          <span class="cs-review-avatar">${initials}</span>
          <span class="cs-review-author">${escapeHtml(review.authorName || 'Anonymous')}</span>
          <span class="cs-review-stars">★${(review.rating || 5).toString().repeat(review.rating || 5)}</span>
        </div>
        <div class="cs-review-quote">${escapeHtml(review.quoteText || '')}</div>
      </div>
    `;
    return container;
  }

  if (item.type === 'customer_photo') {
    const { caption, uploaderName, date, time, media } = item.data;
    const dateDisplay = formatDate(date, time);
    
    container.innerHTML = `
      <div class="timeline-item-media">
        <img class="timeline-item-image" src="${media.url}" alt="Moment" loading="lazy">
      </div>
      <div class="timeline-item-info">
        ${caption ? `<div class="timeline-item-caption">${escapeHtml(caption)}</div>` : ''}
        <div class="timeline-item-meta">${escapeHtml(uploaderName || 'Community Member')} • ${dateDisplay}</div>
      </div>
    `;
    return container;
  }

  if (item.type === 'customer_video') {
    const { caption, uploaderName, date, time, media } = item.data;
    const dateDisplay = formatDate(date, time);
    const thumbnailUrl = media.thumbnailUrl || media.url;
    
    const mediaContainer = document.createElement('div');
    mediaContainer.className = 'timeline-item-media timeline-item-video-container';
    mediaContainer.innerHTML = `
      <img class="timeline-item-video-thumbnail" src="${thumbnailUrl}" alt="Video thumbnail" loading="lazy">
      <button class="timeline-item-video-play" aria-label="Play video">▶</button>
    `;
    
    const playBtn = mediaContainer.querySelector('.timeline-item-video-play');
    playBtn.addEventListener('click', () => openVideoPlayer(media.url));
    
    const info = document.createElement('div');
    info.className = 'timeline-item-info';
    info.innerHTML = `
      ${caption ? `<div class="timeline-item-caption">${escapeHtml(caption)}</div>` : ''}
      <div class="timeline-item-meta">${escapeHtml(uploaderName || 'Community Member')} • ${dateDisplay}</div>
    `;
    
    container.appendChild(mediaContainer);
    container.appendChild(info);
    return container;
  }

  // Fallback for unknown types (allows adding new types later without error)
  return container;
}

// ========== FORMAT DATE ==========
function formatDate(date, time) {
  const dayNames = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  let dateObj;
  
  try {
    dateObj = new Date(date);
  } catch (e) {
    return 'Recently';
  }
  
  if (isNaN(dateObj)) return 'Recently';
  
  const day = dayNames[dateObj.getDay()];
  const timeStr = time ? String(time).slice(0, 5) : ''; // HH:MM format
  
  return timeStr ? `${day} ${timeStr}` : day;
}

// ========== UPLOAD EXPERIENCE ==========
SHARE_BTN.addEventListener('click', () => {
  UPLOAD_MODAL.classList.add('open');
  UPLOAD_NAME.focus();
});

UPLOAD_CANCEL.addEventListener('click', () => {
  closeUploadModal();
});

UPLOAD_FILE.addEventListener('change', (e) => {
  selectedFiles = Array.from(e.target.files || []);
  updatePreview();
});

function updatePreview() {
  UPLOAD_PREVIEW.innerHTML = '';
  selectedFiles.forEach((file, idx) => {
    const container = document.createElement('div');
    container.className = 'upload-preview-item';
    
    const reader = new FileReader();
    reader.onload = (e) => {
      if (file.type.indexOf('video/') === 0) {
        const video = document.createElement('video');
        video.src = e.target.result;
        container.appendChild(video);
      } else {
        const img = document.createElement('img');
        img.src = e.target.result;
        container.appendChild(img);
      }
    };
    reader.readAsDataURL(file);
    
    const removeBtn = document.createElement('button');
    removeBtn.className = 'upload-preview-remove';
    removeBtn.textContent = '✕';
    removeBtn.addEventListener('click', () => {
      selectedFiles.splice(idx, 1);
      updatePreview();
    });
    
    container.appendChild(removeBtn);
    UPLOAD_PREVIEW.appendChild(container);
  });
}

UPLOAD_SUBMIT.addEventListener('click', () => {
  const name = UPLOAD_NAME.value.trim();
  const caption = UPLOAD_CAPTION.value.trim();
  
  if (!name) {
    alert('Please enter your name');
    return;
  }
  
  if (selectedFiles.length === 0) {
    alert('Please select a photo or video');
    return;
  }
  
  uploadMoments(name, caption);
});

async function uploadMoments(name, caption) {
  UPLOAD_SUBMIT.disabled = true;
  UPLOAD_SUBMIT.textContent = 'Uploading...';

  try {
    const media = [];
    
    for (const file of selectedFiles) {
      const base64 = await fileToBase64(file);
      const uploaded = await uploadToAppsScript(base64, file.type);
      
      if (uploaded) {
        media.push({
          url: uploaded.url,
          thumbnailUrl: uploaded.thumbnailUrl,
          mimeType: uploaded.mimeType
        });
      }
    }
    
    if (media.length === 0) {
      throw new Error('Upload failed');
    }

    const payload = {
      action: 'uploadMoment',
      uploaderName: name,
      caption: caption,
      media: media
    };

    const response = await fetch(APP_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });

    if (!response.ok) throw new Error('Submit failed');
    
    // Reload and close
    closeUploadModal();
    fetchMoments();
    alert('Moment shared! 🎉');
  } catch (err) {
    console.error('Upload error:', err);
    alert('Failed to share moment. Please try again.');
  } finally {
    UPLOAD_SUBMIT.disabled = false;
    UPLOAD_SUBMIT.textContent = 'Share';
  }
}

async function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const base64 = reader.result.split(',')[1];
      resolve(base64);
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function uploadToAppsScript(base64, mimeType) {
  const payload = {
    action: 'uploadMomentFile',
    base64Data: base64,
    mimeType: mimeType
  };

  try {
    const response = await fetch(APP_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });

    const data = await response.json();
    return data.status === 'ok' ? { 
      url: data.url, 
      thumbnailUrl: data.thumbnailUrl, 
      mimeType: data.mimeType 
    } : null;
  } catch (err) {
    console.error('File upload error:', err);
    return null;
  }
}

function closeUploadModal() {
  UPLOAD_MODAL.classList.remove('open');
  UPLOAD_NAME.value = '';
  UPLOAD_CAPTION.value = '';
  UPLOAD_FILE.value = '';
  selectedFiles = [];
  UPLOAD_PREVIEW.innerHTML = '';
}

// ========== VIDEO PLAYER ==========
function openVideoPlayer(mediaUrl) {
  const previewUrl = buildGoogleDrivePreviewUrl(mediaUrl);
  PLAYER_IFRAME.src = previewUrl;
  PLAYER.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeVideoPlayer() {
  PLAYER_IFRAME.src = '';
  PLAYER.classList.remove('open');
  document.body.style.overflow = '';
}

function buildGoogleDrivePreviewUrl(rawUrl) {
  if (!rawUrl) return '';
  
  let fileId = null;
  
  // Format 1: Already a preview URL
  if (rawUrl.indexOf('/preview') !== -1) {
    const match = rawUrl.match(/\/file\/d\/([^\/]+)\/preview/);
    if (match && match[1]) fileId = match[1];
  }
  
  // Format 2: /file/d/{ID}
  if (!fileId) {
    const match = rawUrl.match(/\/file\/d\/([^\/]+)/);
    if (match && match[1]) fileId = match[1];
  }
  
  // Format 3: uc?export=download&id={ID}
  if (!fileId) {
    const match = rawUrl.match(/id=([^&]+)/);
    if (match && match[1]) fileId = match[1];
  }
  
  // Format 4: lh3.googleusercontent.com/d/{ID}
  if (!fileId) {
    const match = rawUrl.match(/\/d\/([a-zA-Z0-9_-]+)/);
    if (match && match[1]) fileId = match[1];
  }
  
  if (!fileId) return rawUrl;
  
  return `https://drive.google.com/file/d/${fileId}/preview`;
}

PLAYER_CLOSE.addEventListener('click', closeVideoPlayer);

PLAYER.addEventListener('click', (e) => {
  if (e.target === PLAYER) closeVideoPlayer();
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && PLAYER.classList.contains('open')) {
    closeVideoPlayer();
  }
});

// ========== ESCAPE TO CLOSE MODAL ==========
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && UPLOAD_MODAL.classList.contains('open')) {
    closeUploadModal();
  }
});

// ========== ESCAPE HTML ==========
function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// ========== INIT ==========
fetchMoments();
</script>
